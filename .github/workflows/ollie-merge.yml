name: ollie-merge
# The estate's merger, as a sweep. Ollie is the only non-agent identity that may
# update `main` (bypass actor on the restrict-updates wall; agents are not). This
# workflow runs FROM main on a schedule and, for every enrolled repo, has Ollie
# PUT /merge each pull request that is APPROVED, open, not a draft, and not a fork.
#
# WHY a sweep (not event-driven): the merge key `OLLIE_APP_KEY` is delivered through
# the `default-branch` environment, whose branch policy allows only `main` — a
# deliberate safeguard so a PR-context run can never reach the key. A
# `pull_request_review`-triggered job runs with a PR ref and is therefore correctly
# blocked from the environment. Running from main on a schedule (like margot-deadman)
# gets the key AND covers every repo, with no dependence on native auto-merge (whose
# behavior through the wall is unproven) — it uses the direct PUT /merge path proven
# to clear the wall.
#
# SAFETY IS LAYERED (both hold): (belt) only APPROVED, open, non-draft, same-repo PRs
# are attempted — a held MED/HIGH (Margot COMMENT, no APPROVE) has reviewDecision
# REVIEW_REQUIRED and is skipped; (suspenders) GitHub's rulesets enforce count=1 +
# every required status check on the merge itself (Ollie bypasses ONLY the update
# wall, not the review/checks rulesets), so a not-yet-green approved PR is rejected
# (405/422) and simply retried next sweep — never merged early. Idempotent.
on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *' # ~every 5 min, offset
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ollie-merge
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: default-branch # carries OLLIE_APP_KEY; branch policy = main (this run is main)
    steps:
      - name: Check out dotty for the enrolled-repo list
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: rulesets/default-branch.json
          sparse-checkout-cone-mode: false

      - name: Mint Ollie's token (all enrolled repos)
        id: ollie
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: "4984137"
          private-key: ${{ secrets.OLLIE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write

      - name: Sweep enrolled repos and merge every approved, green PR as Ollie
        env:
          GH_TOKEN: ${{ steps.ollie.outputs.token }}
        run: |
          set -uo pipefail
          merged=0 held=0 skipped=0
          repos=$(jq -r '.repos | keys[]' rulesets/default-branch.json)
          for repo in $repos; do
            # Belt: APPROVED (an eligible reviewer satisfied count=1 — Margot for LOW,
            # the operator for MED/HIGH), open, non-draft, same-repo (isCrossRepository
            # false). A held MED/HIGH is not APPROVED and is filtered out here.
            prs=$(gh pr list --repo "$repo" --state open --limit 100 \
              --json number,reviewDecision,isDraft,isCrossRepository \
              --jq '.[] | select(.reviewDecision=="APPROVED" and .isDraft==false and .isCrossRepository==false) | .number' 2>/dev/null) || {
              echo "WARN: could not list PRs for $repo (skipped, fail-closed)"; continue; }
            for pr in $prs; do
              # Suspenders: GitHub enforces count=1 + required checks on THIS call.
              resp=$(gh api --method PUT "repos/$repo/pulls/$pr/merge" -f merge_method=squash 2>&1)
              if [ $? -eq 0 ]; then
                echo "MERGED $repo#$pr -> $(printf '%s' "$resp" | jq -r '.sha // "?"')"
                merged=$((merged+1))
              elif printf '%s' "$resp" | grep -qiE "already merged|not found"; then
                echo "noop   $repo#$pr (already merged/closed)"; skipped=$((skipped+1))
              else
                echo "held   $repo#$pr (GitHub gate not yet met): $(printf '%s' "$resp" | tr -d '\n' | head -c 200)"
                held=$((held+1))
              fi
            done
          done
          echo "== sweep done: merged=$merged held=$held noop=$skipped =="
