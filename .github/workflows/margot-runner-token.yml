name: Margot runner registration token
# Margot's self-hosted runner lives in a Colima guest on the operator's Mac
# Mini. When that guest is rebuilt, the runner must be re-registered with
# GitHub, which needs a runner REGISTRATION TOKEN — obtainable only with
# `administration: write` on the target repo (allowlisted input). The only
# credential holding that scope is Ollie's GitHub App key (id 4984137,
# OLLIE_APP_KEY), and it is deliberately available ONLY inside this repo's
# Actions (the `default-branch` environment) — it must never reach a host,
# including the Mini itself.
#
# So the registration token is minted IN Actions and handed back to the
# requesting session encrypted to an `age` public key the session supplies
# for this run alone. What the requester ends up holding is a 1-hour,
# single-purpose registration token it cannot read until it decrypts the
# artifact with the matching ephemeral private key — never the App key,
# never a token with any scope beyond registering one runner.
#
# TRUST CONSEQUENCE, STATED PLAINLY: dispatching this workflow is enough to
# obtain a runner registration token for an allowlisted repo. Anyone who can dispatch
# a workflow in `dotty` — the operator, or `claude-the-enduring` acting on
# her behalf — can now do that, a widening from "only an administrator can
# mint this token." Accepted because sessions are the estate's builders and
# the token this path yields can only register a runner; it grants no read
# access to the target repo's code, issues, or settings, and it expires in an
# hour whether or not it is ever used.
#
# Untrusted inputs: `requester_pubkey` and `request_id` come from whoever
# dispatches this workflow and are validated before use, then passed via
# `env` rather than interpolated into any `run:` body — the same
# shell-injection discipline `estate-margot.yml` documents for its own
# trusted-vs-untrusted inputs.

on:
  workflow_dispatch:
    inputs:
      requester_pubkey:
        description: 'age recipient public key (age1...) the minted token is encrypted to'
        type: string
        required: true
      target_repo:
        description: >-
          Which repo the runner registers to. Allowlisted below; anything else fails before a token
          is minted. dotty-private (Margot until extraction), margot (Margot), agent-ops (estate jobs).
        type: choice
        required: true
        default: margot
        options:
          - dotty-private
          - margot
          - agent-ops
      request_id:
        description: 'Opaque id the requester made up — names this run and the output artifact'
        type: string
        required: true

run-name: "margot runner token · ${{ inputs.request_id }}"

permissions:
  contents: read

concurrency:
  group: margot-runner-token-${{ inputs.request_id }}

jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # default-branch environment: the only place OLLIE_APP_KEY is available.
    environment: default-branch
    permissions:
      contents: read
    steps:
      # Inputs are untrusted (anyone who can dispatch this workflow chose
      # them) even though the resulting token is narrowly scoped — fail loud
      # on anything that doesn't match, rather than let a malformed value
      # reach `age` or the API call below.
      - name: Validate inputs
        env:
          REQUESTER_PUBKEY: ${{ inputs.requester_pubkey }}
          REQUEST_ID: ${{ inputs.request_id }}
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          set -euo pipefail
          # The choice input already restricts this; the guard makes the allowlist explicit
          # in the one place the value is used as data.
          case "$TARGET_REPO" in
            dotty-private|margot|agent-ops) ;;
            *) echo "::error::target_repo '$TARGET_REPO' is not an allowlisted runner repo"; exit 1 ;;
          esac
          if ! [[ "$REQUESTER_PUBKEY" =~ ^age1[0-9a-z]{58}$ ]]; then
            echo "::error::requester_pubkey is not a well-formed age recipient key"
            exit 1
          fi
          if ! [[ "$REQUEST_ID" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "::error::request_id contains characters outside [A-Za-z0-9._-] or exceeds 64 characters"
            exit 1
          fi

      # Least privilege for THIS token: administration:write on
      # the TARGET repo ALONE is what a runner registration token needs
      # (POST .../actions/runners/registration-token), and nothing else —
      # no Contents, no Issues, no Checks. Same App (4984137), same mint
      # pattern as margot-deadman.yml and estate-margot.yml.
      - name: Mint Ollie's token, scoped to the target repo's administration
        id: ollie
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: "4984137"
          private-key: ${{ secrets.OLLIE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.target_repo }}
          permission-administration: write

      # Install-method judgment call: apt rather than a pinned release
      # binary. `age` is a stable, widely-packaged tool with no
      # supply-chain-sensitive install surface here (it only ever touches
      # the token after it's already been minted under a narrowly-scoped,
      # short-lived token), so apt's version is judged sufficient for a
      # 5-minute job; nothing upstream of this step depends on a specific
      # `age` version.
      - name: Install age
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age

      # The registration token is masked the instant it exists and is never
      # written to disk or logged unencrypted — it goes from the API
      # response straight into `age` over stdin, and only the ciphertext
      # (token.age) ever touches the filesystem.
      - name: Request the runner registration token and encrypt it
        env:
          GH_TOKEN: ${{ steps.ollie.outputs.token }}
          REQUESTER_PUBKEY: ${{ inputs.requester_pubkey }}
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          set -euo pipefail
          token="$(gh api -X POST "repos/lexijamesesq/${TARGET_REPO}/actions/runners/registration-token" --jq .token)"
          echo "::add-mask::$token"
          printf '%s' "$token" | age -r "$REQUESTER_PUBKEY" -o token.age

      - name: Upload encrypted token
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: margot-runner-token-${{ inputs.request_id }}
          path: token.age
          retention-days: 1
