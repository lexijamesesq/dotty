name: Estate plugin release
# Reusable plugin publication for pushes to main. Version discipline runs
# locally through git-hooks/release-version.sh and check-plugin-version.sh.
# Callers grant contents: write and repeat the workflow's ref in dotty_ref
# so the publisher checks out the release scripts at the same revision.
# Plugins is a JSON array of {path, name} objects; a root plugin uses path ".".
# node_version defaults to 22; wiki passes 24. The CLI version is pinned here.
#
# Example caller (.github/workflows/plugin-release.yml):
#   name: Plugin release
#   on:
#     push:
#       branches: [main]
#   permissions:
#     contents: read
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.sha }}
#     cancel-in-progress: false
#   jobs:
#     release-tag:
#       name: ci
#       permissions:
#         contents: write
#       uses: lexijamesesq/dotty/.github/workflows/estate-plugin-release.yml@v1
#       with:
#         dotty_ref: v1
#         plugins: '[{"path":".","name":"personal"}]'

on:
  workflow_call:
    inputs:
      dotty_ref:
        description: >-
          The exact ref this reusable was called at (the caller's own `uses:`
          ref, repeated here) -- used to check out dotty's release scripts at
          the identical pin.
        required: true
        type: string
      plugins:
        description: >-
          JSON array of the plugins this repo releases, e.g.
          '[{"path":"plugins/core","name":"core"},{"path":"plugins/estate-hooks","name":"estate-hooks"}]'.
          A single-plugin repo at its own root still passes one entry,
          path ".".
        required: true
        type: string
      node_version:
        description: "Node version for the Claude Code CLI install in release-tag. Every caller but wiki pins 22; wiki pins 24 -- pass it explicitly there."
        required: false
        type: string
        default: "22"
      claude_cli_version:
        description: "Claude Code CLI version `claude plugin tag` needs on PATH, pinned here once instead of per caller."
        required: false
        type: string
        default: "2.1.259"

jobs:
  release-tag:
    name: release-tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A pending release run must never be replaced by a later push.
    # Per-commit grouping keeps different push revisions out of the same
    # job-level concurrency group.
    concurrency:
      group: estate-plugin-release-tag-${{ github.sha }}
      cancel-in-progress: false
    steps:
      # Reject malformed plugins input before checkout rather than letting
      # the loop below tag nothing and exit successfully.
      - name: Validate the plugins input
        env:
          PLUGINS_JSON: ${{ inputs.plugins }}
        run: |
          set -uo pipefail
          if ! printf '%s' "$PLUGINS_JSON" | jq -e '
            type == "array" and length > 0 and
            all(.[]; (.path|type) == "string" and (.path|length) > 0
                 and (.name|type) == "string" and (.name|length) > 0)
          ' >/dev/null 2>&1; then
            echo "::error::plugins input must be a non-empty JSON array of {path, name} objects with non-empty string fields. Got: ${PLUGINS_JSON}"
            exit 1
          fi

      - name: Checkout caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout dotty (pinned, for the release scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lexijamesesq/dotty
          ref: ${{ inputs.dotty_ref }}
          path: _dotty

      # claude plugin tag creates an annotated tag (-m), which needs a
      # committer identity; a fresh runner checkout has none configured.
      # Standard github-actions[bot] identity, same as GitHub's own
      # first-party actions use for automated commits/tags.
      - name: Configure git identity for the release tag
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install Claude Code CLI
        env:
          CLI_VERSION: ${{ inputs.claude_cli_version }}
        run: npm install -g "@anthropic-ai/claude-code@${CLI_VERSION}"

      - name: Tag and release every declared plugin whose version isn't tagged yet
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGINS_JSON: ${{ inputs.plugins }}
        run: |
          set -uo pipefail
          FAILED=0
          while IFS=$'\t' read -r dir name; do
            [[ -z "$dir" ]] && continue
            bash "$GITHUB_WORKSPACE/_dotty/.github/scripts/tag-plugin-release.sh" "$dir" "$name" || FAILED=1
          done < <(printf '%s' "$PLUGINS_JSON" | jq -r '.[] | [.path, .name] | @tsv')
          exit "$FAILED"
