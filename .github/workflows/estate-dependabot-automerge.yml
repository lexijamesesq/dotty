name: Dependabot auto-merge (estate)

# The estate's ONE autonomous merge path: a Dependabot pull request merges
# itself once every required check on it is green, with nobody in the loop.
#
# WHAT CHANGED AND WHY. This workflow shipped with a second gate — an explicit
# allowlist of the estate's own reusable-workflow paths, so only a bump of
# estate-ci.yml / estate-gate.yml / this file / setup-gitleaks could auto-merge.
# That gate is RETIRED here, for two receipted reasons rather than for
# smallness:
#
#   1. It no longer names anything real. Callers now pin the estate reusables at
#      the floating `v1` tag that release-on-merge moves, so Dependabot never
#      opens a PR for them again — every path in the allowlist was a path that
#      can no longer appear. What is left in a bump PR is a third-party action's
#      SHA, which the allowlist excluded by design. An allowlist matching only
#      the impossible cases is not a gate.
#   2. It was never the gate doing the work. Gate 2 below — the target repo's
#      own ruleset — is what decides whether a bump merges, and it applies to a
#      third-party bump exactly as it applied to an estate one.
#
# The operator's standing call is the one this now implements: dependency-bot
# PRs skip Margot and auto-merge on green CI.
#
# Fail-closed by two independent gates:
#   1. JOB `if:` — the PR must be AUTHORED and TRIGGERED by dependabot[bot], on
#      a pull_request event. Anything else never enters the job. Exact login
#      match on an enumerated author, never a `[bot]` suffix test, which would
#      hand this path to claude-the-enduring[bot] — the App that opens every
#      agent-authored PR in this estate.
#   2. Branch protection — `--auto` only COMPLETES the merge once every required
#      status check is green. This workflow never bypasses the mechanical floor;
#      it only requests merge-when-green.
#
# The `margot` required check on such a PR is satisfied, not bypassed: dotty's
# estate-margot.yml dispatch posts it as a completed success titled
# "skipped: dependency bot" rather than dispatching a paid review. `margot`
# stays required, with no bypass actor, for every other author. That coupling is
# load-bearing — a repo enrolled here whose margot.yml calls a dotty ref OLDER
# than that change will see its bot PRs wait forever on a check nobody posts.
#
# The decision record is the native GitHub merge + CI history — no separate
# store, per the operator's logging call.
#
# Merge method is --squash (single-purpose bumps); a repo that disallows squash
# surfaces at dogfood, never a silent failure.
#
# GATE 2 IS NOT SELF-ENFORCED HERE: `--auto` only merges-when-green because the
# target repo has an active+strict ruleset requiring its mechanical floor. A
# repo without that (e.g. hazel, which is carved OUT of this rollout) would let
# --auto merge with no real gate. Reading a repo's ruleset at runtime needs
# Administration:read — a scope we deliberately do NOT grant this autonomous
# workflow (worse blast radius than the risk it closes). So gate 2 is enforced
# by a HARD PROCESS RULE instead: this caller is added to a repo ONLY after
# that repo's live ruleset is read and confirmed to require
# `all-checks-passed`, active and strict — never by a generic bootstrap or
# template that could pre-date the ruleset.
#
# An earlier version of this header attributed that rule to a provisioning
# step. There is no such step: `provision-public-repo.sh` has no mention of
# this workflow, and as of 2026-09-17 NO repository in the estate carries a
# caller for it at all — so nothing has ever been guarded by it. The rule is
# real and it is manual, and saying so is the difference between a process rule
# someone can follow and a mechanism someone will assume is running.
#
# dotty's own caller is not in this change, deliberately. A caller must pin a
# ref that exists, and the version of this reusable it needs is the one on main,
# reachable only at the `v1` the merge of this change creates. A caller pinned
# at a not-yet-existing ref does not skip — GitHub resolves `uses:` when it
# creates the run, BEFORE any job `if:` is read, so the whole workflow file
# fails. Receipted on this branch: run 35286171540, conclusion failure, zero
# jobs, on a pull request that had nothing to do with Dependabot. The caller
# lands in the follow-up that moves the estate's pins to `@v1`, by which time
# `v1` resolves. dotty's ruleset was read live for the rule above — 18644207:
# enforcement active, strict_required_status_checks_policy true,
# `all-checks-passed` required.

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    steps:
      - name: Request merge-when-green
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
