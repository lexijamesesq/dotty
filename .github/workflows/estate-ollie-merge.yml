name: Estate Ollie merge (retired)
# Retired: the agent Ollie lands pull requests now, through GitHub's own rules,
# from eve-deploy's agents/ollie. This lane merged nothing after the cutover;
# it stays, a no-op, only because every enrolled repository's ollie-merge.yml
# still calls it at @v1, and a caller of a missing reusable workflow fails. Its
# callers, this file and ollie-state.py go in the cutover's cleanup.
#
# The interface is unchanged so no caller breaks: the `pr` input, and the
# OLLIE_APP_KEY secret every caller still passes (a secret passed to a reusable
# workflow that doesn't declare it fails the caller's run). Nothing here reads
# either, mints a token, or calls GitHub.

on:
  workflow_call:
    inputs:
      pr:
        description: Pull request number in the calling repository (unused).
        required: true
        type: string
    secrets:
      OLLIE_APP_KEY:
        required: false
        description: >-
          Still passed by callers; unused since the lane retired.

permissions:
  contents: read

jobs:
  merge:
    name: Execute Merge
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: The merge lane is retired; the agent Ollie lands pull requests
        env:
          PR: ${{ inputs.pr }}
        run: |
          echo "::notice::Not merged by this lane (#${PR}): the Actions merge lane is retired, and the agent Ollie lands pull requests."
