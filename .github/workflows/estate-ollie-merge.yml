name: Estate Ollie merge (trusted lane)
# Reusable: a repo's own ollie-merge.yml caller invokes this to have the
# ollie-the-intern App merge ONE pull request. It is the only place the App's
# merge happens. One GitHub API call — PUT /pulls/{n}/merge — made with Ollie's
# installation token. GitHub enforces every branch rule AT that call (required
# checks green, the required approving review, no stale review), so nothing here
# re-decides mergeability: a precondition not yet met returns 405/422 and THAT is
# the gate; the caller's next qualifying event re-raises the attempt. A call on an
# already-merged PR is a no-op the same way. No state, no polling, no retry loop.
# The single policy the App applies itself is fork exclusion (see the merge step):
# GitHub does not gate merges on fork origin, so that one check lives here, once,
# for every trigger.
#
# Why Ollie can merge and nobody else: the restrict-updates ruleset on main lists
# Ollie (and the operator) as its only bypass actors — the wall. Ollie is NOT a
# bypass actor on the review or checks rulesets, so this call can only land a PR
# those rules already allow.
#
# Trust class: like estate-margot, a workflow_call reusable resolved from the
# caller's default branch, run in a `default-branch`-environment job so the merge
# key is never reachable from a PR-context run. The App key is passed by the
# caller as a secret (the OPERATOR_RULES / MARGOT_APP_KEY pass-through shape).

on:
  workflow_call:
    inputs:
      pr:
        description: Pull request number in the calling repository.
        required: true
        type: string
    secrets:
      OLLIE_APP_KEY:
        required: true
        description: >-
          ollie-the-intern GitHub App private key. Delivered as a default-branch
          environment secret and passed through by the caller.

permissions:
  contents: read

env:
  # Ollie's public GitHub App id — NOT a secret (the same id renovate.yml,
  # converge-on-merge.yml and margot-deadman.yml mint). Only the key is secret.
  OLLIE_APP_ID: "4984137"

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # default-branch environment: carries OLLIE_APP_KEY; its branch policy is the
    # default branch, which is why the caller only reaches here from a
    # default-branch-context event.
    environment: default-branch
    steps:
      - name: Mint Ollie's token (this repository only)
        id: ollie
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.OLLIE_APP_ID }}
          private-key: ${{ secrets.OLLIE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Ollie merges the pull request (GitHub's rules are the gate)
        env:
          GH_TOKEN: ${{ steps.ollie.outputs.token }}
          PR: ${{ inputs.pr }}
        run: |
          set -uo pipefail
          # Estate POLICY, not a mergeability decision: a fork pull request is never
          # merged by the App. Fork origin is not a branch rule GitHub enforces at
          # PUT /merge (an approved, green fork PR is as mergeable as any other), so
          # this is the one guard that lives in code — here, once, so every caller
          # trigger (check_suite, workflow_dispatch, the review bounce) gets it
          # identically. Fails closed: an unreadable PR is treated as a fork.
          pr_json=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isCrossRepository,reviewDecision 2>/dev/null || echo '')
          # jq's `//` treats false as absent, so the fork flag is compared, not
          # defaulted: only a literal false reads as same-repo.
          fork=$(printf '%s' "$pr_json" | jq -r 'if .isCrossRepository == false then "false" else "true" end' 2>/dev/null || echo true)
          [ -n "$fork" ] || fork=true
          decision=$(printf '%s' "$pr_json" | jq -r '.reviewDecision // ""' 2>/dev/null || echo '')
          if [ "$fork" != "false" ]; then
            echo "refused #${PR}: cross-repository (fork) pull request — estate policy, not merged by the App"
            exit 0
          fi

          # Visibility on the pull request itself. A refusal used to live only in
          # this run's log, so from the PR page an approval that "did nothing"
          # looked like Ollie being broken, and the operator's reflex was the
          # admin bypass (receipted 2026-09-25: a PR refused for a failing
          # required check was bypass-merged; the fix was one lint line). So a
          # refusal on an ALREADY-APPROVED pull request — the only case where a
          # human is waiting — is written to the PR as one review comment from
          # Ollie, upserted (never a pile), naming GitHub's reason and the
          # re-init path. Before approval, refusals stay in the log: "review
          # required" on every check-suite completion is noise, not signal.
          # A review comment, not an issue comment: it needs only the
          # pull-requests:write the merge token already carries. Best effort —
          # a failed post is a warning, never a failed run; the merge outcome is
          # decided above this, by GitHub.
          marker='<!-- ollie-merge:refusal -->'
          upsert_note() { # <body>
            local body="$1" rid
            rid=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews?per_page=100" \
              --jq "[.[] | select(.body | startswith(\"${marker}\"))] | .[0].id // empty" 2>/dev/null || true)
            if [ -n "$rid" ]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews/${rid}" -f body="$body" >/dev/null 2>&1 \
                || echo "::warning::could not update Ollie's refusal note on #${PR}"
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" -f event=COMMENT -f body="$body" >/dev/null 2>&1 \
                || echo "::warning::could not post Ollie's refusal note on #${PR}"
            fi
          }

          # A refused merge is the gate working, not a failure of this run: the
          # step runs under the runner's default `bash -e`, so the call sits in
          # the `if` condition, where a non-zero exit is a branch, not an abort.
          # Only GitHub's own refusals end green — the header's 405/422 (a
          # precondition not yet met: review or checks outstanding, the PR
          # already closed or merged) and 409 (the head moved under us).
          # Anything else — auth, permission, outage, an unknown PR — is a
          # genuine error and fails the run loudly.
          if resp=$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR}/merge" -f merge_method=squash 2>&1); then
            sha=$(printf '%s' "$resp" | jq -r '.sha // "?"')
            echo "merged #${PR}: ${sha}"
            # An earlier refusal note would now be stale; say what happened.
            prior=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews?per_page=100" \
              --jq "[.[] | select(.body | startswith(\"${marker}\"))] | length" 2>/dev/null || echo 0)
            if [ "${prior:-0}" != "0" ]; then
              upsert_note "${marker}
          **Resolved — Ollie merged this pull request** (\`${sha}\`)."
            fi
          else
            one_line=$(printf '%s' "$resp" | tr -d '\n' | head -c 300)
            case "$resp" in
              *"(HTTP 405)"*|*"(HTTP 409)"*|*"(HTTP 422)"*)
                echo "not merged #${PR} — GitHub's gate: ${one_line}"
                if [ "$decision" = "APPROVED" ]; then
                  # GitHub's own words, from the JSON body that precedes gh's
                  # one-line summary in the captured output.
                  # Shielded like every other call in this block: under `bash -e`
                  # with pipefail, a body jq cannot parse would otherwise abort
                  # the run before the note is written.
                  reason=$(printf '%s' "${resp%%\}gh: *}}" | jq -r '.message // empty' 2>/dev/null | tr '\n' ' ' | sed 's/  */ /g; s/ *$//') || reason=""
                  [ -n "$reason" ] || reason="$one_line"
                  upsert_note "${marker}
          **Ollie was refused by GitHub's gate and did not merge this pull request.**

          > ${reason}

          Ollie retries on its own at the next completed check suite (a push that fixes what the gate names) or the next review. To retry now: Actions → *Ollie merge* → *Run workflow* with \`pr=${PR}\`. A bypass is not the fix — the gate's reason is."
                fi ;;
              *)
                echo "::error::merge call failed for #${PR} (not a gate refusal): ${one_line}"
                exit 1 ;;
            esac
          fi
