name: Renovate
# Self-hosted Renovate, running as Ollie — The Intern. Replaces the hosted Mend
# Renovate app (Integration 2740), uninstalled as part of this change.
#
# Renovate only opens and updates bump PRs; it merges nothing itself and arms no
# auto-merge (`automerge: false` in the preset). Each bump goes through Margot
# like any PR, and Ollie lands it once Margot's APPROVE and the required checks
# are in, as it lands every PR. Renovate runs under Ollie's App identity, so its
# PRs show Ollie as their author. Ollie bypasses only `Protect main — updates`,
# never the review or checks rulesets. The cron is the poll for new third-party
# versions, not merge latency.

on:
  # `on: release` never fires — releases are cut with GITHUB_TOKEN, which starts
  # no workflows. Third-party bumps need the poll; nothing signals those at all.
  workflow_run:
    workflows: ["Release on merge"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Renovate holds no cross-process lock; two concurrent runs over one repo list
  # is the two-engines hazard.
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: default-branch  # carries OLLIE_APP_KEY
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Derived from the declared JSON so it cannot drift from the repos this
      # estate enrolls. Passed as an env var rather than `require`d in the
      # config file, which the action mounts ALONE into the container — a
      # relative require there cannot resolve. RENOVATE_* is forwarded by default.
      - name: Derive the enrolled repository list
        run: |
          set -euo pipefail
          repos="$(jq -r '.repos | keys | join(",")' rulesets/default-branch.json)"
          echo "RENOVATE_REPOSITORIES=$repos" >> "$GITHUB_ENV"
          echo "Renovate will run over: $repos"

      # NO Administration, deliberately — this lane cannot rewrite the rulesets
      # it merges under. Checks is READ, so Ollie
      # cannot post the green it merges on. Workflows write is load-bearing: the
      # preset pins action digests, so every bump writes in .github/workflows/.
      # Statuses is READ, never write — Renovate posts no commit status under this
      # config (verified: merged bumps #299/#304 posted zero). READ stays: under
      # the old automerge config Renovate read the branch's combined status
      # before ensuring a PR (GET commits/{ref}/status, which needs Commit
      # statuses: read), and a private repo refused it with
      # `integration-unauthorized`, which failed every private repo's PR once
      # the write scope was dropped. Whether it still reads it with automerge off
      # is unverified, and a read grant costs nothing, so it is kept. The mint here and Ollie's App grant must
      # move together: minting a scope the App lacks fails the run.
      - name: Mint Ollie's token
        id: ollie
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: "4984137"
          private-key: ${{ secrets.OLLIE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-issues: write
          permission-checks: read
          permission-statuses: read
          permission-metadata: read

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          configurationFile: renovate-config.js
          token: ${{ steps.ollie.outputs.token }}
