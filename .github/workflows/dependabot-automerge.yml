name: Dependabot auto-merge
# Thin per-repo caller, the same shape as ci.yml / gate.yml / margot.yml: name +
# triggers live here, the job lives in the estate reusable.
#
# dotty had no caller at all — it published the reusable and never called it, so
# its own Dependabot PRs had no merge path. Adding it here is what makes the next
# Dependabot PR in this repository the live proof that the pipe works end to end.
#
# Pinned at `v1`, the floating major tag release-on-merge moves. That is the
# channel this change exists to establish, and the reusable this caller needs is
# the one on main, not the one at the last calendar tag. `v1` is created by the
# release this very merge triggers.

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # The author test is ALSO the reusable's own first gate, and it is repeated
    # here for a receipted reason rather than for belt and braces. A job's `if:`
    # is evaluated BEFORE its `uses:` is resolved, so a false condition means
    # the reusable is never loaded at all. Without this line every pull request
    # in this repository fails on an unresolvable `@v1` until the tag exists —
    # proven on this branch, runs at 7a04a24d, 2bec6770 and 6638f951, three red
    # workflow runs on a pull request that had nothing to do with Dependabot.
    # After merge the release creates `v1` and the bot path resolves normally;
    # this keeps every other pull request out of the resolution entirely.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: lexijamesesq/dotty/.github/workflows/estate-dependabot-automerge.yml@v1
