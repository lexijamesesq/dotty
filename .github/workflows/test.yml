name: Tests
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  eval-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The gitleaks-hooks suite drives the REAL pre-commit pre-push shim, so it
      # requires pre-commit on PATH. Pinned to the version the hooks were
      # validated against. The suite hard-fails (never skips) if it is absent.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pre-commit 4.6.0
        run: |
          pip install pre-commit==4.6.0
          pre-commit --version
      # The gitleaks-hooks suite requires the real scanner; a missing binary is
      # a hard suite failure, never a silent skip. Pinned to the version the
      # hooks were validated against, integrity-checked against the release's
      # own checksums file.
      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          ver=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${ver}"
          tmp="$(mktemp -d)"
          cd "$tmp"
          curl -sSfL -o gitleaks.tar.gz "${base}/gitleaks_${ver}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${ver}_checksums.txt"
          grep "gitleaks_${ver}_linux_x64.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run eval suite
        run: bash .claude/eval/run-all.sh
