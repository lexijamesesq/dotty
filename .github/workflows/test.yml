name: Tests
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  eval-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv 0.11.22
        run: pip install uv==0.11.22
      - name: ruff
        run: uvx ruff@0.16.5 check --force-exclude .
      - name: shellcheck
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck
      # Pinned to a known release, integrity-checked against its own checksums
      # file — same pattern as the gitleaks install below.
      - name: Install actionlint 1.7.12
        run: |
          set -euo pipefail
          ver=1.7.12
          base="https://github.com/rhysd/actionlint/releases/download/v${ver}"
          tmp="$(mktemp -d)"
          cd "$tmp"
          tarball="actionlint_${ver}_linux_amd64.tar.gz"
          curl -sSfL -o "$tarball" "${base}/${tarball}"
          curl -sSfL -o checksums.txt "${base}/actionlint_${ver}_checksums.txt"
          line="$(grep -E "[[:space:]]${tarball}\$" checksums.txt)"
          [ "$(printf '%s\n' "$line" | wc -l)" -eq 1 ]   # exactly one match, or fail
          printf '%s\n' "$line" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint -version
      - name: actionlint
        run: actionlint
      - name: house-qa test suite
        run: python3 .claude/skills/house-qa/tests/run_tests.py
      - name: linear scripts pytest suite
        working-directory: .claude/skills/linear/scripts
        run: uvx pytest@9.1.1 tests
      # The gitleaks-hooks suite drives the REAL pre-commit pre-push shim, so it
      # requires pre-commit on PATH. Pinned to the version the hooks were
      # validated against. The suite hard-fails (never skips) if it is absent.
      - name: Install pre-commit 4.6.0
        run: |
          pip install pre-commit==4.6.0
          pre-commit --version
      # The gitleaks-hooks suite requires the real scanner; a missing binary is
      # a hard suite failure, never a silent skip. Pinned to the version the
      # hooks were validated against, integrity-checked against the release's
      # own checksums file.
      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          ver=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${ver}"
          tmp="$(mktemp -d)"
          cd "$tmp"
          # Keep the release's own filename. `sha256sum -c` reads the FILENAME
          # from the checksums line and opens that path — downloading to a
          # different name makes it fail to open the very file it is verifying.
          tarball="gitleaks_${ver}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "${base}/${tarball}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${ver}_checksums.txt"
          line="$(grep -E "[[:space:]]${tarball}\$" checksums.txt)"
          [ "$(printf '%s\n' "$line" | wc -l)" -eq 1 ]   # exactly one match, or fail
          printf '%s\n' "$line" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run eval suite
        run: bash .claude/eval/run-all.sh
