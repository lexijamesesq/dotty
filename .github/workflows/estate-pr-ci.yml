name: Estate PR checks

# Migrated callers invoke this from pull_request_target, including edited.
# PR checkout content is data only; every executable/config comes from trusted pins.
on:
  workflow_call:
    secrets:
      OPERATOR_RULES:
        required: true
      MARGOT_APP_KEY:
        required: true
      MARGOT_JEV_KEY:
        required: true
      MARGOT_ANTHROPIC_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

env:
  MARGOT_CLIENT_ID: Iv23likfz26p91MxhrdY
  # Immutable instance; the native CI floor transition must precede installation.
  MARGOT_INSTANCE_REF: v0.12.0

jobs:
  checks:
    name: pre-merge checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: default-branch
    concurrency:
      group: estate-pr-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Require a same-repository trusted PR event
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$EVENT" == pull_request_target && "$HEAD_REPO" == "$REPOSITORY" ]]
          case "$ACTION" in opened|synchronize|reopened|ready_for_review|edited) ;; *) exit 1 ;; esac
      - name: Checkout the actual reusable producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _dotty
          persist-credentials: false
      - name: Read the pinned private instance
        id: instance-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.MARGOT_CLIENT_ID }}
          private-key: ${{ secrets.MARGOT_APP_KEY }}
          repositories: margot
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lexijamesesq/margot
          ref: refs/tags/${{ env.MARGOT_INSTANCE_REF }}
          token: ${{ steps.instance-token.outputs.token }}
          path: _margot
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: ./_margot/.github/actions/bootstrap
        with:
          role: hosted
          review-tools: "true"
      - name: Resolve trusted enrollment and policy
        id: route
        env:
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          jq -er --arg repo "$TARGET_REPO" \
            --slurpfile rulesets _dotty/rulesets/default-branch.json \
            -f _margot/.github/instance/route.jq \
            _margot/.github/instance/deployment.json >> "$GITHUB_OUTPUT"
      - name: Mint read-only target evidence token
        id: read
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.MARGOT_CLIENT_ID }}
          private-key: ${{ secrets.MARGOT_APP_KEY }}
          repositories: ${{ steps.route.outputs.repository_name }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: read
          permission-actions: read
      - name: Mint target check publisher token
        id: write
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.MARGOT_CLIENT_ID }}
          private-key: ${{ secrets.MARGOT_APP_KEY }}
          repositories: ${{ steps.route.outputs.repository_name }}
          permission-checks: write
      - name: Mint review dispatch token
        id: dispatch
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.MARGOT_CLIENT_ID }}
          private-key: ${{ secrets.MARGOT_APP_KEY }}
          repositories: margot
          permission-actions: write
          permission-contents: read
      - name: Bind the live PR from trusted configuration
        id: bind
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          TARGET_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRED_CHECKS: ${{ steps.route.outputs.required_checks }}
          REQUIRED_REPORTERS: ${{ steps.route.outputs.required_check_reporters }}
          ALLOWED_SKIPS: ${{ steps.route.outputs.allowed_skipped_checks }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          jq --arg root "$MARGOT_ROOT" \
            'walk(if type == "string" then gsub("\\$\\{MARGOT_ROOT\\}"; $root) else . end)' \
            _margot/.github/instance/config.json > "$MARGOT_ROOT/bound-input"
          "$MARGOT_ROOT/node_modules/.bin/margot-instance" bind-request \
            --repository "$TARGET_REPO" --pr "$PR_NUMBER" --head "$HEAD_SHA" \
            --phase triage --authority true --margot-root "$MARGOT_ROOT" \
            --config "$MARGOT_ROOT/bound-input" --run-url "$RUN_URL" \
            --required-checks "$REQUIRED_CHECKS" --required-check-reporters "$REQUIRED_REPORTERS" \
            --allowed-skipped-checks "$ALLOWED_SKIPS"
          jq -er '.base as $base | .head as $head | "base_sha=\($base)\nhead_sha=\($head)"' \
            "$MARGOT_ROOT/request.json" >> "$GITHUB_OUTPUT"
      - name: Read the bound PR text
        id: snapshot
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          TARGET_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/$TARGET_REPO/pulls/$PR_NUMBER" > "$MARGOT_ROOT/scanned-pull.json"
          jq -e --slurpfile request "$MARGOT_ROOT/request.json" '
            .state == "open" and .draft == false and .head.sha == $request[0].head and .base.sha == $request[0].base
            and .head.repo.full_name == $request[0].repository
            and .base.repo.full_name == $request[0].repository
            and .number == $request[0].pr' "$MARGOT_ROOT/scanned-pull.json" > /dev/null
          jq -er '[.title, (.body // ""), .head.ref, .base.ref] | .[]' \
            "$MARGOT_ROOT/scanned-pull.json" > "$MARGOT_ROOT/pr-text"
      - name: Checkout bound PR history as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.bind.outputs.head_sha }}
          token: ${{ steps.read.outputs.token }}
          fetch-depth: 0
          path: repo
          persist-credentials: false
      - uses: ./_dotty/.github/actions/setup-gitleaks
      - name: Scan the bound history and commit messages
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          OPERATOR_RULES: ${{ secrets.OPERATOR_RULES }}
          TARGET_REPO: ${{ github.repository }}
          BASE_SHA: ${{ steps.bind.outputs.base_sha }}
          HEAD_SHA: ${{ steps.bind.outputs.head_sha }}
        run: bash _dotty/.github/scripts/estate-pr-scan.sh history "$GITHUB_WORKSPACE/repo" "$TARGET_REPO" "$BASE_SHA" "$HEAD_SHA"
      - name: Scan the bound PR title, body and branch names
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          OPERATOR_RULES: ${{ secrets.OPERATOR_RULES }}
          TARGET_REPO: ${{ github.repository }}
        run: bash _dotty/.github/scripts/estate-pr-scan.sh text "$GITHUB_WORKSPACE/repo" "$TARGET_REPO" "$MARGOT_ROOT/pr-text"
      - name: Classify once with bounded provider fallback
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          MARGOT_WRITE_TOKEN: ${{ steps.write.outputs.token }}
          JEV_KEY: ${{ secrets.MARGOT_JEV_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.MARGOT_ANTHROPIC_TOKEN }}
        run: |
          "$MARGOT_ROOT/node_modules/.bin/margot-review" \
            "$MARGOT_ROOT/request.json" "$MARGOT_ROOT/config.json" "$MARGOT_ROOT/result.json"
      - name: Require the authenticated classification result
        id: classification
        run: |
          set -euo pipefail
          jq -er --slurpfile request "$MARGOT_ROOT/request.json" '
            .result | select(.kind == "classified" and .request == $request[0])
            | select(.classification == "mechanical" or .classification == "documentation" or .classification == "functional")
            | select(.decision_source == "jev" or .decision_source == "fallback")
            | .triage_check_id | select(type == "number" and . > 0 and floor == .)
            | "triage_check_id=\(.)"' "$MARGOT_ROOT/result.json" >> "$GITHUB_OUTPUT"
      - name: Revalidate the scanned PR and dispatch review once
        id: handoff
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          MARGOT_DISPATCH_TOKEN: ${{ steps.dispatch.outputs.token }}
          TRIAGE_CHECK_ID: ${{ steps.classification.outputs.triage_check_id }}
          TARGET_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/$TARGET_REPO/pulls/$PR_NUMBER" > "$MARGOT_ROOT/current-pull.json"
          jq -e --slurpfile scanned "$MARGOT_ROOT/scanned-pull.json" \
            --slurpfile request "$MARGOT_ROOT/request.json" '
            .state == "open" and .draft == false and .head.sha == $request[0].head and .base.sha == $request[0].base
            and .head.repo.full_name == $request[0].repository
            and .base.repo.full_name == $request[0].repository
            and .number == $request[0].pr
            and [.title, (.body // ""), .head.ref, .base.ref]
                == [$scanned[0].title, ($scanned[0].body // ""), $scanned[0].head.ref, $scanned[0].base.ref]' \
            "$MARGOT_ROOT/current-pull.json" > /dev/null
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const root = process.env.MARGOT_ROOT;
          const request = JSON.parse(readFileSync(`${root}/request.json`, 'utf8'));
          const target = JSON.parse(readFileSync(`${root}/config.json`, 'utf8')).handoff;
          const check = Number(process.env.TRIAGE_CHECK_ID);
          if (!Number.isSafeInteger(check) || check < 1 || target.ref !== request.workflowRef)
            throw new Error('Invalid classification handoff');
          const inputs = {repo: request.repository, pr: String(request.pr), sha: request.head,
            base_sha: request.base, triage_check_id: String(check), workflow_ref: target.ref};
          writeFileSync(`${root}/dispatch.json`, JSON.stringify({ref: target.ref, inputs}), {mode: 0o600});
          NODE
          endpoint=$(jq -er '.handoff | "repos/\(.repository)/actions/workflows/\(.workflow)/dispatches"' "$MARGOT_ROOT/config.json")
          # A lost response fails this invocation; explicit native rerun repeats all work.
          GH_TOKEN="$MARGOT_DISPATCH_TOKEN" gh api --method POST "$endpoint" --input "$MARGOT_ROOT/dispatch.json"
      - name: Remove invocation files
        if: always()
        env:
          ROOT: ${{ runner.temp }}/margot-${{ github.run_id }}-${{ github.run_attempt }}-hosted
        run: rm -rf "$ROOT"
