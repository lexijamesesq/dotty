name: Estate resident scan (scheduled backstop)
# The scheduled DEFAULT-BRANCH resident secret/PII backstop — the whole-tree
# coverage the diff-scoped PR gate (estate-ci.yml / estate-gate.yml, both now
# gitleaks-range-scan.sh over base..head) structurally cannot give: content
# resident before range-scanning existed, and already-merged content a NEWLY
# ADDED operator pattern would flag. Relocated OFF the per-push path onto a
# schedule, so it keeps that coverage WITHOUT the per-push re-report that was
# incident #2's noise, and WITHOUT any range/history logic (it scans one
# tree-ish: HEAD of the default branch).
#
# workflow_call target — each repo adds a thin scheduled caller (see dotty's
# own .github/workflows/resident-scan.yml). Runs the operator overlay from the
# environment secret ONLY for the public-repo overlay pass; a verified-private
# repo runs base-rules only (the operator overlay's identity/roster rules are
# never loaded, so a repo that legitimately holds those patterns — e.g.
# dotty-private's gitleaks-registry — is never re-flagged; same posture the PR
# trusted lane already ships via GATE_SKIP_OVERLAY). All scan logic lives in the
# pinned _dotty git-hooks (gitleaks-resident-scan.sh); this workflow never
# executes anything from the scanned repo's own tree.
#
# On findings: fail the run AND open/update ONE operator-assigned issue labelled
# `resident-scan`, whose body carries the de-duped `<rule-id> — <file>:<line>`
# list (values withheld) — structured so a human, or a later autonomous fixer,
# can act on it directly. On a clean run: auto-close any open such issue. One
# issue per repo, always current, never duplicated.

on:
  workflow_call:
    inputs:
      dotty_ref:
        description: >-
          The exact commit this reusable workflow was called at (the SHA in the
          caller's own `uses: .../estate-resident-scan.yml@<sha>` line, repeated
          here) — used to check out dotty's git-hooks/*.sh at the identical pin.
        required: true
        type: string
    secrets:
      OPERATOR_RULES:
        required: false
        description: >-
          The operator overlay. Required for the public-repo overlay pass;
          unused on a verified-private repo (base-rules only). A public repo
          without it fails closed on the overlay pass.

permissions:
  contents: read
  issues: write

jobs:
  resident-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: default-branch
    steps:
      - name: Checkout default branch (whole tree scanned; read only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout dotty (pinned, for the gitleaks hook scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lexijamesesq/dotty
          ref: ${{ inputs.dotty_ref }}
          path: _dotty
          persist-credentials: false

      - name: Setup gitleaks
        uses: lexijamesesq/dotty/.github/actions/setup-gitleaks@4e9fcf7fec358580d773b8c9bc1616a116fb99b4 # includes the pinned-checksum fix (#221)
        with:
          version: '8.30.1'

      - name: "Resolve the resident-scan profile (private -> base-rules only, no overlay)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          declared_json="$GITHUB_WORKSPACE/_dotty/rulesets/default-branch.json"
          env_line="$(bash "$GITHUB_WORKSPACE/_dotty/git-hooks/gate-resolve-profile.sh" "$repo" "$declared_json")"
          echo "$env_line" >> "$GITHUB_ENV"
          echo "resident-scan profile for $repo: $env_line (1 = private-repo, base-rules only)"

      - name: "Resident whole-tree scan (findings -> stdout, values withheld)"
        id: scan
        working-directory: repo
        env:
          OPERATOR_RULES: ${{ secrets.OPERATOR_RULES }}
        run: |
          # set +e first: GitHub's default `bash -e {0}` would abort on the
          # driver's nonzero (findings) exit before we capture it.
          set +e -uo pipefail
          # Materialize the operator overlay only when the overlay pass runs
          # (public profile). A verified-private repo scans base-rules only and
          # needs no secret. A public repo with an empty secret fails closed.
          if [[ "${GATE_SKIP_OVERLAY:-0}" != "1" ]]; then
            if [[ -z "${OPERATOR_RULES:-}" ]]; then
              echo "::error::resident-scan: OPERATOR_RULES empty on a non-private repo -- refusing to scan without the overlay (fail-closed)."
              exit 1
            fi
            fixed="${XDG_CONFIG_HOME:-$HOME/.config}/gitleaks/operator-rules.toml"
            mkdir -p "$(dirname "$fixed")"
            printf '%s' "$OPERATOR_RULES" > "$fixed"
            chmod 600 "$fixed"
            trap 'rm -f "$fixed"' EXIT
          fi
          findings="$(GATE_SKIP_OVERLAY="${GATE_SKIP_OVERLAY:-0}" \
            bash "$GITHUB_WORKSPACE/_dotty/git-hooks/gitleaks-resident-scan.sh")"
          rc=$?
          # Persist the findings list (values already withheld) for the issue step.
          printf '%s' "$findings" > "$RUNNER_TEMP/resident-findings.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [[ "$rc" -eq 2 ]]; then
            echo "::error::resident-scan: scanner error (fail-closed)."
          elif [[ "$rc" -eq 1 ]]; then
            count="$(grep -c . "$RUNNER_TEMP/resident-findings.txt" 2>/dev/null || echo '?')"
            echo "::error::resident-scan: $count resident finding(s) on the default branch (counts only here; see the operator issue)."
          fi
          # Do not fail the step yet — the issue step must run first (always()).
          exit 0

      - name: "Surface actionably: open/update or close the resident-scan issue"
        if: always() && steps.scan.outputs.rc != '2'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RC: ${{ steps.scan.outputs.rc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LABEL="resident-scan"
          TITLE="Resident secret/PII scan — findings on ${REPO}"
          # Ensure the label exists (idempotent).
          gh label create "$LABEL" --repo "$REPO" --color B60205 \
            --description "Open = the scheduled resident scan found something on the default branch" \
            2>/dev/null || true
          # The single open issue for this repo, matched by LABEL (not title text).
          existing="$(gh issue list --repo "$REPO" --label "$LABEL" --state open \
            --json number --jq '.[0].number // empty')"

          if [[ "$RC" == "1" ]]; then
            body="$({
              echo "The scheduled resident whole-tree scan found secret/PII pattern matches on the **default branch** (matched values withheld)."
              echo ""
              echo "Each line is \`<rule-id>  —  <file>:<line>\`, de-duped:"
              echo ""
              echo '```'
              # findings file is "<rule>\t<file>:<line>"; render tab -> "  —  "
              sed -E 's/\t/  —  /' "$RUNNER_TEMP/resident-findings.txt"
              echo '```'
              echo ""
              echo "Run: ${RUN_URL}"
              echo ""
              echo "<!-- resident-scan: machine-readable; one finding per fenced line as rule<TAB>file:line before rendering -->"
            })"
            if [[ -n "$existing" ]]; then
              gh issue edit "$existing" --repo "$REPO" --body "$body" >/dev/null
              echo "updated issue #$existing"
            else
              gh issue create --repo "$REPO" --title "$TITLE" --label "$LABEL" \
                --assignee "${{ github.repository_owner }}" --body "$body" >/dev/null
              echo "opened a new resident-scan issue"
            fi
          else
            # Clean run (rc=0): close any open issue with a resolved note.
            if [[ -n "$existing" ]]; then
              gh issue comment "$existing" --repo "$REPO" \
                --body "Resolved: the scheduled resident scan is clean as of ${RUN_URL}." >/dev/null
              gh issue close "$existing" --repo "$REPO" >/dev/null
              echo "closed resolved issue #$existing"
            else
              echo "clean; no open resident-scan issue"
            fi
          fi

      - name: "Fail the run on findings or scanner error (after the issue is filed)"
        if: always()
        run: |
          set -euo pipefail
          rc="${{ steps.scan.outputs.rc }}"
          if [[ "$rc" == "1" || "$rc" == "2" ]]; then
            echo "::error::resident-scan: failing the run (rc=$rc) so the scheduled failure is visible; details in the operator issue."
            exit 1
          fi
          echo "resident-scan clean."

      - name: Prove the materialized secret is gone
        if: always()
        run: |
          set -uo pipefail
          rules="${XDG_CONFIG_HOME:-$HOME/.config}/gitleaks/operator-rules.toml"
          if [[ -e "$rules" ]]; then
            echo "::error::materialized secret still present after the scan: $rules" >&2
            exit 1
          fi
          echo "confirmed gone (or never materialized): $rules"
