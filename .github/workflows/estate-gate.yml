name: Estate gate (trusted lane)
# The trusted half of the floor. Every repo's own gate.yml calls this on
# `pull_request_target` (types: opened, synchronize, reopened, edited,
# ready_for_review). GitHub always resolves a pull_request_target-triggered
# workflow FROM THE DEFAULT BRANCH, regardless of what the PR's own diff
# contains -- the mechanism this lane's trust rests on, and the reason every
# secret the pipeline needs before merge lives HERE and nowhere a PR can
# rewrite: the operator gitleaks overlay (OPERATOR_RULES) and Margot's App key
# (MARGOT_APP_KEY), both from the caller's `default-branch` environment, whose
# branch policy admits only the default branch -- a `pull_request`-triggered
# job could not read them at all, and a PR could redirect them by editing its
# own ci.yml. Reads PR content as data, executes nothing from it: every scanner
# step invokes gitleaks-*.sh DIRECTLY from the pinned `_dotty` checkout; this
# workflow does not and must never run the PR's own .pre-commit-config.yaml
# (that is estate-ci.yml's job, in the `pull_request` context, with no secrets).
#
# ORDER (operator, 2026-09-26): Jev FIRST. This job's first act is to hand the
# PR to lexijamesesq/margot (dispatch margot-triage.yml), where Jev classifies
# it -- mechanical or not -- and posts the `margot-triage` check on the head.
# The trusted scan runs meanwhile. Then this job waits for Jev's answer
# (bounded, fail-closed to "not mechanical"), and as its LAST act dispatches
# margot-review with that answer and the owned-path tier, and posts the initial
# `margot` check ("dispatched -- waiting for a review runner") so the PR page
# says what Margot is doing from the moment she is asked. margot-review adopts
# that check by name + head + App id. Mechanical: Margot's existing
# council-less short-circuit (APPROVED, LOW). Functional: the council, with the
# floor's receipt. Ollie merges as he does today -- untouched.
#
# SECRET SCAN, once per trigger point (operator's rule, 2026-09-26: a scan
# repeats only when its input could have changed, its scope widens, or the
# earlier scan could have been skipped). This is the PR-time scan -- the only
# one that covers a bypassed local hook, and the only one that sees the branch
# name, title and body. Each content class once: the commit range in the
# base-rules pass (GL_NO_OVERLAY: gitleaks' stock ruleset and its stock global
# allowlist -- generic credential-shaped secrets), the commit range in the
# operator-overlay-only pass (GL_OVERLAY_ONLY, useDefault=false -- live-verified
# during development: a PR-chosen filename in a stock-allowlisted shape defeated
# the overlay's roster-name coverage when both ran combined under one
# useDefault=true config; the overlay-only pass inherits neither the stock
# ruleset nor its allowlist), and ONE `dir` pass over one assembled text file
# holding every commit message plus the branch name, title and body (a temp
# path, so the stock path allowlist is moot; the composed ruleset). The
# retired base-rules lane in estate-ci.yml (three more invocations of the same
# input) is gone. Scanner inputs are pinned to the BASE ref -- a PR cannot
# loosen its own config -- and the overlay is materialized to a 600 file and
# discarded on exit, with an always() step that proves it is gone.
#
# PRIVATE-REPO PROFILE (unchanged): a repo declared `private_repo` in dotty's
# rulesets (read from the pinned _dotty checkout, verified live against the
# repo's visibility) skips the identity/overlay pass and keeps the credential
# pass; see git-hooks/gate-resolve-profile.sh and its eval.
#
# CONSTRUCTION FREEZE: while MARGOT_FREEZE is "true" no review is dispatched;
# the required `margot` check posts as a completed success titled "skipped:
# construction freeze". The scan still runs. The only un-freeze is "false".
#
# This job's check (`trusted-scan / trusted-scan`) stays a required context in
# every ruleset. The floor's other half (`floor / floor`, estate-ci.yml) is the
# hooks/lint suite in the untrusted context.

on:
  workflow_call:
    inputs:
      dotty_ref:
        description: >-
          The exact commit this reusable workflow was called at (the SHA in
          the caller's own `uses: .../estate-gate.yml@<sha>` line, repeated
          here) -- dotty's hook scripts, rulesets and checkers at that pin.
        required: true
        type: string
      triage_wait_seconds:
        description: >-
          How long to wait for the `margot-triage` check on the head before
          treating the PR as not mechanical (fail-closed to the council).
        required: false
        type: number
        default: 120
    secrets:
      OPERATOR_RULES:
        required: true
        description: The operator gitleaks overlay (TOML), from the caller's default-branch environment.
      MARGOT_APP_KEY:
        required: false
        description: >-
          Margot GitHub App private key, from the caller's default-branch environment.
          Optional for one release: a caller still on the old gate.yml (scan only,
          no key) keeps today's behaviour -- the scan runs here, the hand-off to
          Margot still comes from its margot.yml -> estate-margot.yml -- until the
          batched caller rollout gives it the new gate.yml and deletes margot.yml.
      OPERATOR_ROSTERS:
        required: false
        description: >-
          No longer read -- roster-name coverage lives in the operator overlay.
          Kept optional so an existing caller still passing it does not break.

permissions:
  contents: read

env:
  # Margot's public GitHub App id -- NOT a secret. Only the private key is.
  MARGOT_APP_ID: "4862659"
  # --- CONSTRUCTION FREEZE --- see header. The only documented un-freeze is "false".
  MARGOT_FREEZE: "false"

jobs:
  trusted-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: default-branch
    steps:
      - name: Refuse a fork PR (fails, never skips -- see header)
        env:
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [[ "$PR_HEAD_REPO" != "$THIS_REPO" ]]; then
            echo "::error::trusted scan refused -- PR head repository is not this repository (fork). No secret was referenced." >&2
            exit 1
          fi

      - name: Checkout PR head (untrusted content -- read only, no persisted credential)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout dotty (pinned, for the gitleaks hook scripts and rulesets)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lexijamesesq/dotty
          ref: ${{ inputs.dotty_ref }}
          path: _dotty
          persist-credentials: false

      # --- Jev first: hand the PR to Margot's repo before anything else runs --
      - name: Which path (hand-off only when the caller passes the App key; the freeze is the only skip)
        id: who
        env:
          HAS_KEY: ${{ secrets.MARGOT_APP_KEY != '' }}
        run: |
          set -euo pipefail
          handoff=false; skip=false
          [[ "$HAS_KEY" == "true" ]] && handoff=true
          if [[ "$handoff" == "true" && "${MARGOT_FREEZE:-false}" == "true" ]]; then skip=true; handoff=false; fi
          echo "handoff=$handoff" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "hand-off=$handoff freeze-skip=$skip (no key = old caller: scan only, margot.yml still dispatches)"

      - name: Mint the narrow Margot dispatch token
        id: dispatch_token
        if: steps.who.outputs.handoff == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.MARGOT_APP_ID }}
          private-key: ${{ secrets.MARGOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: margot
          permission-actions: write

      - name: Dispatch margot-triage in margot (Jev classifies the change)
        if: steps.who.outputs.handoff == 'true'
        env:
          GH_TOKEN: ${{ steps.dispatch_token.outputs.token }}
          TARGET_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "dispatching margot-triage for ${TARGET_REPO} PR #${PR_NUMBER} @ ${HEAD_SHA}"
          jq -n --arg repo "$TARGET_REPO" --arg pr "$PR_NUMBER" --arg sha "$HEAD_SHA" \
            '{ref:"main",inputs:{repo:$repo,pr:$pr,sha:$sha}}' \
          | gh api -X POST "repos/lexijamesesq/margot/actions/workflows/margot-triage.yml/dispatches" --input -

      # --- The trusted scan, once per content class ----------------------------
      - name: Setup gitleaks
        uses: lexijamesesq/dotty/.github/actions/setup-gitleaks@4e9fcf7fec358580d773b8c9bc1616a116fb99b4 # includes the pinned-checksum fix (#221)
        with:
          version: '8.30.1'

      - name: "Resolve the trusted-lane profile (private-repo: identity pass off, credential pass on)"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          declared_json="$GITHUB_WORKSPACE/_dotty/rulesets/default-branch.json"
          env_line="$(bash "$GITHUB_WORKSPACE/_dotty/git-hooks/gate-resolve-profile.sh" "$REPO" "$declared_json")"
          echo "$env_line" >> "$GITHUB_ENV"
          echo "trusted-lane profile for $REPO: $env_line (1 = private-repo, identity/overlay pass off, credential/base-rules pass on)"

      - name: Pin every scanner input to the base ref -- into a runner-owned temp dir, never the checkout
        working-directory: repo
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          pin_dir="$RUNNER_TEMP/gate-pin"
          mkdir -p "$pin_dir"
          if git show "$BASE_SHA:.gitleaks.toml" > "$pin_dir/.gitleaks.toml.tmp" 2>/dev/null; then
            mv "$pin_dir/.gitleaks.toml.tmp" "$pin_dir/.gitleaks.toml"
          else
            rm -f "$pin_dir/.gitleaks.toml.tmp"
            dotty_base="$GITHUB_WORKSPACE/_dotty/.gitleaks.toml"
            if [ ! -f "$dotty_base" ]; then
              echo "::error::estate-gate: base ref has no .gitleaks.toml AND dotty's own base config is missing at $dotty_base -- cannot run the trusted scan (fail-closed)." >&2
              exit 1
            fi
            echo "::notice::estate-gate: base ref ships no .gitleaks.toml -- using dotty's own base config from the pinned _dotty checkout."
            cp "$dotty_base" "$pin_dir/.gitleaks.toml"
          fi
          rm -f .gitleaksignore
          if git show "$BASE_SHA:.gitleaksignore" > "$pin_dir/.gitleaksignore.tmp" 2>/dev/null; then
            mv "$pin_dir/.gitleaksignore.tmp" "$pin_dir/.gitleaksignore"
          else
            rm -f "$pin_dir/.gitleaksignore.tmp"
            : > "$pin_dir/.gitleaksignore"   # always exists, empty when base has none
          fi
          git_dir="$(git rev-parse --git-dir)"
          mkdir -p "$git_dir/info"
          printf '* !export-ignore\n* diff\n' > "$git_dir/info/attributes"
          echo "GL_CONFIG_PATH=$pin_dir/.gitleaks.toml" >> "$GITHUB_ENV"
          echo "GL_IGNORE_PATH=$pin_dir/.gitleaksignore" >> "$GITHUB_ENV"

      - name: "Trusted gitleaks -- the PR once: commit range (base-rules pass, overlay-only pass), one text pass over messages + branch + title + body (counts only)"
        working-directory: repo
        env:
          OPERATOR_RULES: ${{ secrets.OPERATOR_RULES }}
          GL_RANGE_BASE: ${{ github.event.pull_request.base.sha }}
          GL_RANGE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e -uo pipefail
          if [[ -z "${OPERATOR_RULES:-}" ]]; then
            echo "::error::OPERATOR_RULES is empty -- refusing to scan unscanned. Fail-closed, not fail-open." >&2
            exit 1
          fi
          fixed="${XDG_CONFIG_HOME:-$HOME/.config}/gitleaks/operator-rules.toml"
          mkdir -p "$(dirname "$fixed")"
          printf '%s' "$OPERATOR_RULES" > "$fixed"
          chmod 600 "$fixed"
          trap 'rm -f "$fixed"' EXIT
          fail=0; total=0
          count_findings() { grep -cE '^\s*\[[A-Za-z0-9_.-]+\]' "$1" || true; }
          # 1) commit range, base-rules pass (stock ruleset + stock allowlist; credential classes)
          capture="$(mktemp)"
          if ! GL_NO_OVERLAY=1 bash "$GITHUB_WORKSPACE/_dotty/git-hooks/gitleaks-range-scan.sh" > "$capture" 2>&1; then
            fail=1; n="$(count_findings "$capture")"; total=$((total + ${n:-1}))
          fi
          rm -f "$capture"
          # 2) commit range, operator overlay standalone (useDefault=false) -- the receipted
          #    filename-allowlist evasion guard. Off under the private-repo profile.
          if [[ "${GATE_SKIP_OVERLAY:-0}" != "1" ]]; then
            capture="$(mktemp)"
            if ! GL_OVERLAY_ONLY=1 bash "$GITHUB_WORKSPACE/_dotty/git-hooks/gitleaks-range-scan.sh" > "$capture" 2>&1; then
              fail=1; n="$(count_findings "$capture")"; total=$((total + ${n:-1}))
            fi
            rm -f "$capture"
          fi
          # 3) ONE text pass: every commit message in the range + branch name + PR title + PR
          #    body, assembled into one temp file (stock path allowlist moot) -- composed
          #    ruleset (stock + overlay + repo), or stock only under the private-repo profile.
          text="$(mktemp)"
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            { printf '\n--- commit %s ---\n' "$sha"; git log -1 --format=%B "$sha"; } >> "$text"
          done <<< "$(git rev-list "${GL_RANGE_BASE}..${GL_RANGE_HEAD}")"
          python3 - "$text" <<'PY'
          import json, os, sys
          d = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))["pull_request"]
          with open(sys.argv[1], "a", encoding="utf-8") as f:
              f.write("\n--- branch ---\n" + (d["head"]["ref"] or ""))
              f.write("\n--- title ---\n" + (d["title"] or ""))
              f.write("\n--- body ---\n" + (d["body"] or ""))
          PY
          capture="$(mktemp)"
          text_rc=0
          if [[ "${GATE_SKIP_OVERLAY:-0}" == "1" ]]; then
            GL_NO_OVERLAY=1 GL_TEXT_FILE="$text" bash "$GITHUB_WORKSPACE/_dotty/git-hooks/gitleaks-commit-msg.sh" > "$capture" 2>&1 || text_rc=$?
          else
            GL_TEXT_FILE="$text" bash "$GITHUB_WORKSPACE/_dotty/git-hooks/gitleaks-commit-msg.sh" > "$capture" 2>&1 || text_rc=$?
          fi
          if [[ "$text_rc" -ne 0 ]]; then
            fail=1; n="$(count_findings "$capture")"; total=$((total + ${n:-1}))
            echo "::error::trusted scan blocked on commit messages / branch / title / body -- ${n:-1} finding(s) (counts only; no content printed)"
          fi
          rm -f "$capture" "$text"
          if [[ "$fail" -ne 0 ]]; then
            echo "::error::trusted scan blocked -- $total finding(s) (counts only; no content printed)"
          fi
          exit "$fail"

      - name: Prove the materialized secret is gone
        if: always()
        run: |
          set -uo pipefail
          rules="${XDG_CONFIG_HOME:-$HOME/.config}/gitleaks/operator-rules.toml"
          if [[ -e "$rules" ]]; then
            echo "::error::materialized secret still present after the scan step's own discard: $rules" >&2
            ls -la "$rules" >&2
            exit 1
          fi
          echo "confirmed gone: $rules"

      # --- Jev's answer, then hand the PR to Margot's review ---------------------
      - name: Wait for Jev's triage (the newest completed `margot-triage` check on this head), bounded
        id: triage
        if: steps.who.outputs.handoff == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WAIT: ${{ inputs.triage_wait_seconds }}
          APP_ID: ${{ env.MARGOT_APP_ID }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + WAIT ))
          text=""
          while :; do
            # Newest completed run wins (same rule as margot-floor-gate.py after the
            # receipted duplicate-check incident, dotty #281): sort by started_at, then id.
            text="$(gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?check_name=margot-triage&app_id=${APP_ID}" \
              --jq '[.check_runs[] | select(.status=="completed")] | sort_by(.started_at, .id) | last | .output.text // empty' 2>/dev/null || true)"
            [[ -n "$text" && "$text" != "null" ]] && break
            if (( $(date +%s) >= deadline )); then
              echo "::notice::no margot-triage check on ${HEAD_SHA} within ${WAIT}s -- treating the PR as NOT mechanical (fail-closed to the council)."
              text=""
              break
            fi
            sleep 5
          done
          mechanical=false
          if [[ -n "$text" ]]; then
            # Machine form only; the title is never parsed. Anything not literally
            # {"mechanical": true, ..., "decision_source": "jev", "head_sha": <this head>} is not mechanical.
            mechanical="$(printf '%s' "$text" | jq -r --arg sha "$HEAD_SHA" \
              'if (type=="object" and .mechanical==true and .decision_source=="jev" and .head_sha==$sha) then "true" else "false" end' 2>/dev/null || echo false)"
            echo "margot-triage: $(printf '%s' "$text" | jq -c . 2>/dev/null || echo '<unparseable>')"
          fi
          echo "mechanical=${mechanical}" >> "$GITHUB_OUTPUT"
          echo "suite: $([[ "$mechanical" == true ]] && echo mechanical || echo functional)"

      - name: Compute the owned-path tier from the ruleset
        id: tier
        if: steps.who.outputs.handoff == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          ruleset="$GITHUB_WORKSPACE/_dotty/rulesets/default-branch.json"
          files_json="$(gh api --paginate "repos/${TARGET_REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename' | jq -R . | jq -s .)"
          if ! jq -e --arg slug "$TARGET_REPO" '.repos | has($slug)' "$ruleset" >/dev/null; then
            echo "::warning::repo ${TARGET_REPO} absent from ruleset .repos — owned tier defaulted to 'owned' (provisioning gap); add it to rulesets .repos"
          fi
          tier="$(jq -r --arg slug "$TARGET_REPO" --argjson files "$files_json" '
            (.codeowners_required_owned // []) as $req
            | (.repos | has($slug)) as $listed
            | (.repos[$slug] // {}) as $repo
            | ($repo.codeowners_owned // []) as $own
            | ($repo.codeowners_full_owned == true) as $full
            | def hit($pats): . as $f | ("/" + $f) as $p
                | ($pats | any(. as $pat
                    | if ($pat|endswith("/")) then ($p|startswith($pat))
                      elif ($pat|test("[*?]")) then ($p|test("^" + ($pat|gsub("(?<c>[.^$+(){}\\[\\]|\\\\])";"\\\(.c)")|gsub("\\*";"[^/]*")|gsub("\\?";"[^/]")) + "$"))
                      else ($p==$pat) end));
            if ($files | any(hit($req))) then "required_owned"
            elif ($listed | not) then "owned"
            elif ($full or ($files | any(hit($own)))) then "owned"
            else "none" end
          ' "$ruleset")"
          echo "owned tier for ${TARGET_REPO} PR #${PR_NUMBER}: ${tier}"
          echo "tier=${tier}" >> "$GITHUB_OUTPUT"

      - name: Dispatch margot-review in margot (triage result + owned tier)
        if: steps.who.outputs.handoff == 'true'
        env:
          GH_TOKEN: ${{ steps.dispatch_token.outputs.token }}
          TARGET_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OWNED_TIER: ${{ steps.tier.outputs.tier }}
          MECHANICAL: ${{ steps.triage.outputs.mechanical }}
        run: |
          set -euo pipefail
          triage="not-mechanical"; [[ "$MECHANICAL" == "true" ]] && triage="mechanical"
          echo "dispatching margot-review for ${TARGET_REPO} PR #${PR_NUMBER} @ ${HEAD_SHA} (triage=${triage}, owned_tier=${OWNED_TIER})"
          jq -n --arg repo "$TARGET_REPO" --arg pr "$PR_NUMBER" --arg sha "$HEAD_SHA" \
            --arg tier "$OWNED_TIER" --arg triage "$triage" \
            '{ref:"main",inputs:{repo:$repo,pr:$pr,sha:$sha,owned_tier:$tier,triage:$triage}}' \
          | gh api -X POST "repos/lexijamesesq/margot/actions/workflows/margot-review.yml/dispatches" --input -

      - name: Mint the narrow checks token for this repo
        id: checks_token
        if: steps.who.outputs.handoff == 'true' || steps.who.outputs.skip == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.MARGOT_APP_ID }}
          private-key: ${{ secrets.MARGOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write

      - name: Post the skipped `margot` check (freeze)
        if: steps.who.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ steps.checks_token.outputs.token }}
          TARGET_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo "posting skipped margot check for ${TARGET_REPO} PR #${PR_NUMBER} @ ${HEAD_SHA}"
          title="skipped: construction freeze"
          summary="No Margot review. Review dispatch is frozen for the estate's rebuild window (MARGOT_FREEZE). The floor is the gate that applies to this pull request. This check exists so the required \`margot\` context is satisfied — it is not an approval."
          jq -n --arg sha "$HEAD_SHA" --arg title "$title" --arg summary "$summary" '{
            name: "margot", head_sha: $sha, status: "completed", conclusion: "success",
            output: { title: $title, summary: $summary }
          }' | gh api -X POST "repos/${TARGET_REPO}/check-runs" --input -

      - name: Post the initial `margot` check (dispatched — waiting for a review runner)
        if: steps.who.outputs.handoff == 'true'
        env:
          GH_TOKEN: ${{ steps.checks_token.outputs.token }}
          TARGET_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DISPATCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MARGOT_APP_ID: ${{ env.MARGOT_APP_ID }}
        run: |
          set -euo pipefail
          existing=$(gh api "repos/${TARGET_REPO}/commits/${HEAD_SHA}/check-runs?check_name=margot&app_id=${MARGOT_APP_ID}" \
            --jq '.check_runs | length')
          if [ "${existing:-0}" != "0" ]; then
            echo "a margot check already exists on ${HEAD_SHA} (${existing}) — margot-review owns it; not posting a second"
            exit 0
          fi
          title="Margot: dispatched — waiting for a review runner"
          summary="Dispatched for #${PR_NUMBER} at $(date -u +%Y-%m-%dT%H:%M:%SZ), trusted scan green. This check updates in place as Margot moves (review runner, council, verdict). Dispatching run: ${DISPATCH_RUN_URL}"
          jq -n --arg sha "$HEAD_SHA" --arg title "$title" --arg summary "$summary" --arg url "$DISPATCH_RUN_URL" '{
            name: "margot",
            head_sha: $sha,
            status: "in_progress",
            details_url: $url,
            output: { title: $title, summary: $summary }
          }' | gh api -X POST "repos/${TARGET_REPO}/check-runs" --input - >/dev/null
          echo "posted the initial margot check for ${TARGET_REPO} PR #${PR_NUMBER} @ ${HEAD_SHA}"
