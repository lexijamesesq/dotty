name: Release on merge
# This repo's release path. A merge to main that changes an EXPORTED surface
# cuts the next calendar tag and its GitHub Release, then moves the floating
# `v1` major tag onto the same commit — with nobody in the loop.
#
# It replaces a local, operator-invoked skill that cut the same tag by the same
# rule. The failure that replacement answers is receipted, not imagined: the
# skill was only ever run by hand, so it was not run — v2026.09.16, .17 and .18
# were cut ad hoc with no Release behind them, and the pre-commit hook channel
# sat at v2026.09.07 while CI ran v2026.09.18. A release step a human has to
# start is a release step that does not happen.
#
# NOT named estate-*.yml on purpose: that glob IS the exported-workflow surface
# this job watches, so an estate-* name would make the release workflow its own
# release trigger.
#
# No paths: filter either. The due-check is a diff from the last tag to HEAD, so
# a run that fails, or a merge that lands while another run holds the lock, is
# caught by the next run. A paths: filter would decide on one push's files alone
# and lose that catch-up.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One release at a time, and never cancel one in flight — a cancelled run can
  # leave a tag with no Release. GitHub keeps only the newest pending run in a
  # group and drops the rest; harmless here, because the surviving run diffs
  # from the last tag to HEAD and so covers every merge the dropped ones had.
  group: release-on-merge
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The only elevated grant in this repo's push lane, scoped to this job:
      # creating a tag ref and a Release. Tag creation needs no bypass actor —
      # this repo's tag ruleset restricts update and deletion only, and its
      # blueprint already declares github-actions[bot] a release-tag author.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and every tag: the due-check diffs the last calendar
          # tag against HEAD, and the suffix arithmetic reads the day's tags.
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether a release is due
        id: next
        # `shell: bash` explicitly, NOT the default. An unspecified shell runs
        # `bash -e {0}` — no pipefail — so a REFUSAL from the script (exit 1,
        # nothing on stdout) would pipe into a perfectly successful `tee`, the
        # step would pass, the tag output would be empty, every later step would
        # skip on that, and the run would go green. "Refuse rather than guess"
        # would have become "nothing to release". `shell: bash` is
        # `bash --noprofile --norc -eo pipefail {0}`, which fails the step.
        shell: bash
        run: bash .github/scripts/next-calendar-tag.sh . | tee -a "$GITHUB_OUTPUT"

      # `tag != ''` alone, NOT `&& reentry != '1'`: the v1 step below also
      # tags, and it runs on the re-entry path (that is how a run that cut the
      # calendar tag but failed at v1 recovers). Gating identity on reentry
      # would leave `git tag -a v1` with no committer on exactly that path.
      - name: Configure git identity for the tagger
        if: steps.next.outputs.tag != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create the annotated tag
        if: steps.next.outputs.tag != '' && steps.next.outputs.reentry != '1'
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          # ANNOTATED, not lightweight, and tagged as github-actions[bot]: the
          # estate's drift check audits tag origin (no ruleset can) and reports
          # a lightweight tag, or one from an undeclared tagger, as drift.
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
          # Remote-authoritative confirmation — never trust the push's own exit
          # status as proof the ref is there.
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null

      - name: Cut the GitHub Release
        if: steps.next.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          # Checked and created independently of the tag, in both the fresh-cut
          # and the re-entry path: a failure between the two must never leave a
          # tag permanently without its Release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --generate-notes

      # The floating first-party major tag. Consumers pin their `uses:` at
      # `lexijamesesq/dotty/.github/workflows/estate-*.yml@v1` — GitHub's own
      # convention for same-owner actions — so one release reaches all thirteen
      # callers instead of fanning out into thirteen pin-bump PRs and thirteen
      # CI runs, three of them metered on a budget already at 100%.
      #
      # LAST on purpose. Every step above cuts something immutable; this one
      # moves a ref. A failure here must never strand a calendar tag without
      # its Release, so the Release is already cut by the time this runs.
      #
      # Gated on `tag != ''` ALONE, deliberately not on `reentry`: on the
      # re-entry path the calendar tag and the Release are already there and
      # v1 is exactly what is left to do, so a re-run after a v1 failure fixes
      # it. Nothing here touches a calendar tag.
      #
      # This is the one ref in this repository that is UPDATED rather than
      # created, so it needs `refs/tags/v1` excluded from the "Tag
      # immutability" ruleset — declared at
      # rulesets/default-branch.json .repos["lexijamesesq/dotty"].tag_ruleset_exclude
      # and converged by provision-public-repo.sh. Until the operator runs
      # converge, the FIRST v1 (a create) lands and every later move fails here,
      # loudly. It never falls back and never leaves a wrong v1 in place.
      - name: Move the floating v1 major tag
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          # LIGHTWEIGHT on purpose — no `-a`. This one-line choice is what keeps
          # the hook channel working, and it replaces a 384-line script that
          # existed only to work around the alternative.
          #
          # `git describe --tags --abbrev=0` is what `pre-commit autoupdate`
          # resolves a pin with, and it PREFERS AN ANNOTATED tag over a
          # lightweight one on the same commit. While v1 was annotated it also
          # carried the newer tagger date, so it won every tie and autoupdate
          # wrote `rev: v1` into every consumer — a moving pin, which pre-commit
          # caches by its own text and so never refreshes again.
          #
          # Lightweight, v1 loses that tie to the annotated calendar tag, and it
          # loses it REGARDLESS OF ORDER — verified both ways on a fixture, with
          # v1 moved before and after the calendar tag. The release side and the
          # consumption side agree again by construction, with no script between
          # them.
          #
          # A lightweight tag is still a perfectly good `uses: ...@v1` target;
          # the workflow channel is indifferent to the distinction.
          #
          # The estate's drift check audits tag ORIGIN and reports a lightweight
          # tag as drift. `refs/tags/v1` is excluded from that audit by the same
          # declared list that already excludes it from tag immutability —
          # rulesets/default-branch.json .repos[...].tag_ruleset_exclude — so the
          # one deliberately-mutable ref is declared once and read twice.
          git tag -f v1
          git push --force origin refs/tags/v1
          # Remote-authoritative, on `refs/tags/v1` DIRECTLY. A lightweight tag
          # IS the commit — there is no tag object to peel — so the unpeeled ref
          # already holds the sha a consumer's `uses: ...@v1` checks out.
          #
          # The previous `^{}` form was correct only while v1 was annotated, and
          # a remote publishes a `^{}` line for annotated tags alone. Left in
          # place beside a lightweight v1 it would return nothing on every run
          # and fail this step forever — the one place where making v1
          # lightweight breaks something, fixed in the same change rather than
          # discovered on the next release. Never trust the push's own exit
          # status as proof.
          landed="$(git ls-remote origin 'refs/tags/v1' | cut -f1)"
          if [ "$landed" != "$GITHUB_SHA" ]; then
            echo "v1 did not land on $GITHUB_SHA (got: ${landed:-<none>})" >&2
            exit 1
          fi
          echo "v1 -> $GITHUB_SHA ($TAG)"
