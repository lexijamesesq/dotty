name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel a superseded in-flight run when a PR gets a new push — but NEVER cancel
# a push-to-main run (cancel is gated to pull_request events; on push-to-main
# `cancel-in-progress` is false). On `pull_request`, github.ref is already
# per-PR (refs/pull/<N>/merge), so the group is PR-scoped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  floor:
    # The required check is `ci / checks`: this job's name, then the called
    # job's (estate-ci.yml's check_name). Convention `<lane> / <what it checks>`.
    name: ci
    # Read scopes the floor uses with github.token (Jev's triage answer on the
    # head's check-runs). A called workflow gets no more than this; on a
    # private repo the triage read 403s without it and the PR runs the full
    # suite. No write scope, no secret: this is the lane a PR controls.
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: lexijamesesq/dotty/.github/workflows/estate-ci.yml@v1
    with:
      dotty_ref: v1
      check_name: checks

  # The eval suite: dotty's own tests, formerly a separate `Tests` workflow that
  # ran on every PR whatever the triage said. Behind the floor it runs on a
  # functional PR, and on a mechanical or documentation PR that changes a
  # runtime manifest or lockfile (the floor's `mechanical` output means "skip
  # the repo's jobs"), and only on pull_request as before. It stays a required
  # context of its own: GitHub treats a job skipped by its `if:` as satisfied,
  # so a PR that skips it is not blocked by it.
  eval-suite:
    name: ci / eval-suite
    needs: [floor]
    if: ${{ (github.event_name == 'pull_request') && needs.floor.outputs.mechanical != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install uv 0.11.22
        run: pip install uv==0.11.22
      - name: ruff
        run: uvx ruff@0.16.5 check --force-exclude .
      - name: shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'
          ignore_paths: .git
          check_together: 'yes'
      # No official rhysd/actionlint reusable action exists (only a curl-run
      # shell script with no documented independent checksum verification) —
      # this pinned curl+checksum+sha256sum install is at least as rigorous.
      # Decision recorded in .github/CI.md; not to be re-proposed without
      # new facts.
      - name: Install actionlint 1.7.12
        run: |
          set -euo pipefail
          ver=1.7.12
          base="https://github.com/rhysd/actionlint/releases/download/v${ver}"
          tmp="$(mktemp -d)"
          cd "$tmp"
          tarball="actionlint_${ver}_linux_amd64.tar.gz"
          curl -sSfL -o "$tarball" "${base}/${tarball}"
          curl -sSfL -o checksums.txt "${base}/actionlint_${ver}_checksums.txt"
          line="$(grep -E "[[:space:]]${tarball}\$" checksums.txt)"
          [ "$(printf '%s\n' "$line" | wc -l)" -eq 1 ]   # exactly one match, or fail
          printf '%s\n' "$line" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint -version
      - name: actionlint
        run: actionlint
      # The gitleaks-hooks suite drives the REAL pre-commit pre-push shim, so it
      # requires pre-commit on PATH. Pinned to the version the hooks were
      # validated against. The suite hard-fails (never skips) if it is absent.
      - name: Install pre-commit 4.6.0
        run: |
          pip install pre-commit==4.6.0
          pre-commit --version
      # The gitleaks-hooks suite requires the real scanner on PATH — a
      # composite action (not gitleaks/gitleaks-action, which can't leave a
      # reusable binary behind; see .github/CI.md) so the install logic
      # lives in one place instead of duplicated across workflows.
      - name: Setup gitleaks
        uses: ./.github/actions/setup-gitleaks
        with:
          version: '8.30.1'
      # vale on PATH so the vale-self-narration eval runs its rule-correctness
      # tests for real here (they self-skip when vale is absent); local action
      # ref, resolvable in this same checkout.
      - name: Setup vale
        uses: ./.github/actions/setup-vale
        with:
          version: '3.9.5'
      - name: Run eval suite
        run: bash .claude/eval/run-all.sh
