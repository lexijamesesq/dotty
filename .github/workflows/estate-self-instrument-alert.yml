name: Estate self-instrument merge alert
# Reusable: a repo's own self-instrument-alert.yml caller invokes this on every
# push to its default branch. It answers one question and acts on nothing: did
# this merge touch a path in the estate's `self_instrument` set — the files
# Margot's own gate is made of (her dispatch, her ruleset with its owned-path
# map, her agent, this alert's own caller)? If so it SURFACES that — a comment on
# the merged pull request, the operator assigned, a warning on the run — and
# ends green. It never blocks, reverts, or re-decides a merge.
#
# Classify against the base ruleset, including both names of a rename. A trusted
# same-head triage class exempts mechanical and documentation merges. Missing or
# unreadable classification still alerts; this backstop now shares Jev's judgment.
# GITHUB_TOKEN remains the only credential; no App token or secret is required.

on:
  workflow_call:
    inputs:
      before:
        description: >-
          The push's `before` sha (github.event.before). All zeros for a branch
          creation — nothing to classify, the job ends green.
        required: true
        type: string
      after:
        description: The push's `after` sha (github.event.after), the merge commit.
        required: true
        type: string
      repo:
        description: The calling repository, owner/name (github.repository).
        required: true
        type: string

jobs:
  alert:
    runs-on: ubuntu-latest
    # A stuck API call must not hold a runner; the other estate reusables
    # bound their jobs the same way.
    timeout-minutes: 5
    # Inherit the caller's scopes. Older callers lack checks:read; their lookup
    # fails closed to the existing alert, without rejecting the workflow call.
    env:
      MARGOT_APP_ID: "4862659"
      GH_TOKEN: ${{ github.token }}
      TARGET_REPO: ${{ inputs.repo }}
      BEFORE: ${{ inputs.before }}
      AFTER: ${{ inputs.after }}
    steps:
      - name: Classify the merge against the BASE self_instrument set
        id: classify
        run: |
          set -euo pipefail
          # Everything this step decides lands in two places the surface step
          # reads: hit=true|false on GITHUB_OUTPUT, and the matched paths (one per
          # line) in $RUNNER_TEMP/self-instrument-matched.txt.
          matched="$RUNNER_TEMP/self-instrument-matched.txt"
          : >"$matched"
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "branch creation (before is all zeros): nothing to classify"
            echo "hit=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # 1. The files this push changed. A read failure is a FAILED run, never
          #    "no files, nothing matched".
          if ! compare_files="$(gh api --paginate "repos/${TARGET_REPO}/compare/${BEFORE}...${AFTER}" --jq '.files[]' | jq -s .)"; then
            echo "::error::cannot read the changed files of ${TARGET_REPO} ${BEFORE}...${AFTER} — the merge was NOT classified"
            exit 1
          fi
          files="$(jq -r '.[] | .filename, (.previous_filename // empty)' <<<"$compare_files")"

          # 2. The classification set, BASE-NOT-HEAD. dotty's own merge is judged by
          #    its ruleset at `before` — the set as it stood before this merge, so a
          #    merge that removes its own path from the set is still caught by the
          #    set it found. Any other repo is judged by dotty's ruleset at `v1`: a
          #    merge there cannot have edited dotty's ruleset, so any committed pin
          #    is base.
          if [[ "$TARGET_REPO" == "lexijamesesq/dotty" ]]; then
            base_ref="$BEFORE"
          else
            base_ref="v1"
          fi
          if ! ruleset="$(gh api -H "Accept: application/vnd.github.raw+json" \
              "repos/lexijamesesq/dotty/contents/rulesets/default-branch.json?ref=${base_ref}")" \
             || ! jq -e '.self_instrument | type == "object"' <<<"$ruleset" >/dev/null 2>&1; then
            echo "::error::cannot read the base self_instrument set (dotty rulesets/default-branch.json at ${base_ref}) — the merge was NOT classified"
            exit 1
          fi
          echo "base ruleset: dotty rulesets/default-branch.json at ${base_ref}"

          # 3. Classify. hit() is the estate's matcher, verbatim from
          #    estate-gate.yml's owned-tier step: a trailing "/" is a directory
          #    prefix; "*" is a glob that does NOT cross "/"; "?" is one non-"/";
          #    anything else is exact — all against "/" + file. A repo absent from
          #    .self_instrument.repos is classified by the global set alone.
          files_json="$(jq -R . <<<"$files" | jq -s .)"
          jq -r --arg slug "$TARGET_REPO" --argjson files "$files_json" '
            ((.self_instrument.global // []) + (.self_instrument.repos[$slug] // [])) as $set
            | def hit($pats): . as $f | ("/" + $f) as $p
                | ($pats | any(. as $pat
                    | if ($pat|endswith("/")) then ($p|startswith($pat))
                      elif ($pat|test("[*?]")) then ($p|test("^" + ($pat|gsub("(?<c>[.^$+(){}\\[\\]|\\\\])";"\\\(.c)")|gsub("\\*";"[^/]*")|gsub("\\?";"[^/]")) + "$"))
                      else ($p==$pat) end));
            $files[] | select(hit($set))
          ' <<<"$ruleset" >"$matched"

          if [[ ! -s "$matched" ]]; then
            echo "no self-instrument path in this merge (${TARGET_REPO} ${AFTER})"
            echo "hit=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # Only merged PR heads, never the merge commit's checks or an unbound
          # check name. All associated merged PRs must carry a trusted light class.
          heads="$(gh api "repos/${TARGET_REPO}/commits/${AFTER}/pulls" \
            --jq '[.[] | select(.merged_at != null)] | .[].head.sha' 2>/dev/null || true)"
          light=false
          if [[ -n "$heads" ]]; then
            light=true
            while IFS= read -r head; do
              text="$(gh api "repos/${TARGET_REPO}/commits/${head}/check-runs?app_id=${MARGOT_APP_ID}&per_page=100" \
                --jq '[.check_runs[] | select(.name=="review / triage" and .status=="completed")] | sort_by(.started_at, .id) | last | .output.text // empty' 2>/dev/null || true)"
              if ! jq -e --arg sha "$head" 'type=="object" and .head_sha==$sha and .decision_source=="jev" and (.classification=="mechanical" or .classification=="documentation")' <<<"$text" >/dev/null 2>&1; then
                light=false
              fi
            done <<<"$heads"
          fi
          if [[ "$light" == true ]]; then
            echo "hit=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "self-instrument paths touched by ${TARGET_REPO} ${AFTER}:"
          sed 's/^/  /' "$matched"
          echo "::warning::self-instrument merge ${AFTER}: $(paste -sd ' ' "$matched")"
          echo "hit=true" >>"$GITHUB_OUTPUT"

      - name: Surface it — one comment on the merged PR (or one issue), the operator assigned
        if: steps.classify.outputs.hit == 'true'
        run: |
          set -euo pipefail
          # Detection, not a hold. This step writes exactly one comment per merged
          # PR (upserted by marker, never a pile), assigns the operator on it, and
          # falls back to one issue (deduped by title) when the push carries no PR.
          # Every write is with GITHUB_TOKEN — no App, no secret.
          matched="$RUNNER_TEMP/self-instrument-matched.txt"
          marker="<!-- self-instrument-merge -->"
          # The one identity this token writes as; its own comments are the only
          # ones it ever edits — a human comment that quotes the marker is not ours.
          me="github-actions[bot]"
          # The operator: the ruleset's declared codeowners_owner (the owner the
          # owned-path map resolves to — no CODEOWNERS file is generated from it),
          # read from the BASE ruleset the classify step already used — so a
          # merge cannot re-point the alert.
          if [[ "$TARGET_REPO" == "lexijamesesq/dotty" ]]; then
            base_ref="$BEFORE"
          else
            base_ref="v1"
          fi
          if ! assignee="$(gh api -H "Accept: application/vnd.github.raw+json" \
              "repos/lexijamesesq/dotty/contents/rulesets/default-branch.json?ref=${base_ref}" \
              | jq -er '.codeowners_owner | ltrimstr("@") | select(length > 0)')"; then
            echo "::error::no codeowners_owner in the base ruleset — nobody to assign, the alert cannot reach the operator"
            exit 1
          fi

          paths="$(while IFS= read -r p; do printf -- "- \`%s\`\n" "$p"; done <"$matched")"
          body="$(printf '%s\n' \
            "$marker" \
            "**A merge touched Margot's own instrument surface.** Detection, not a hold: verify the change was intended; if not, revert." \
            "" \
            "Merge: \`${AFTER}\`" \
            "" \
            "Matched \`self_instrument\` paths:" \
            "$paths")"

          # The merged PR(s) for this commit. A merge commit maps to exactly one
          # PR; a direct push maps to none and takes the issue path below.
          if ! prs="$(gh api "repos/${TARGET_REPO}/commits/${AFTER}/pulls" --jq '.[].number')"; then
            echo "::error::cannot list the pull requests for ${AFTER}"
            exit 1
          fi

          if [[ -n "$prs" ]]; then
            while IFS= read -r n; do
              [[ -n "$n" ]] || continue
              # She already knows about a merge she approved herself: no alert
              # (notification audit N5, 2026-09-27). Her APPROVED review is the
              # test, not who pressed merge -- a delegate merging on her login
              # without her approval is exactly what this alert exists to surface.
              if gh api --paginate "repos/${TARGET_REPO}/pulls/${n}/reviews?per_page=100" --jq '.[]' \
                | jq -es --arg a "$assignee" 'any(.[]; .user.login == $a and .state == "APPROVED")' >/dev/null; then
                echo "#${n}: ${assignee} approved this merge — no alert"
                continue
              fi
              # Upsert: the existing comment is ours by marker AND author. Read
              # every page — a comment beyond the first hundred is still ours.
              existing="$(gh api --paginate "repos/${TARGET_REPO}/issues/${n}/comments?per_page=100" \
                --jq '.[]' | jq -rs --arg m "$marker" --arg me "$me" \
                '[.[] | select(.user.login == $me and (.body | startswith($m)))] | first | .id // empty')"
              if [[ -n "$existing" ]]; then
                gh api --method PATCH "repos/${TARGET_REPO}/issues/comments/${existing}" -f body="$body" >/dev/null
                echo "updated the alert comment on #${n}"
              else
                gh api --method POST "repos/${TARGET_REPO}/issues/${n}/comments" -f body="$body" >/dev/null
                echo "posted the alert comment on #${n}"
              fi
              # The assignee: idempotent, one POST.
              if gh api "repos/${TARGET_REPO}/issues/${n}" --jq '.assignees[].login' | grep -qxF "$assignee"; then
                echo "#${n} already assigned to ${assignee}"
              else
                gh api --method POST "repos/${TARGET_REPO}/issues/${n}/assignees" -f "assignees[]=${assignee}" >/dev/null
                echo "assigned #${n} to ${assignee}"
              fi
            done <<<"$prs"
          else
            title="self-instrument merge ${AFTER}"
            # Dedupe by exact title over the issue list (state=all — a closed
            # alert is still the alert for this sha), never the search index,
            # whose lag would let a quick rerun open a second one.
            existing="$(gh api --paginate "repos/${TARGET_REPO}/issues?state=all&per_page=100" \
              --jq '.[]' | jq -rs --arg t "$title" \
              '[.[] | select(.pull_request == null and .title == $t)] | first | .number // empty')"
            if [[ -n "$existing" ]]; then
              echo "issue #${existing} already exists for ${AFTER} — not duplicated"
            else
              num="$(gh api --method POST "repos/${TARGET_REPO}/issues" \
                -f title="$title" -f body="$body" -f "assignees[]=${assignee}" --jq '.number')"
              echo "opened issue #${num} for the direct push ${AFTER}, assigned to ${assignee}"
            fi
          fi
