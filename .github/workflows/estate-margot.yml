name: Estate Margot dispatch (trusted lane)
# Reusable: a repo's own margot.yml caller invokes this on `workflow_run` (its CI
# completed successfully). This job fires the cross-repo DISPATCH of Margot's review
# workflow in dotty-private for the PR whose mechanical CI just went green — then
# exits. It NEVER runs Margot here; Margot runs only in dotty-private (dispatched).
#
# TWO paths, decided by the PR's author. A human or agent PR takes that dispatch.
# A dependency-bot PR takes neither a dispatch nor a review: the job posts the
# required `margot` check as a completed success titled "skipped: dependency bot"
# and then MERGES the pull request itself, synchronously, under a third identity.
# Both paths are documented at the steps that implement them.
#
# THREE identities, on purpose. The dependency bot authors the PR; Margot's App
# posts the `margot` check (here, a skip); "Ollie — The Intern" merges. Ollie's
# permissions are exactly Contents: write, Pull requests: write, Metadata: read —
# it cannot post a check or approve a review, so it can never manufacture the
# green it merges on.
#
# Why dispatch, not call: the public->private reusable-workflow rule governs `uses:`,
# not `gh workflow run` — so a public repo can reach Margot (private) this way. Stolen
# shape: the retired probe `margot.yml` caller (the workflow_run wake-up), generalized
# into this reusable so every repo carries only a thin caller.
#
# Trust class: like estate-gate, a workflow_call reusable resolved from the caller's
# default branch. It reads workflow_run facts as data and executes nothing from the
# PR. The App key is passed by the caller as a secret (the proven OPERATOR_RULES
# pass-through shape) and read here in a `default-branch`-environment job.
#
# Fork refusal is TWO layers: layer 1 here (GitHub omits fork PRs from
# workflow_run.pull_requests — empty — AND a fork's head_repository differs from this
# repo; both refused), layer 2 in margot-review's own floor-gate (re-derived via the
# App). The dispatched inputs are a trigger, never trusted as security facts.

on:
  workflow_call:
    inputs:
      dotty_ref:
        description: >-
          The dotty ref this job checks out for the declared dependency-bot list
          and the floor-gate script. Defaults to `v1`, the floating first-party
          major tag release-on-merge moves onto each release — the same ref
          consumers pin their `uses:` at, so the config a run reads and the YAML
          running it move together. A caller may pass an exact SHA to pin both
          to one commit. Optional with a default rather than required, because a
          required input fails every existing caller the moment they re-point
          here; the estate's other reusable (estate-ci.yml) takes the same input
          under the same name.
        required: false
        type: string
        default: v1
    secrets:
      MARGOT_APP_KEY:
        required: true
        description: >-
          Margot GitHub App private key. Delivered as a default-branch environment
          secret and passed through by the caller — the same shape as OPERATOR_RULES.
      OLLIE_APP_KEY:
        required: false
        description: >-
          "Ollie — The Intern" GitHub App private key: the autonomous merge
          identity for dependency-bot pull requests. Same delivery shape as
          MARGOT_APP_KEY (a default-branch environment secret, passed through by
          the caller). OPTIONAL, and the reason is a rollout ordering fact, not a
          preference: every existing caller passes MARGOT_APP_KEY and nothing
          else, and a reusable workflow declaring a `required: true` secret fails
          every one of those callers the moment they re-point at this version. So
          a caller that has not yet added the pass-through line simply does not
          merge — the bot path still posts the `margot` skip check, and the merge
          step logs why it stopped. Adding the line to each caller is the
          consumer-rollout change, not this one.

permissions:
  contents: read

env:
  # Margot's public GitHub App id — NOT a secret (already committed in
  # dotty-private's margot-review.yml). Only the private key is a secret.
  MARGOT_APP_ID: "4862659"
  # Ollie's public GitHub App id — NOT a secret, for the same reason. Only the
  # private key is. `GET /apps/ollie-the-intern` → id 4984137; the same id is
  # declared as the Integration bypass actor in rulesets/default-branch.json.
  OLLIE_APP_ID: "4984137"

jobs:
  dispatch:
    # Fire ONLY on a successful CI completion for a SAME-REPO PR. A fork PR
    # (whose pull_requests[] GitHub leaves empty, and whose head_repository
    # differs) is skipped, fail-closed — the next CI completion re-fires.
    #
    # `workflow_run.event == 'pull_request'` is NOT redundant with the
    # pull_requests[0] test, and the failure it answers is receipted. A
    # push-to-main CI completion also arrives here with pull_requests[0]
    # populated — GitHub fills that array from the head sha, and after a merge
    # the merged PR still matches it. Live proof in dotty on 2026-09-17:
    # CI run 35280943082 (event `push`, head_sha 746b655f) woke Margot dispatch
    # runs 35281445314 and 35282549847, both of which SUCCEEDED rather than
    # skipping, and paid for a full review of an already-merged PR. Reading the
    # originating event directly is the test that actually closes it.
    #
    # A dependency bot's PR is skipped here too — see the bot path below.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'pull_request'
          && github.event.workflow_run.pull_requests[0]
          && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # default-branch environment: carries MARGOT_APP_KEY and OLLIE_APP_KEY
    # (mirrors OPERATOR_RULES).
    environment: default-branch
    env:
      # `secrets` is not readable from a step or job `if:` — only from `env`.
      # Reducing the key to a boolean HERE is what lets the merge steps below
      # test for it without ever putting the key itself in a condition, and
      # without a caller that has not yet added the pass-through producing a red
      # run. The value is `true`/`false` as a string.
      OLLIE_KEY_PRESENT: ${{ secrets.OLLIE_APP_KEY != '' }}
    steps:
      # --- Which path this CI completion takes --------------------------------
      # `workflow_run.actor.login`, never `triggering_actor.login`: GitHub sets
      # `actor` from whoever started the ORIGINAL run and `triggering_actor`
      # from whoever started THIS one, so a human re-running a bot PR's CI
      # changes `triggering_actor` and would flip the PR back onto the paid
      # review path mid-PR. `actor` is stable for the PR's whole life.
      #
      # Receipted from real runs (the REST runs list returns the same object
      # schema as the `workflow_run` event payload), susuwatari-config
      # 2026-09-17: run 35244009277 (CI, event pull_request, head_branch
      # `dependabot/github_actions/actions/checkout-7.0.1`) has BOTH
      # actor.login and triggering_actor.login == `dependabot[bot]`. The
      # contrasting agent-authored case, dotty run 35283367606 (CI, event
      # pull_request, branch `gitleaks-thin-gating-prepush`), has
      # actor.login == `claude-the-enduring[bot]` — so the exact-match test
      # below does not over-skip the App's own PRs, which are the ones Margot
      # exists to review.
      # dotty at the caller's declared ref, for two files: the declared
      # dependency-bot list and the floor-gate script. Reading them from a
      # checkout rather than restating them here is what keeps the `margot` skip
      # check and the merge below reading ONE list, and keeps the merge's floor
      # identical to the floor Margot's own sequencing gate uses.
      #
      # `github.job_workflow_sha` — the commit of this very workflow file — would
      # be the exact pin, but it is not a documented property of the `github`
      # context and actionlint rejects it, so the declared input is the honest
      # mechanism instead.
      #
      # Sparse: two directories, no working tree beyond them. persist-credentials
      # false — nothing here pushes, and the PR's own code is never checked out at
      # all (this job reads workflow_run facts and the GitHub API, and executes
      # nothing from the pull request).
      - name: Checkout dotty at the declared ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lexijamesesq/dotty
          ref: ${{ inputs.dotty_ref }}
          path: _dotty
          persist-credentials: false
          sparse-checkout: |
            rulesets
            .github/scripts

      - name: Classify the PR author
        id: who
        env:
          RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: |
          set -euo pipefail
          # The declared list, read from dotty's rulesets JSON — ONE place, shared
          # with the merge preconditions below, so the check that gets posted and
          # the merge that follows can never disagree about who a dependency bot
          # is. Exact match on an enumerated set, never a substring or a `[bot]`
          # suffix test: "any bot" would silently exempt claude-the-enduring[bot],
          # the App that opens every agent-authored PR in this estate and exactly
          # the author Margot exists to review.
          #
          # An absent or malformed list yields NO authors, so every PR takes the
          # paid review path. That is the fail-closed direction: the failure of
          # over-reviewing costs money, the failure of under-reviewing ships
          # unreviewed code.
          authors="$(jq -r '(.dependency_bot_authors // []) | .[]' _dotty/rulesets/default-branch.json)"
          echo "declared dependency bots: $(echo "$authors" | tr '\n' ' ')"
          bot=false
          while IFS= read -r a; do
            [[ -n "$a" ]] || continue
            [[ "$RUN_ACTOR" == "$a" ]] && bot=true
          done <<< "$authors"
          echo "bot=$bot" >> "$GITHUB_OUTPUT"
          echo "author: $RUN_ACTOR"

      # --- Bot path: satisfy the `margot` required check without a review ------
      # A dependency bump's diff is a version string. Paying for a full Margot
      # review of thirteen of them per dotty patch buys nothing, so the operator's
      # call is that dependency-bot PRs skip her. But `margot` is a REQUIRED
      # check in every enrolled repo's ruleset, so skipping the dispatch alone
      # would leave every bot PR waiting forever on a check nobody will ever
      # post — which is the state the estate is in today.
      #
      # So this path posts the check itself, as a completed `success` named
      # exactly `margot`, on the PR head sha. The ruleset is untouched: `margot`
      # stays required, with no bypass actor, for every other author. The
      # alternative — a ruleset bypass for the merging actor — could not be
      # scoped to one context and would have handed that actor a pass on the
      # mechanical floor too.
      #
      # Same mechanism Margot herself uses (dotty-private margot-review.yml
      # posts `margot` as a check-run via an App token minted for the target
      # repo with permission-checks: write), so the check she would have posted
      # and the one posted here are the same object, not two shapes.
      - name: Mint the narrow checks token for this repo
        id: checks_token
        if: steps.who.outputs.bot == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.MARGOT_APP_ID }}
          private-key: ${{ secrets.MARGOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write

      - name: Post the skipped `margot` check for the dependency bot
        if: steps.who.outputs.bot == 'true'
        env:
          GH_TOKEN: ${{ steps.checks_token.outputs.token }}
          TARGET_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          echo "posting skipped margot check for ${TARGET_REPO} PR #${PR_NUMBER} @ ${HEAD_SHA}"
          # `success`, not `neutral` or `skipped`: a required check is satisfied
          # by success without argument, and the estate does not need to depend
          # on GitHub's treatment of the other two conclusions. The title says
          # plainly that no review happened, so the merge history never reads as
          # if Margot approved it.
          jq -n --arg sha "$HEAD_SHA" '{
            name: "margot",
            head_sha: $sha,
            status: "completed",
            conclusion: "success",
            output: {
              title: "skipped: dependency bot",
              summary: "No Margot review. This pull request was opened by a dependency bot, whose diff is a version string; the mechanical floor (all-checks-passed, trusted-scan) is the gate that applies to it. This check exists so the required `margot` context is satisfied — it is not an approval."
            }
          }' | gh api -X POST "repos/${TARGET_REPO}/check-runs" --input -

      # --- Bot path, part 2: merge it -----------------------------------------
      # WHY A MERGE STEP EXISTS AT ALL, and why it is synchronous.
      #
      # Every enrolled repo's default-branch ruleset sets
      # `require_code_owner_review: true`, and CODEOWNERS names exactly one owner:
      # a human. A dependency bot can therefore never collect the review its own
      # PR requires. The estate's previous answer, `gh pr merge --auto`, cannot
      # close that: GitHub honors a ruleset bypass actor on the SYNCHRONOUS merge
      # endpoint (PUT /repos/{o}/{r}/pulls/{n}/merge) but NOT on the asynchronous
      # auto-merge path when code-owner review is required — a long-standing,
      # reported behavior (github/orgs community discussions 162623 and 167357,
      # dependabot/feedback#579). An auto-merge request under any token sits
      # BLOCKED forever, which is the state every bot PR in this estate is in.
      # So the merge is performed directly, here, under an identity that is a
      # declared bypass actor.
      #
      # WHAT BYPASS MEANS, AND THE OBLIGATION IT CREATES. `bypass_mode:
      # pull_request` lets Ollie merge past the ruleset's rules on a pull request
      # — including the required status checks. GitHub therefore enforces NOTHING
      # on this merge. Every gate that would have applied is re-derived and
      # enforced by the preconditions below, in this workflow, before the call is
      # made. That is not belt-and-braces; it is the only gate on this path. A
      # precondition that cannot be established is a refusal to merge, never an
      # assumption.
      #
      # NON-BOT PRs CANNOT REACH THIS. Every step below carries
      # `steps.who.outputs.bot == 'true'`, and the merge script re-reads the PR's
      # own `user.login` from the API and re-checks it against the declared list
      # rather than trusting the classification — two independent derivations of
      # "is this a dependency bot", from two different fields
      # (workflow_run.actor.login and pull_request.user.login).
      #
      # FAILURE SHAPE: every unmet precondition logs its reason and exits 0. It
      # never posts a comment, never fails the run, and never leaves a partial
      # state — the next CI completion on that PR wakes this workflow again and
      # re-evaluates from scratch.

      # The mechanical floor, re-derived exactly the way Margot's own sequencing
      # gate derives it: dotty's committed rulesets JSON → this repo's
      # `required_contexts`, minus `margot` itself, evaluated against the head
      # sha's check-runs. Reusing the script instead of restating the rule is the
      # point — a context added to a repo's declared floor is enforced on the
      # merge path the same day it is enforced on Margot's, with no second edit.
      #
      # `margot` is excluded and that is correct here: the step above just posted
      # it, and waiting on a check this job itself writes would be a self-deadlock
      # of the same shape the floor gate's own header describes.
      #
      # The default poll window (90s), the same one Margot's own review uses, and
      # NOT a one-shot evaluation. The failure that rules out one-shot: this
      # workflow wakes on "CI" completing, but `trusted-scan` is a required
      # context produced by gate.yml on `pull_request_target` — a separate run
      # that finishes independently. If CI wins the race, a single evaluation
      # sees `trusted-scan` pending and stops, and NOTHING re-fires when
      # trusted-scan later goes green: there is no second CI completion to wake
      # on. The bot PR would then sit green-but-unmerged until a human re-ran CI,
      # which is precisely the silent stall this path exists to remove.
      # margot.yml's own header names this poll as the cover for that race.
      #
      # It runs under MARGOT's checks token, not Ollie's: reading check-runs needs
      # Checks:read, which Ollie deliberately does not have. Keeping the read on
      # Margot's side is what makes "Ollie cannot manufacture the green it merges
      # on" a property of the permissions rather than a promise.
      - name: Evaluate the mechanical floor on the head sha
        id: floor
        if: steps.who.outputs.bot == 'true'
        env:
          GH_TOKEN: ${{ steps.checks_token.outputs.token }}
          TARGET_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -uo pipefail
          # Exit 2 is the script's "I could not read the check-runs" — a transient
          # API error, not a verdict. Letting it fail the step would end the job
          # there, skip the report step below, and leave a red run with no line
          # saying why nothing merged. Treated as not-green instead: the merge is
          # refused, the reason is logged, and the next CI completion re-evaluates.
          # Any other non-zero status is a real fault and still fails the step.
          set +e
          python3 _dotty/.github/scripts/margot-floor-gate.py \
            --rulesets _dotty/rulesets/default-branch.json \
            --repo "$TARGET_REPO" \
            --head-sha "$HEAD_SHA"
          rc=$?
          set -e
          if [[ $rc -eq 2 ]]; then
            echo "::notice::floor gate could not read the check-runs for ${HEAD_SHA} — treating the floor as not green."
            echo "floor_green=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $rc

      # Ollie's token, minted only when this is a bot PR whose floor is green and
      # the caller actually passed the key. Scoped to this one repository and to
      # the two permissions the merge needs; `permission-metadata: read` is
      # implicit and is what the merge-method read below uses.
      - name: Mint Ollie's merge token
        id: ollie_token
        if: >-
          ${{ steps.who.outputs.bot == 'true'
              && steps.floor.outputs.floor_green == 'true'
              && env.OLLIE_KEY_PRESENT == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.OLLIE_APP_ID }}
          private-key: ${{ secrets.OLLIE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Report a bot PR that cannot merge
        if: >-
          ${{ steps.who.outputs.bot == 'true'
              && (steps.floor.outputs.floor_green != 'true'
                  || env.OLLIE_KEY_PRESENT != 'true') }}
        env:
          FLOOR_GREEN: ${{ steps.floor.outputs.floor_green }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          # Not a failure: both reasons are ordinary and both self-correct. A
          # not-yet-green floor is re-evaluated on the next CI completion; a
          # missing key is a caller that has not taken the rollout change yet.
          # Saying which one, in the log, is the difference between "still
          # working" and "silently stuck forever" — the two look identical from
          # the PR page, and telling them apart is why this step exists.
          if [[ "${OLLIE_KEY_PRESENT}" != "true" ]]; then
            # No expression syntax in this string, deliberately. A `run:` block is
            # interpolated by the runner BEFORE bash sees it and there is no escape
            # for it, so spelling out the caller line literally would have
            # substituted the private key into the script instead of printing the
            # instruction. The line to add is described in words.
            echo "::notice::PR #${PR_NUMBER}: not merging — this caller does not pass OLLIE_APP_KEY to the reusable. Add an OLLIE_APP_KEY pass-through to the caller's 'secrets:' block, the same shape as the MARGOT_APP_KEY line already there."
          fi
          if [[ "${FLOOR_GREEN}" != "true" ]]; then
            echo "::notice::PR #${PR_NUMBER}: not merging — the mechanical floor is not green on this head sha (see the floor-gate step). The next CI completion re-evaluates."
          fi

      # The merge. Every precondition is established from the API under Ollie's
      # own token, immediately before the call, and any one of them not holding
      # ends the step at exit 0.
      - name: Merge the dependency bump
        if: >-
          ${{ steps.who.outputs.bot == 'true'
              && steps.floor.outputs.floor_green == 'true'
              && env.OLLIE_KEY_PRESENT == 'true' }}
        env:
          GH_TOKEN: ${{ steps.ollie_token.outputs.token }}
          TARGET_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          pr="$(gh api "repos/${TARGET_REPO}/pulls/${PR_NUMBER}")"
          pr_author="$(printf '%s' "$pr" | jq -r '.user.login')"
          pr_head="$(printf '%s' "$pr" | jq -r '.head.sha')"
          pr_base="$(printf '%s' "$pr" | jq -r '.base.ref')"
          pr_state="$(printf '%s' "$pr" | jq -r '.state')"
          pr_draft="$(printf '%s' "$pr" | jq -r '.draft')"
          pr_mergeable="$(printf '%s' "$pr" | jq -r '.mergeable')"

          skip() { echo "::notice::PR #${PR_NUMBER}: not merging — $1"; exit 0; }

          # (i) Author, re-derived from the PR itself. The classification above
          # read `workflow_run.actor.login`; this reads `pull_request.user.login`.
          # Two fields, one list. A mismatch means the run and the PR disagree
          # about whose change this is, which is a refusal, not a puzzle to solve.
          if ! jq -e --arg a "$pr_author" '(.dependency_bot_authors // []) | index($a)' \
                 _dotty/rulesets/default-branch.json >/dev/null; then
            skip "author '${pr_author}' is not a declared dependency bot. This step merges dependency bumps and nothing else."
          fi

          # (ii) The sha CI completed on is still the PR's head. Without this, a
          # push landing between the CI completion and this step would be merged
          # on the strength of the PREVIOUS commit's green.
          [[ "$pr_head" == "$HEAD_SHA" ]] || \
            skip "head moved (CI completed on ${HEAD_SHA}, head is now ${pr_head}). The new head's own CI completion re-fires this."

          [[ "$pr_state" == "open" ]]  || skip "state is '${pr_state}'."
          [[ "$pr_draft" == "false" ]] || skip "it is a draft."

          # (iv) Mergeable. `null` means GitHub has not finished computing the
          # merge commit yet — not a refusal, just not yet.
          case "$pr_mergeable" in
            true)  ;;
            null)  skip "GitHub has not finished computing mergeability yet." ;;
            *)     skip "it is not mergeable (conflicts)." ;;
          esac

          # (v) Up to date with the base. Every declared ruleset sets
          # `strict_required_status_checks_policy: true`, meaning a branch must be
          # current with its base for its checks to count. Under a bypass actor
          # GitHub does not enforce that, so it is enforced here — the CI that
          # went green ran against a base that has since moved, and treating it as
          # current is exactly the hole strictness exists to close. Dependabot
          # rebases its own branches, which produces a new head sha and a new CI
          # completion, so this resolves itself.
          behind="$(gh api "repos/${TARGET_REPO}/compare/${pr_base}...${pr_head}" --jq '.behind_by')"
          [[ "$behind" == "0" ]] || \
            skip "the branch is ${behind} commit(s) behind ${pr_base}; strict checks require it to be current. A rebase re-fires this."

          # Merge method: the repo's own allowed methods, read live. The ruleset's
          # `allowed_merge_methods` is NOT the source — Ollie bypasses the
          # pull_request rule that carries it, and reading it would need
          # Administration:read, which this App does not have and should not get.
          # The repository's settings still apply to the merge either way, so they
          # are the honest constraint. Squash first: a bump is one purpose, and it
          # is the method the retired auto-merge reusable used.
          repo_json="$(gh api "repos/${TARGET_REPO}")"
          method=""
          for m in squash merge rebase; do
            case "$m" in
              squash) f=allow_squash_merge ;;
              merge)  f=allow_merge_commit ;;
              rebase) f=allow_rebase_merge ;;
            esac
            if [[ "$(printf '%s' "$repo_json" | jq -r ".${f}")" == "true" ]]; then
              method="$m"; break
            fi
          done
          [[ -n "$method" ]] || skip "the repository allows no merge method."

          echo "merging ${TARGET_REPO} PR #${PR_NUMBER} (${pr_author}) @ ${pr_head} via ${method}, as ollie-the-intern"
          # `sha` is the race guard GitHub itself enforces: if the head is not
          # still this commit when the call lands, the API returns 409 and merges
          # nothing. The check at (ii) narrows the window; this closes it.
          jq -n --arg sha "$pr_head" --arg m "$method" '{sha: $sha, merge_method: $m}' \
          | gh api -X PUT "repos/${TARGET_REPO}/pulls/${PR_NUMBER}/merge" --input - \
          | jq -r '"merged=\(.merged) sha=\(.sha) message=\(.message)"'

      # --- Human/agent path: the real dispatch --------------------------------
      # Narrow, ~1h token: actions:write on dotty-private ONLY — exactly enough to
      # dispatch the review workflow there, nothing else. The App is installed on
      # dotty-private; this mints an installation token for it from the caller.
      - name: Mint the narrow Margot dispatch token
        id: token
        if: steps.who.outputs.bot == 'false'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.MARGOT_APP_ID }}
          private-key: ${{ secrets.MARGOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dotty-private
          permission-actions: write

      - name: Dispatch margot-review in dotty-private
        if: steps.who.outputs.bot == 'false'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # The target repo + PR come from the trusted workflow_run event context
          # (never user input); margot-review re-derives head/fork from them.
          TARGET_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "dispatching margot-review for ${TARGET_REPO} PR #${PR_NUMBER} @ ${HEAD_SHA}"
          # Direct REST workflow-dispatch, NOT `gh workflow run`: the latter does
          # client-side workflow/default-branch resolution that the narrow
          # actions:write installation token cannot perform (proven to fail; the
          # REST POST returns 204 and triggers the run). ref = dotty-private's
          # default branch, where margot-review.yml lives. Inputs go through
          # jq --arg (no shell interpolation into the JSON body).
          jq -n --arg repo "$TARGET_REPO" --arg pr "$PR_NUMBER" --arg sha "$HEAD_SHA" \
            '{ref:"main",inputs:{repo:$repo,pr:$pr,sha:$sha}}' \
          | gh api -X POST "repos/lexijamesesq/dotty-private/actions/workflows/margot-review.yml/dispatches" --input -
