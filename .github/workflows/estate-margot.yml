name: Estate Margot dispatch (trusted lane)
# Reusable: a repo's own margot.yml caller invokes this on `workflow_run` (its CI
# completed successfully). This job fires the cross-repo DISPATCH of Margot's review
# workflow in lexijamesesq/margot for the PR whose mechanical CI just went green — then
# exits. It NEVER runs Margot here; Margot runs only in lexijamesesq/margot (dispatched).
#
# TWO paths, decided by the construction freeze — NOT the author. Every PR
# (human, agent, or dependency bot) takes the dispatch and gets a Margot review;
# Margot's route is the cost gate (a mechanical bump cheap-clears, a safety-core
# bump gets the card, both cheap). The ONLY skip is the freeze: while
# MARGOT_FREEZE is set the job posts the required `margot` check as a completed
# success titled "skipped: construction freeze" and stops. Both paths are
# documented at the steps that implement them. (The pre-Jev dependency-bot skip
# is retired — Jev's deterministic pre-check is the cost gate that made it
# unnecessary.)
#
# THIS JOB NO LONGER MERGES ANYTHING. It used to mint a third App's token and
# merge dependency bumps itself, because nothing else could. Renovate does that
# now — it opens the bump, waits for its own checks, and merges under its own
# App as a declared bypass actor — so the merge step, its token, and the
# OLLIE_APP_KEY plumbing are all gone rather than left inert. Renovate is
# self-hosted in dotty's Actions and runs as Ollie, so the identity on both the
# bump and its merge is `ollie-the-intern[bot]`.
#
# IDENTITIES on a dependency bump. Ollie authors the bump and (pre-flip) merges
# it via Renovate self-merge; Margot now REVIEWS it — the bot-skip is retired, so
# a bump gets a real `margot` verdict like any PR. Ollie still cannot produce the
# green it merges on: its Renovate token holds Checks READ and no Administration,
# and every required context (including `margot`) is bound to its reporting App by
# `integration_id`, so a check Ollie posted under a required context's name would
# not satisfy it. No identity both reviews and merges the same pull request. Once
# the guardrail migration retires require_code_owner_review and sets
# platformAutomerge, the merge becomes GitHub-native and Ollie's self-merge +
# bypass retire.
#
# Why dispatch, not call: the public->private reusable-workflow rule governs `uses:`,
# not `gh workflow run` — so a public repo can reach Margot (private) this way. Stolen
# shape: the retired probe `margot.yml` caller (the workflow_run wake-up), generalized
# into this reusable so every repo carries only a thin caller.
#
# Trust class: like estate-gate, a workflow_call reusable resolved from the caller's
# default branch. It reads workflow_run facts as data and executes nothing from the
# PR. The App key is passed by the caller as a secret (the proven OPERATOR_RULES
# pass-through shape) and read here in a `default-branch`-environment job.
#
# Fork refusal is TWO layers: layer 1 here (GitHub omits fork PRs from
# workflow_run.pull_requests — empty — AND a fork's head_repository differs from this
# repo; both refused), layer 2 in margot-review's own floor-gate (re-derived via the
# App). The dispatched inputs are a trigger, never trusted as security facts.

on:
  workflow_call:
    inputs:
      dotty_ref:
        description: >-
          The dotty ref this job checks out for the declared dependency-bot list.
          Defaults to `v1`, the floating first-party
          major tag release-on-merge moves onto each release — the same ref
          consumers pin their `uses:` at, so the config a run reads and the YAML
          running it move together. A caller may pass an exact SHA to pin both
          to one commit. Optional with a default rather than required, because a
          required input fails every existing caller the moment they re-point
          here; the estate's other reusable (estate-ci.yml) takes the same input
          under the same name.
        required: false
        type: string
        default: v1
    secrets:
      MARGOT_APP_KEY:
        required: true
        description: >-
          Margot GitHub App private key. Delivered as a default-branch environment
          secret and passed through by the caller — the same shape as OPERATOR_RULES.

permissions:
  contents: read

env:
  # Margot's public GitHub App id — NOT a secret (already committed in
  # margot's margot-review.yml). Only the private key is a secret.
  MARGOT_APP_ID: "4862659"
  # --- CONSTRUCTION FREEZE ---
  # "true" for the rebuild window: every PR routes to the freeze skip-success
  # path below instead of a review dispatch, so the `margot` required check still
  # posts (as "skipped: construction freeze") with no review cost. This is now
  # the ONLY skip — the dependency-bot skip is retired, so at un-freeze every PR
  # (bot included) dispatches to Margot. The ONLY documented un-freeze is setting
  # this value back to "false". Every read of it below is guarded
  # (`${MARGOT_FREEZE:-false}`) so the line is safe against an unset variable
  # under `set -u`, but that guard is a safety net, not a supported un-freeze
  # path — flipping the value to "false" is.
  MARGOT_FREEZE: "false"

jobs:
  dispatch:
    # Fire ONLY on a successful CI completion for a SAME-REPO PR. A fork PR
    # (whose pull_requests[] GitHub leaves empty, and whose head_repository
    # differs) is skipped, fail-closed — the next CI completion re-fires.
    #
    # `workflow_run.event == 'pull_request'` is NOT redundant with the
    # pull_requests[0] test, and the failure it answers is receipted. A
    # push-to-main CI completion also arrives here with pull_requests[0]
    # populated — GitHub fills that array from the head sha, and after a merge
    # the merged PR still matches it. Live proof in dotty on 2026-09-17:
    # CI run 35280943082 (event `push`, head_sha 746b655f) woke Margot dispatch
    # runs 35281445314 and 35282549847, both of which SUCCEEDED rather than
    # skipping, and paid for a full review of an already-merged PR. Reading the
    # originating event directly is the test that actually closes it.
    #
    # Author no longer decides skip — every PR (bot included) dispatches to
    # Margot; the only skip is the construction freeze, set in the who step.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'pull_request'
          && github.event.workflow_run.pull_requests[0]
          && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # default-branch environment: carries MARGOT_APP_KEY (mirrors OPERATOR_RULES).
    environment: default-branch
    steps:
      # --- Which path this CI completion takes --------------------------------
      # `workflow_run.actor.login`, never `triggering_actor.login`: GitHub sets
      # `actor` from whoever started the ORIGINAL run and `triggering_actor`
      # from whoever started THIS one, so a human re-running a bot PR's CI
      # changes `triggering_actor` and would flip the PR back onto the paid
      # review path mid-PR. `actor` is stable for the PR's whole life.
      #
      # Receipted from real runs (the REST runs list returns the same object
      # schema as the `workflow_run` event payload), susuwatari-config
      # 2026-09-17: run 35244009277 (CI, event pull_request, head_branch
      # `dependabot/github_actions/actions/checkout-7.0.1`) has BOTH
      # actor.login and triggering_actor.login == `dependabot[bot]`. The
      # contrasting agent-authored case, dotty run 35283367606 (CI, event
      # pull_request, branch `gitleaks-thin-gating-prepush`), has
      # actor.login == `claude-the-enduring[bot]` — so the exact-match test
      # below does not over-skip the App's own PRs, which are the ones Margot
      # exists to review.
      # dotty at the caller's declared ref, for ONE file: the declared
      # dependency-bot list. Reading it from a checkout rather than restating it
      # here is what keeps the `margot` skip check and every other reader of that
      # list in agreement. The floor-gate script used to be fetched here too, for
      # a merge step this job no longer has.
      #
      # `github.job_workflow_sha` — the commit of this very workflow file — would
      # be the exact pin, but it is not a documented property of the `github`
      # context and actionlint rejects it, so the declared input is the honest
      # mechanism instead.
      #
      # Sparse: two directories, no working tree beyond them. persist-credentials
      # false — nothing here pushes, and the PR's own code is never checked out at
      # all (this job reads workflow_run facts and the GitHub API, and executes
      # nothing from the pull request).
      - name: Checkout dotty at the declared ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lexijamesesq/dotty
          ref: ${{ inputs.dotty_ref }}
          path: _dotty
          persist-credentials: false
          sparse-checkout: |
            rulesets

      - name: Classify the PR author
        id: who
        env:
          RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: |
          set -euo pipefail
          # The declared list, read from dotty's rulesets JSON — ONE place, the
          # same list estate-ci.yml reads, so every consumer agrees on who a
          # dependency bot is. Exact match on an enumerated set, never a substring
          # or a `[bot]` suffix test: "any bot" would silently exempt
          # claude-the-enduring[bot], the App that opens every agent-authored PR
          # in this estate and exactly the author Margot exists to review.
          #
          # `bot` is emitted but no longer routes anything (the bot-skip is
          # retired): it is retained as the ruleset-authoritative provenance
          # signal the deferred class-proof increment will consume
          # (derive-don't-label). Until then it has no live consumer.
          #
          # An absent or malformed list yields NO authors, so every PR takes the
          # paid review path. That is the fail-closed direction: the failure of
          # over-reviewing costs money, the failure of under-reviewing ships
          # unreviewed code.
          authors="$(jq -r '(.dependency_bot_authors // []) | .[]' _dotty/rulesets/default-branch.json)"
          echo "declared dependency bots: $(echo "$authors" | tr '\n' ' ')"
          bot=false
          while IFS= read -r a; do
            [[ -n "$a" ]] || continue
            [[ "$RUN_ACTOR" == "$a" ]] && bot=true
          done <<< "$authors"
          echo "bot=$bot" >> "$GITHUB_OUTPUT"
          # --- CONSTRUCTION FREEZE ---
          # `skip` is the routing decision every later step keys on. Dependency
          # bots are NO LONGER skipped: every PR — bot or human — routes to
          # Margot, whose route/rate_risk IS the cost gate (a mechanical bump
          # gets low nouls and cheap-clears with no council spend; a safety-core
          # bump summons the card and still auto-merges LOW if clean). The
          # pre-Jev bot-skip was only a cost hack — don't pay for inference on a
          # version-string diff — and Jev's deterministic pre-check removes that
          # risk, so the blanket skip is retired. `skip` now keys ONLY on the
          # construction freeze: `false` normally (dispatch), `true` only while
          # MARGOT_FREEZE is set. So this change is inert until un-freeze, and
          # `skip==true` is now ALWAYS the freeze, never a bot. `bot` is still
          # emitted above — retained as the ruleset-authoritative provenance
          # input the class-proof increment will consume (derive-don't-label).
          # The deref defaults to "false" so a missing MARGOT_FREEZE never trips
          # `set -u`; the supported un-freeze is still setting the env to "false".
          skip=false
          if [[ "${MARGOT_FREEZE:-false}" == "true" ]]; then
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "author: $RUN_ACTOR"

      # --- Freeze path: satisfy the `margot` required check without a review ---
      # This path fires ONLY under the construction freeze (skip==true ⟺
      # MARGOT_FREEZE). It exists because `margot` is a REQUIRED check in every
      # enrolled repo's ruleset: while paid review dispatch is frozen for the
      # rebuild window, skipping the dispatch alone would leave every PR waiting
      # forever on a check nobody posts. So this path posts the check itself, as
      # a completed `success` named exactly `margot`, on the PR head sha, titled
      # honestly as a freeze skip (never an approval). The ruleset is untouched:
      # `margot` stays required, with no bypass actor.
      #
      # (Pre-Jev this path ALSO skipped dependency-bot PRs as a cost hack; that
      # blanket bot-skip is retired — bots now route to Margot like any PR, so
      # `skip==true` is only ever the freeze. See the freeze comment above.)
      #
      # Same mechanism Margot herself uses (margot's margot-review.yml
      # posts `margot` as a check-run via an App token minted for the target
      # repo with permission-checks: write), so the check she would have posted
      # and the one posted here are the same object, not two shapes.
      # Minted on BOTH paths: the freeze path posts the skipped check with it,
      # and the dispatch path (below) posts the queued check with it.
      - name: Mint the narrow checks token for this repo
        id: checks_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.MARGOT_APP_ID }}
          private-key: ${{ secrets.MARGOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write

      - name: Post the skipped `margot` check
        if: steps.who.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ steps.checks_token.outputs.token }}
          TARGET_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          echo "posting skipped margot check for ${TARGET_REPO} PR #${PR_NUMBER} @ ${HEAD_SHA}"
          # `success`, not `neutral` or `skipped`: a required check is satisfied
          # by success without argument, and the estate does not need to depend
          # on GitHub's treatment of the other two conclusions. The title says
          # plainly that no review happened, so the merge history never reads as
          # if Margot approved it. skip==true is now ALWAYS the construction
          # freeze (the bot-skip is retired), so there is one honest title.
          title="skipped: construction freeze"
          summary="No Margot review. Paid Margot review dispatch is frozen for the estate's rebuild window (see this workflow's MARGOT_FREEZE guard). The mechanical floor (all-checks-passed, trusted-scan) is the gate that applies to this pull request. This check exists so the required \`margot\` context is satisfied — it is not an approval."
          jq -n --arg sha "$HEAD_SHA" --arg title "$title" --arg summary "$summary" '{
            name: "margot",
            head_sha: $sha,
            status: "completed",
            conclusion: "success",
            output: {
              title: $title,
              summary: $summary
            }
          }' | gh api -X POST "repos/${TARGET_REPO}/check-runs" --input -

      # (This job no longer merges anything. The synchronous bypass-merge step
      # that once lived here — for bot PRs that could not collect a code-owner
      # review — was removed when dependency merging moved to Renovate's own
      # self-merge; its stale documentation is removed here with the bot-skip.
      # This workflow now only posts the freeze check (above) or dispatches
      # Margot (below); the merge is external, and becomes native auto-merge
      # once the guardrail migration retires require_code_owner_review and sets
      # platformAutomerge.
      - name: Mint the narrow PR-read token for the target repo
        id: pr_token
        if: steps.who.outputs.skip == 'false'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.MARGOT_APP_ID }}
          private-key: ${{ secrets.MARGOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          # Narrow, target-repo-scoped, read-only: the dispatch token is
          # margot/actions:write and the checks token is checks:write, so
          # neither can list the target PR's files. This one exists only to read
          # them for the owned-tier computation.
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: read

      - name: Compute the owned-path tier from the ruleset
        id: tier
        if: steps.who.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.pr_token.outputs.token }}
          TARGET_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          # The owned-path tier is a SCRUTINY INPUT for Margot (it raises the risk
          # band / summons the safety card), NEVER a hard hold — the driver reads it
          # from MARGOT_OWNED_TIER. Derived pure from the AUTHORITATIVE ruleset, never
          # the generated CODEOWNERS artifact (which the provisioner audits AGAINST the
          # ruleset): global `codeowners_required_owned` (the safety core, all repos)
          # takes priority, then the per-repo `.repos[<slug>].codeowners_owned` /
          # `codeowners_full_owned` broad set.
          ruleset=_dotty/rulesets/default-branch.json
          files_json="$(gh api --paginate "repos/${TARGET_REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' | jq -R . | jq -s .)"
          # Fail-safe: a repo absent from the ruleset `.repos` is a provisioning gap —
          # default its broad tier to `owned` (MORE scrutiny, never `none`) and warn so
          # the gap gets fixed rather than masked, matching the dispatch's conservative
          # posture. Safety-core is still covered via the global list regardless.
          if ! jq -e --arg slug "$TARGET_REPO" '.repos | has($slug)' "$ruleset" >/dev/null; then
            echo "::warning::repo ${TARGET_REPO} absent from ruleset .repos — owned tier defaulted to 'owned' (provisioning gap); add it to rulesets .repos"
          fi
          tier="$(jq -r --arg slug "$TARGET_REPO" --argjson files "$files_json" '
            (.codeowners_required_owned // []) as $req
            | (.repos | has($slug)) as $listed
            | (.repos[$slug] // {}) as $repo
            | ($repo.codeowners_owned // []) as $own
            | ($repo.codeowners_full_owned == true) as $full
            # hit() matches a changed file against the ruleset patterns with the
            # SAME semantics the estate CODEOWNERS matcher uses (codeowners-drift.py
            # _translate): a trailing "/" is a directory prefix; "*" is a glob that
            # does NOT cross "/" ([^/]*); "?" is one non-"/". A pattern with an
            # embedded glob (e.g. /pi-cc/*-egress-setup.sh) must NOT fall to exact
            # match — that would never fire and silently drop the tier toward none
            # (less scrutiny). Regex specials are escaped before the glob chars are
            # expanded, and the whole thing is anchored.
            | def hit($pats): . as $f | ("/" + $f) as $p
                | ($pats | any(. as $pat
                    | if ($pat|endswith("/")) then ($p|startswith($pat))
                      elif ($pat|test("[*?]")) then ($p|test("^" + ($pat|gsub("(?<c>[.^$+(){}\\[\\]|\\\\])";"\\\(.c)")|gsub("\\*";"[^/]*")|gsub("\\?";"[^/]")) + "$"))
                      else ($p==$pat) end));
            if ($files | any(hit($req))) then "required_owned"
            elif ($listed | not) then "owned"
            elif ($full or ($files | any(hit($own)))) then "owned"
            else "none" end
          ' "$ruleset")"
          echo "owned tier for ${TARGET_REPO} PR #${PR_NUMBER}: ${tier}"
          echo "tier=${tier}" >> "$GITHUB_OUTPUT"

      - name: Mint the narrow Margot dispatch token
        id: token
        if: steps.who.outputs.skip == 'false'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.MARGOT_APP_ID }}
          private-key: ${{ secrets.MARGOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: margot
          permission-actions: write

      - name: Dispatch margot-review in margot
        if: steps.who.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # The target repo + PR come from the trusted workflow_run event context
          # (never user input); margot-review re-derives head/fork from them.
          TARGET_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # Computed above; one of required_owned | owned | none (our own value,
          # not user input) — a scrutiny input Margot's route consumes, never a
          # hold. margot-review accepts it as `owned_tier` (absent -> unknown).
          OWNED_TIER: ${{ steps.tier.outputs.tier }}
        run: |
          set -euo pipefail
          echo "dispatching margot-review for ${TARGET_REPO} PR #${PR_NUMBER} @ ${HEAD_SHA} (owned_tier=${OWNED_TIER})"
          # Direct REST workflow-dispatch, NOT `gh workflow run`: the latter does
          # client-side workflow/default-branch resolution that the narrow
          # actions:write installation token cannot perform (proven to fail; the
          # REST POST returns 204 and triggers the run). ref = margot's
          # default branch, where margot-review.yml lives. Inputs go through
          # jq --arg (no shell interpolation into the JSON body).
          jq -n --arg repo "$TARGET_REPO" --arg pr "$PR_NUMBER" --arg sha "$HEAD_SHA" \
            --arg tier "$OWNED_TIER" \
            '{ref:"main",inputs:{repo:$repo,pr:$pr,sha:$sha,owned_tier:$tier}}' \
          | gh api -X POST "repos/lexijamesesq/margot/actions/workflows/margot-review.yml/dispatches" --input -

      # Visibility from the first second. A dispatched review can wait in
      # margot's runner queue for a long time (receipted 2026-09-25: one release
      # opened thirteen dependency bumps at once and fourteen reviews queued
      # behind two runners), and until margot-review's own job started, the
      # pull request showed NO `margot` check at all — a queued review looked
      # exactly like a review that would never happen, and the operator could
      # not tell the two apart from the page. So the dispatch posts the `margot`
      # check-run itself, as `queued`, the moment the dispatch is accepted.
      # margot-review then updates that same check as it moves (floor gate,
      # council, verdict); GitHub shows the newest check-run of a name per App,
      # so even a fresh post from her side supersedes this one rather than
      # sitting beside it. Same App identity, same check name: one object on
      # the PR from dispatch to verdict.
      - name: Post the queued `margot` check
        if: steps.who.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.checks_token.outputs.token }}
          TARGET_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          DISPATCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # One check per head, never two: a manual re-dispatch of the same head
          # must take over the existing `margot` check, not sit beside it. The
          # lookup is the exact one margot-review uses to find the check it
          # updates (name + App id on this sha; the API returns the latest per
          # name and App), so both sides address one object.
          existing=$(gh api "repos/${TARGET_REPO}/commits/${HEAD_SHA}/check-runs?check_name=margot&app_id=${MARGOT_APP_ID}" \
            --jq '.check_runs | length')
          if [ "${existing:-0}" != "0" ]; then
            echo "a margot check already exists on ${HEAD_SHA} (${existing}) — margot-review will update it; not posting a second"
            exit 0
          fi
          title="Margot: dispatched — waiting to start"
          summary="Dispatched for #${PR_NUMBER} at $(date -u +%Y-%m-%dT%H:%M:%SZ). This check updates in place as Margot moves (preflight, waiting for a review runner, council, verdict). Dispatch run: ${DISPATCH_RUN_URL}"
          jq -n --arg sha "$HEAD_SHA" --arg title "$title" --arg summary "$summary" '{
            name: "margot",
            head_sha: $sha,
            status: "queued",
            output: { title: $title, summary: $summary }
          }' | gh api -X POST "repos/${TARGET_REPO}/check-runs" --input - >/dev/null
          echo "posted queued margot check for ${TARGET_REPO} PR #${PR_NUMBER} @ ${HEAD_SHA}"
