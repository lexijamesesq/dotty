name: Estate CI (routine lane)
# The universal CI's routine lane (the "Local to merged" map's estate-wide CI step).
# workflow_call target — every repo's own ci.yml calls this on `pull_request`
# and `push`. Runs entirely in the PR's own context: never handles the
# operator overlay secret (that's the trusted lane, a separate reusable
# workflow, estate-gate.yml, on pull_request_target).
#
# Base-rules gitleaks coverage here is GL_NO_OVERLAY mode (git-hooks/
# gitleaks-common.sh): the repo's own .gitleaks.toml is loaded unmodified (so
# its [[rules]]/[allowlist] apply identically to both lanes), and gl_resolve
# points its [extend] token at a `useDefault = true` stub instead of the
# operator overlay -- gitleaks' own stock ruleset, no operator content, by
# design. This is NOT the private-pattern class (ticket ids, vault paths,
# roster names, employer/product names) -- that coverage is the trusted
# lane's job, over the operator's real ruleset.

on:
  workflow_call:
    inputs:
      dotty_ref:
        description: >-
          The exact commit this reusable workflow was called at (the SHA in
          the caller's own `uses: .../estate-ci.yml@<sha>` line, repeated
          here) -- used to check out dotty's git-hooks/*.sh at the identical
          pin, rather than re-deriving it from workflow context.
        required: true
        type: string

permissions:
  contents: read

jobs:
  universal-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0

      - name: Checkout dotty (pinned, for the gitleaks hook scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lexijamesesq/dotty
          ref: ${{ inputs.dotty_ref }}
          path: _dotty

      - name: Setup gitleaks
        uses: lexijamesesq/dotty/.github/actions/setup-gitleaks@4e9fcf7fec358580d773b8c9bc1616a116fb99b4 # includes the pinned-checksum fix (#221)
        with:
          version: '8.30.1'

      # A repo with no .pre-commit-config.yaml is a legitimate empty appendix
      # (e.g. home-assistant: a config repo whose CI is the estate lane, with
      # no file-content hooks of its own). `pre-commit run` on such a repo
      # dies with InvalidConfigError -- found live the first time this lane ran
      # against home-assistant. Treat absence as a first-class case: skip the
      # four pre-commit-dependent steps below with a notice, and let the direct
      # base-rules gitleaks scans (which do NOT need pre-commit) still gate.
      # The pre-commit-invoked hooks skipped here (gitleaks-staged, house-code)
      # add no coverage this lane relies on anyway: gitleaks-staged scans the
      # always-empty CI index, and the real gitleaks coverage is the direct
      # scans; house-code's pattern checks apply only to repos that ship the
      # hook, which by definition an empty-appendix repo does not.
      - name: Detect pre-commit config
        id: precommit_cfg
        working-directory: repo
        run: |
          set -euo pipefail
          # pre-commit reads exactly .pre-commit-config.yaml -- no .yml variant.
          if [ -f .pre-commit-config.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No .pre-commit-config.yaml -- treating this repo as a legitimate empty appendix; the pre-commit file-content hooks are skipped. Base-rules gitleaks coverage still runs via the direct scans (tree/PR range, commit messages, branch/title/body)."
          fi

      # vale on PATH so the shared vale-self-narration pre-commit hook is
      # ENFORCED here (the hook fails open locally when vale is absent — CI is
      # where it gates, so CI must install it). Only when the caller has a
      # pre-commit config (an empty-appendix repo runs no hooks), matching the
      # other pre-commit-dependent steps. A caller that hasn't adopted the hook
      # just carries an unused binary — cheap. Referenced from the _dotty
      # checkout (fetched above at inputs.dotty_ref for the hook scripts), so it
      # pins to the same dotty ref the rest of the lane uses — no floating @main.
      - name: Setup vale
        if: steps.precommit_cfg.outputs.present == 'true'
        uses: ./_dotty/.github/actions/setup-vale
        with:
          version: '3.9.5'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.precommit_cfg.outputs.present == 'true'
        with:
          python-version: '3.12'
      - name: Install pre-commit
        if: steps.precommit_cfg.outputs.present == 'true'
        run: pip install pre-commit==4.6.0

      # `uv`/`uvx` on PATH: found missing when this job first ran against a
      # real caller repo whose own .pre-commit-config.yaml declares a
      # `language: system` hook with an `entry: uvx ...` (dotty's own ruff
      # hook) -- a system-language hook installs nothing itself, so without
      # this the hook fails "Executable `uvx` not found" on every such repo,
      # not just dotty. Cheap and harmless for repos with no such hook.
      - name: Install uv (uvx) for system-language pre-commit hooks that need it
        if: steps.precommit_cfg.outputs.present == 'true'
        run: pip install uv==0.11.22

      - name: pre-commit run --all-files (file-content hooks; base rules only, by design)
        if: steps.precommit_cfg.outputs.present == 'true'
        working-directory: repo
        env:
          # Base rules only, ON PURPOSE -- not a fallback for a missing
          # install. The trusted lane (estate-gate.yml) carries the operator
          # overlay AND the real roster; this lane never sees either. The
          # pre-commit-invoked gitleaks-staged hook fires here too, but
          # scans the (always empty, on a CI checkout) git index -- it is
          # NOT a real check; the real base-rules coverage is the four
          # direct scans below. HC_NO_OVERLAY (house-code.py) is the same
          # concept for the roster-name-leak class -- a CI runner never
          # holds the real roster; the other three house-code checks
          # (ticket-id, vault-path, section-ref) are pure pattern and run
          # here unaffected.
          #
          # GH_TOKEN: house-code.py's verify_is_dotty() shells out to
          # `gh api repos/{owner}/{repo}` to gate its own dogfood-fixture
          # exemption (_OWN_FIXTURES) live, never on path shape alone (a
          # pressure-test finding named in the script itself). Without a
          # token that call fails closed to NOT dotty -- found live, the
          # first time this job ran against dotty's own content: its own
          # scanner source and test fixtures (the only files _OWN_FIXTURES
          # ever names) flagged themselves. github.token is read-only
          # public-metadata scope, sufficient for this one lookup; no
          # caller's own repo has files at these exact paths, so this is a
          # dotty-only effect everywhere else.
          GL_NO_OVERLAY: "1"
          HC_NO_OVERLAY: "1"
          GH_TOKEN: ${{ github.token }}
        run: pre-commit run --all-files --show-diff-on-failure

      # The base-rules gitleaks scans below default their config to the
      # caller's own .gitleaks.toml (GL_CONFIG_PATH's fallback). A legitimate
      # empty-appendix repo (e.g. home-assistant) ships none, so gl_resolve
      # would BLOCK "gitleaks config not found" and the core lane's own base
      # coverage would never run -- found live on home-assistant #26. The base
      # rules belong to the core lane, not the caller: a caller's .gitleaks.toml
      # is an appendix (its own extra [[rules]]/[allowlist]), never the SOURCE
      # of the base. When the caller has none, fall back to dotty's own base
      # config from the pinned _dotty checkout (under GL_NO_OVERLAY its [extend]
      # token resolves to gitleaks' stock defaults, so this is the stock base
      # ruleset, no operator content). All three direct scans below read
      # GL_CONFIG_PATH (gitleaks-range-scan.sh and gitleaks-commit-msg.sh share
      # the same default), so exporting it once here covers every one. Fail
      # closed if the caller has none AND dotty's base config is missing.
      - name: Resolve base gitleaks config (fall back to dotty's when the caller has none)
        working-directory: repo
        run: |
          set -euo pipefail
          if [ -f .gitleaks.toml ]; then
            echo "Caller ships its own .gitleaks.toml -- base rules come from its useDefault stock defaults, its own rules are the appendix. Using it (GL_CONFIG_PATH stays unset)."
          else
            base="$GITHUB_WORKSPACE/_dotty/.gitleaks.toml"
            if [ ! -f "$base" ]; then
              echo "::error::estate-ci: caller has no .gitleaks.toml AND dotty's own base config is missing at $base -- cannot run the base-rules scans (fail-closed)."
              exit 1
            fi
            echo "::notice::No .gitleaks.toml in this repo -- using dotty's own base gitleaks config from the pinned _dotty checkout for the direct base-rules scans (tree/PR range, commit messages, branch/title/body)."
            echo "GL_CONFIG_PATH=$base" >> "$GITHUB_ENV"
          fi

      # THE AUTHORITATIVE SECRET GATE IS PR-TRIGGERED (diff-scoped base..head).
      # A direct push to a protected branch is an admin act, not a gated path
      # (the "Protect main" ruleset requires a PR + strict required checks for
      # non-admins). So the range secret scan runs ONLY on pull_request, keyed
      # on the PR event's own base.sha..head.sha -- a workflow fact, never
      # reconstructed. The old push-event range reconstruction
      # (github.event.before..github.sha with an all-zeros fallback) is REMOVED,
      # not relocated: it was itself a mini range-resolution surface (the
      # Cluster-A class this slice exists to eliminate), and any push to main was
      # already diff-scoped-scanned as a PR before it merged. Non-range checks
      # (the pre-commit file-content hooks, actionlint) still run on push; the
      # range secret scan does not.
      - name: Base-rules gitleaks -- diff-scoped PR range
        if: github.event_name == 'pull_request'
        working-directory: repo
        env:
          GL_NO_OVERLAY: "1"
          GL_RANGE_BASE: ${{ github.event.pull_request.base.sha }}
          GL_RANGE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash "$GITHUB_WORKSPACE/_dotty/git-hooks/gitleaks-range-scan.sh"

      - name: Base-rules gitleaks -- every commit message in the PR range
        if: github.event_name == 'pull_request'
        working-directory: repo
        env:
          GL_NO_OVERLAY: "1"
          SCAN_FROM: ${{ github.event.pull_request.base.sha }}
          SCAN_TO: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            msgfile="$(mktemp)"
            git log -1 --format=%B "$sha" > "$msgfile"
            GL_TEXT_FILE="$msgfile" bash "$GITHUB_WORKSPACE/_dotty/git-hooks/gitleaks-commit-msg.sh" || fail=1
            rm -f "$msgfile"
          done <<< "$(git rev-list "${SCAN_FROM}..${SCAN_TO}")"
          exit "$fail"

      # PR title/body/branch exist only on a pull_request. On push there is no
      # PR text to scan (the pushed commits' messages are covered by the scan
      # above, the content by the tree scan), so this step runs on
      # pull_request only rather than scanning empty strings on push.
      - name: Base-rules gitleaks -- branch name, PR title, PR body
        if: github.event_name == 'pull_request'
        working-directory: repo
        env:
          GL_NO_OVERLAY: "1"
          # Untrusted PR text arrives ONLY via named env vars, quoted as
          # shell variables below -- never interpolated as a ${{ }}
          # expression inside this (or any) run: string. actionlint (next
          # step) enforces this estate-wide, not just here.
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          fail=0
          for pair in "PR_BRANCH:branch name" "PR_TITLE:PR title" "PR_BODY:PR body"; do
            var="${pair%%:*}"; label="${pair#*:}"
            f="$(mktemp)"
            printf '%s' "${!var}" > "$f"
            echo "Scanning: $label"
            GL_TEXT_FILE="$f" bash "$GITHUB_WORKSPACE/_dotty/git-hooks/gitleaks-commit-msg.sh" || fail=1
            rm -f "$f"
          done
          exit "$fail"

      - name: Install actionlint
        run: |
          set -euo pipefail
          ver="1.7.12"
          base="https://github.com/rhysd/actionlint/releases/download/v${ver}"
          tmp="$(mktemp -d)"; cd "$tmp"
          tarball="actionlint_${ver}_linux_amd64.tar.gz"
          curl -sSfL -o "$tarball" "${base}/${tarball}"
          curl -sSfL -o checksums.txt "${base}/actionlint_${ver}_checksums.txt"
          line="$(grep -E "[[:space:]]${tarball}\$" checksums.txt)"
          [ "$(printf '%s\n' "$line" | wc -l)" -eq 1 ]
          printf '%s\n' "$line" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: "actionlint (gates the job): flags expression-injection in run blocks by default"
        working-directory: repo
        run: |
          shopt -s globstar nullglob
          files=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no workflow files in this repo"; exit 0
          fi
          actionlint "${files[@]}"

      # zizmor: enforces the estate's two GitHub Actions security audits — every
      # third-party action pinned to a full SHA (unpinned-uses) and no untrusted
      # ${{ }} expanded into a run block (template-injection). Complements
      # actionlint (which cannot parse composite action.yml at all, and misses
      # injections zizmor catches). Config (only-those-two + the ref-pin policy
      # for the estate's tag-pinned reusable workflows) lives in dotty at the
      # pinned ref; the version is pinned in setup-zizmor.
      - name: Setup zizmor
        uses: ./_dotty/.github/actions/setup-zizmor
        with:
          version: '1.30.0'
      - name: "zizmor (gates the job): SHA-pin enforcement + template-injection"
        working-directory: repo
        run: |
          set -euo pipefail
          # Offline (both enabled audits are static — no GitHub API), high
          # confidence (drops zizmor's low-confidence noise, e.g. a step's own
          # outputs, while keeping the real HIGH event/inputs→run findings).
          # Unset any empty *_TOKEN the runner may export (zizmor rejects an
          # empty token even with --offline). Scans workflows AND composite actions.
          unset GH_TOKEN GITHUB_TOKEN || true
          zizmor --offline --min-confidence high \
            --config "$GITHUB_WORKSPACE/_dotty/.github/zizmor.yml" \
            .github/

      # PR-body-template gate (mechanical, required): the PR body must follow the
      # estate's pr-body:v1 template — the claims in it are the evidence a reviewer
      # (human or Margot) verifies, so an empty/adhoc/placeholder body is a defect.
      # Structural only (content quality is judgment, never this gate's job). Runs
      # only on pull_request (a body exists only then); reads the body from the
      # event payload IN-SCRIPT (never a step env: — that would print author text
      # in the log), and drives its required headings + placeholders off dotty's
      # committed template so the two can't drift. Uses the runner's system python3
      # (no deps), so it gates every PR regardless of the caller's pre-commit setup.
      #
      # EXEMPT: a dependency bot. The template is PR discipline for an author
      # who is making claims a reviewer will verify; a bot's body is a changelog
      # and a compatibility score it generated itself, and it will never match
      # pr-body:v1 no matter how long the PR sits. The failure is receipted —
      # every open dependabot PR in the estate fails this check today
      # (susuwatari-config #27, dotty-private #163/#164/#165), which is one of
      # the two reasons no bot PR in this estate has ever gone green.
      #
      # `pull_request.user.login`, exact match against the DECLARED list in
      # dotty's `rulesets/default-branch.json` — never a `[bot]` suffix test,
      # which would also exempt claude-the-enduring[bot], the App that opens
      # every agent-authored PR in this estate and exactly the author this gate
      # exists for.
      #
      # The list, not a literal, and the failure that moved it there: the same
      # set of bot logins is read by estate-margot.yml's skip check and by its
      # autonomous merge. A third hard-coded copy here would mean that adding a
      # second dependency bot to the declared list left its PRs failing THIS
      # check forever — green nowhere, merged never — which is precisely the
      # stall the declared list exists to remove. Three consumers, one list.
      #
      # The test runs IN-SCRIPT rather than in the step `if:` because the list
      # lives in a file the job has to read. The login arrives through `env:`,
      # which is safe for a login (it is matched, never expanded into a command);
      # the PR BODY still never goes through `env:`, for the reason above.
      - name: "pr-body-template (gates the job): PR body follows pr-body:v1"
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          rulesets="$GITHUB_WORKSPACE/_dotty/rulesets/default-branch.json"
          if [[ -f "$rulesets" ]] && \
             jq -e --arg a "$PR_AUTHOR" '(.dependency_bot_authors // []) | index($a)' "$rulesets" >/dev/null; then
            echo "::notice::pr-body-template skipped — $PR_AUTHOR is a declared dependency bot. Its body is a generated changelog, not claims a reviewer verifies."
            exit 0
          fi
          python3 "$GITHUB_WORKSPACE/_dotty/.github/scripts/pr-body-check.py" \
            --template "$GITHUB_WORKSPACE/_dotty/.github/pull_request_template.md"

  # --- house-code / house-scaffold / shellcheck / ruff / vulture as CI
  # jobs, run UNCONDITIONALLY on every caller (never gated on
  # the caller's own .pre-commit-config.yaml, present or not, wired or not).
  # Each is its own job -- not a step folded into universal-checks -- so it
  # posts its own check-run (universal-ci / <job-id>, since every caller's
  # own ci.yml names the calling job "universal-ci") and can be declared a
  # required context in rulesets/default-branch.json independently. Every
  # caller's own `all-checks-passed` job already depends on `universal-ci`
  # (the job that `uses:` this reusable workflow); a job added here rolls
  # into that dependency's result with no change needed in any of the 12
  # callers' own ci.yml.
  #
  # Why: house-style clause 1 ("a house-code/house-cited-paths/
  # house-scaffold/shellcheck finding on a changed line") and
  # maintainable-no-slop's linter-flags are a paid reviewer re-deriving a
  # mechanical check, every PR, on every repo. DW#6: once a check is stable
  # enough to state precisely, it belongs in CI -- a linter receipt, not a
  # reviewer. These five jobs are that receipt. (house-cited-paths, named in
  # the card text, has no corresponding hook anywhere in this repo -- see
  # the PR description; not invented here.)
  house-code:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0

      - name: Checkout dotty (pinned, for the mandatory-hooks config + hook scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lexijamesesq/dotty
          ref: ${{ inputs.dotty_ref }}
          path: _dotty

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: pip install pre-commit==4.6.0

      # HC_NO_OVERLAY: a CI runner never holds the real roster (same reason
      # universal-checks' own pre-commit step sets it). GH_TOKEN: house-code.py's
      # verify_is_dotty() shells out to `gh api repos/{owner}/{repo}` to gate its
      # own dogfood-fixture exemption live; github.token is read-only
      # public-metadata scope, sufficient for that one lookup.
      - name: "house-code (mandatory: runs regardless of the caller's own pre-commit wiring)"
        working-directory: repo
        env:
          HC_NO_OVERLAY: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          pre-commit run --config ../_dotty/.github/estate-ci-mandatory-hooks.yaml \
            --all-files house-code

  house-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0

      - name: Checkout dotty (pinned, for the mandatory-hooks config + hook scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lexijamesesq/dotty
          ref: ${{ inputs.dotty_ref }}
          path: _dotty

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: pip install pre-commit==4.6.0

      # Runs all three scaffold hooks and reports every failure together
      # (not just the first) -- each hook scans the whole tracked tree
      # itself (pass_filenames: false), so there is no file-list argument
      # to split across them.
      - name: "house-scaffold (mandatory: no-tracked-scratch / sample-shape / sample-placeholder)"
        working-directory: repo
        run: |
          set -uo pipefail
          fail=0
          for hook in house-scaffold-no-tracked-scratch house-scaffold-sample-shape house-scaffold-sample-placeholder; do
            pre-commit run --config ../_dotty/.github/estate-ci-mandatory-hooks.yaml \
              --all-files "$hook" || fail=1
          done
          exit "$fail"

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0

      - name: Checkout dotty (pinned, for the mandatory-hooks config)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lexijamesesq/dotty
          ref: ${{ inputs.dotty_ref }}
          path: _dotty

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: pip install pre-commit==4.6.0

      # shellcheck-py (pinned in the mandatory-hooks config, same rev as
      # dotty's own .pre-commit-config.yaml) auto-selects tracked shell
      # files via its own manifest's `types: [shell]` -- no manual file
      # discovery here. A repo with no shell files is a clean no-op pass.
      - name: "shellcheck (mandatory: runs regardless of the caller's own pre-commit wiring)"
        working-directory: repo
        run: |
          pre-commit run --config ../_dotty/.github/estate-ci-mandatory-hooks.yaml \
            --all-files shellcheck

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install uv (uvx)
        run: pip install uv==0.11.22

      # F401 (unused import) only -- the estate-wide minimum: near-zero
      # false-positive surface (ruff already accounts for __all__
      # re-exports), so no repo-specific config is needed to adopt this
      # estate-wide. A repo can extend its own selection via its own ruff
      # config for anything beyond this floor; that config is additive,
      # never required for THIS check to be clean. A repo with no tracked
      # python files is a clean no-op pass, not a failure or a skip.
      - name: "ruff --select F401 (mandatory; DW#6 -- house-style clause 1 / maintainable-no-slop linter-flags, moved to CI)"
        working-directory: repo
        run: |
          set -euo pipefail
          mapfile -t py_files < <(git ls-files -- '*.py')
          if [ "${#py_files[@]}" -eq 0 ]; then
            echo "::notice::no tracked python files in this repo -- nothing for ruff to check."
            exit 0
          fi
          uvx ruff@0.16.5 check --select F401 --force-exclude "${py_files[@]}"

  vulture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install uv (uvx)
        run: pip install uv==0.11.22

      # --min-confidence 80: vulture's own default (60) flags unused
      # functions/classes/methods/attributes on pattern alone and is noisy
      # estate-wide (framework/decorator-dispatched code reads as "unused"
      # to static analysis) -- this is the minimal shared config the estate
      # needs, not a per-repo tuning knob (see the PR description for the
      # audit that set it). At 80, vulture keeps unused imports (~90%
      # confidence) and unreachable code (100%) -- close to ruff's own
      # F401 plus dead-code detection, deliberately narrow. A repo with a
      # real residual finding at this floor is a named finding, not this
      # check's false positive; see the PR description's repo x check
      # matrix. A repo with no tracked python files is a clean no-op pass.
      - name: "vulture --min-confidence 80 (mandatory; DW#6 -- maintainable-no-slop linter-flags, moved to CI)"
        working-directory: repo
        run: |
          set -euo pipefail
          mapfile -t py_files < <(git ls-files -- '*.py')
          if [ "${#py_files[@]}" -eq 0 ]; then
            echo "::notice::no tracked python files in this repo -- nothing for vulture to check."
            exit 0
          fi
          uvx vulture@2.16 --min-confidence 80 "${py_files[@]}"
