name: Estate CI (the floor, untrusted lane)
# Reusable: every repo's ci.yml calls this on `pull_request` (and on `push` to
# main). ONE hosted job -- GitHub bills each hosted job a whole minute however
# short it runs, so the floor is one job, not a chain of them.
#
# This is the half of the floor that RUNS PR-CONTROLLED CODE (the repo's own
# .pre-commit-config.yaml names arbitrary hooks), so it runs in the
# `pull_request` context with NO secrets and no environment: a PR that edits its
# own ci.yml can redirect nothing, because nothing is here to redirect. The
# trusted half -- the operator gitleaks overlay, Margot's App key, the hand-off
# to Margot -- is estate-gate.yml, resolved from the default branch on
# `pull_request_target`, which a PR cannot rewrite.
#
# ORDER (operator, 2026-09-26): Jev FIRST. estate-gate dispatches Jev's triage
# the moment the PR event fires; Jev posts the `margot-triage` check on the
# head. This job waits for it (bounded, fail-closed to "not mechanical"), then:
#   mechanical  -> nothing more to run here (actionlint + zizmor only when a
#                  workflow file changed); the job completes green.
#   functional  -> the full suite once: pre-commit change-scoped (lint, format,
#                  house rules), actionlint, zizmor, the PR-body template.
# The lint/format hooks, the PR-body check and the repo's own test jobs (gated
# in the caller on this job's `mechanical` output) are skipped on a mechanical
# PR -- the release that produced the tag already ran the hooks, and the
# operator ruled the test suite has no point on a PR the triage has identified
# as mechanical. The secret scan is NOT here: it is estate-gate's, once per
# trigger point (the retired base-rules lane that used to run here scanned the
# same input three more times with a weaker ruleset).
#
# This job's check is a required context (`floor / floor` -- the caller's job
# id / this job id) beside `trusted-scan / trusted-scan`. The old
# `all-checks-passed` aggregator job (3 seconds, one billed minute) is folded
# into it where a repo has no jobs of its own.

on:
  workflow_call:
    inputs:
      dotty_ref:
        description: >-
          The exact ref this reusable was called at (the caller's own `uses:` ref,
          repeated here) -- used to check out dotty's rulesets, checkers and
          composite actions at the identical pin.
        required: true
        type: string
      triage_wait_seconds:
        description: >-
          How long to wait for the `margot-triage` check on the head before
          treating the PR as not mechanical (fail-closed to the full suite).
        required: false
        type: number
        default: 120
    outputs:
      mechanical:
        description: "true when the PR took the mechanical path"
        value: ${{ jobs.floor.outputs.mechanical }}

permissions:
  contents: read

env:
  MARGOT_APP_ID: "4862659"

jobs:
  floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mechanical: ${{ steps.triage.outputs.mechanical }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          fetch-depth: 0

      - name: Checkout dotty (pinned, for the rulesets, checkers and composite actions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lexijamesesq/dotty
          ref: ${{ inputs.dotty_ref }}
          path: _dotty

      # --- Jev first ---------------------------------------------------------
      - name: Does this repo's gate hand the PR to Margot? (old gate.yml = no triage to wait for)
        id: handoff
        if: github.event_name == 'pull_request'
        working-directory: repo
        run: |
          set -euo pipefail
          if grep -q 'MARGOT_APP_KEY' .github/workflows/gate.yml 2>/dev/null; then
            echo "handoff=true" >> "$GITHUB_OUTPUT"
          else
            echo "handoff=false" >> "$GITHUB_OUTPUT"
            echo "::notice::gate.yml does not pass MARGOT_APP_KEY -- an un-rolled caller; no margot-triage will be posted, so the full suite runs (today's behaviour)."
          fi

      - name: Wait for Jev's triage (the newest completed `margot-triage` check on this head), bounded
        id: triage
        if: github.event_name == 'pull_request' && steps.handoff.outputs.handoff == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WAIT: ${{ inputs.triage_wait_seconds }}
          APP_ID: ${{ env.MARGOT_APP_ID }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + WAIT ))
          text=""
          while :; do
            text="$(gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?check_name=margot-triage&app_id=${APP_ID}" \
              --jq '[.check_runs[] | select(.status=="completed")] | sort_by(.started_at, .id) | last | .output.text // empty' 2>/dev/null || true)"
            [[ -n "$text" && "$text" != "null" ]] && break
            if (( $(date +%s) >= deadline )); then
              echo "::notice::no margot-triage check on ${HEAD_SHA} within ${WAIT}s -- treating the PR as NOT mechanical (fail-closed to the full suite)."
              text=""
              break
            fi
            sleep 5
          done
          mechanical=false
          if [[ -n "$text" ]]; then
            mechanical="$(printf '%s' "$text" | jq -r --arg sha "$HEAD_SHA" \
              'if (type=="object" and .mechanical==true and .decision_source=="jev" and .head_sha==$sha) then "true" else "false" end' 2>/dev/null || echo false)"
            echo "margot-triage: $(printf '%s' "$text" | jq -c . 2>/dev/null || echo '<unparseable>')"
          fi
          echo "mechanical=${mechanical}" >> "$GITHUB_OUTPUT"
          echo "suite: $([[ "$mechanical" == true ]] && echo mechanical || echo functional)"

      - name: Which files changed (workflow files decide whether actionlint/zizmor run on a mechanical PR)
        id: files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPO}/pulls/${PR}/files" --jq '.[].filename' > "$RUNNER_TEMP/changed-files.txt"
          if grep -qE '^\.github/(workflows|actions)/' "$RUNNER_TEMP/changed-files.txt"; then
            echo "workflows=true" >> "$GITHUB_OUTPUT"
          else
            echo "workflows=false" >> "$GITHUB_OUTPUT"
          fi
          echo "changed files: $(wc -l < "$RUNNER_TEMP/changed-files.txt" | tr -d ' ')"

      # --- Functional suite: the hooks --------------------------------------------
      - name: Detect pre-commit config
        id: precommit_cfg
        if: github.event_name == 'pull_request' && steps.triage.outputs.mechanical != 'true'
        working-directory: repo
        run: |
          set -euo pipefail
          if [ -f .pre-commit-config.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No .pre-commit-config.yaml -- treating this repo as a legitimate empty appendix; the pre-commit hooks are skipped."
          fi

      - name: Setup vale
        if: steps.precommit_cfg.outputs.present == 'true'
        uses: ./_dotty/.github/actions/setup-vale
        with:
          version: '3.9.5'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.precommit_cfg.outputs.present == 'true'
        with:
          python-version: '3.12'

      - name: Install pre-commit + uv
        if: steps.precommit_cfg.outputs.present == 'true'
        run: pip install pre-commit==4.6.0 uv==0.11.22

      - name: Setup gitleaks (the suite's staged/commit-msg hooks need the binary; no scan of the PR runs here)
        if: steps.precommit_cfg.outputs.present == 'true'
        uses: lexijamesesq/dotty/.github/actions/setup-gitleaks@4e9fcf7fec358580d773b8c9bc1616a116fb99b4 # includes the pinned-checksum fix (#221)
        with:
          version: '8.30.1'

      - name: "pre-commit run (change-scoped to the PR, all hooks incl. house-code)"
        if: steps.precommit_cfg.outputs.present == 'true'
        working-directory: repo
        env:
          GL_NO_OVERLAY: "1"
          HC_NO_OVERLAY: "1"
          GH_TOKEN: ${{ github.token }}
          PC_FROM_REF: ${{ github.event.pull_request.base.sha }}
          PC_TO_REF: ${{ github.event.pull_request.head.sha }}
        run: >
          pre-commit run --show-diff-on-failure
          --from-ref "$PC_FROM_REF" --to-ref "$PC_TO_REF"

      # --- Workflow guards: functional always; mechanical only when a workflow file changed ---
      - name: Install actionlint
        if: github.event_name != 'pull_request' || steps.triage.outputs.mechanical != 'true' || steps.files.outputs.workflows == 'true'
        run: |
          set -euo pipefail
          ver="1.7.12"
          base="https://github.com/rhysd/actionlint/releases/download/v${ver}"
          tmp="$(mktemp -d)"; cd "$tmp"
          tarball="actionlint_${ver}_linux_amd64.tar.gz"
          curl -sSfL -o "$tarball" "${base}/${tarball}"
          curl -sSfL -o checksums.txt "${base}/actionlint_${ver}_checksums.txt"
          line="$(grep -E "[[:space:]]${tarball}\$" checksums.txt)"
          [ "$(printf '%s\n' "$line" | wc -l)" -eq 1 ]
          printf '%s\n' "$line" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: "actionlint (gates the job): flags expression-injection in run blocks by default"
        if: github.event_name != 'pull_request' || steps.triage.outputs.mechanical != 'true' || steps.files.outputs.workflows == 'true'
        working-directory: repo
        run: |
          shopt -s globstar nullglob
          files=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no workflow files in this repo"; exit 0
          fi
          actionlint "${files[@]}"

      - name: Setup zizmor
        if: github.event_name != 'pull_request' || steps.triage.outputs.mechanical != 'true' || steps.files.outputs.workflows == 'true'
        uses: ./_dotty/.github/actions/setup-zizmor
        with:
          version: '1.30.0'

      - name: "zizmor (gates the job): SHA-pin enforcement + template-injection"
        if: github.event_name != 'pull_request' || steps.triage.outputs.mechanical != 'true' || steps.files.outputs.workflows == 'true'
        working-directory: repo
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN || true
          zizmor --offline --min-confidence high \
            --config "$GITHUB_WORKSPACE/_dotty/.github/zizmor.yml" \
            .github/

      # --- Functional suite: the PR body follows the template ----------------------
      - name: "pr-body-template (gates the job): PR body follows pr-body:v1"
        if: github.event_name == 'pull_request' && steps.triage.outputs.mechanical != 'true'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          rulesets="$GITHUB_WORKSPACE/_dotty/rulesets/default-branch.json"
          if [[ -f "$rulesets" ]] && \
             jq -e --arg a "$PR_AUTHOR" '(.dependency_bot_authors // []) | index($a)' "$rulesets" >/dev/null; then
            echo "::notice::pr-body-template skipped — $PR_AUTHOR is a declared dependency bot. Its body is a generated changelog, not claims a reviewer verifies."
            exit 0
          fi
          python3 "$GITHUB_WORKSPACE/_dotty/.github/scripts/pr-body-check.py" \
            --template "$GITHUB_WORKSPACE/_dotty/.github/pull_request_template.md"

      - name: Mechanical PR — nothing more runs here
        if: github.event_name == 'pull_request' && steps.triage.outputs.mechanical == 'true'
        run: echo "::notice::Jev classified this pull request as mechanical; the lint/format suite, the PR-body check and the repo's own test jobs are skipped. The trusted scan ran in the gate; Margot posts her verdict from the mechanical short-circuit."
