name: Gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  checks:
    uses: lexijamesesq/dotty/.github/workflows/estate-pr-ci.yml@v2026.10.11-2
    secrets:
      OPERATOR_RULES: ${{ secrets.OPERATOR_RULES }}
      MARGOT_APP_KEY: ${{ secrets.MARGOT_APP_KEY }}
      MARGOT_JEV_KEY: ${{ secrets.MARGOT_JEV_KEY }}
      MARGOT_ANTHROPIC_TOKEN: ${{ secrets.MARGOT_ANTHROPIC_TOKEN }}
