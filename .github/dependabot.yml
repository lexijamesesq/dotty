version: 2
updates:
  # Third-party actions only, in practice. This repository's OWN reusable
  # workflows are consumed by their callers at the floating `v1` tag that
  # release-on-merge moves, so there is no per-release pin to bump any more —
  # what is left for Dependabot here is actions/checkout, setup-python and the
  # rest, which are SHA-pinned and cannot float.
  #
  # `daily`, not `weekly`: a SHA-pinned action's bump is a security update, and
  # a week of latency on it is the cost of a cadence chosen for a fan-out that
  # no longer exists. These PRs merge themselves on green
  # (.github/workflows/dependabot-automerge.yml), so cadence costs attention
  # only when something fails.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
