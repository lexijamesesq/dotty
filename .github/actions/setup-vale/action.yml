name: Setup vale
description: >-
  Install a specific, checksum-verified Vale release and put it on PATH, so the
  reusable CI lane can run the estate's Vale self-narration pre-commit hook
  authoritatively. Missing Vale is a visible failure locally and in CI. Release
  version and platform checksums are shared with checkout readiness in release.sh;
  hashes are verified at pin time against the published release checksums.
inputs:
  version:
    description: Vale version to install, without a leading "v" (e.g. "3.9.5").
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install vale ${{ inputs.version }}
      shell: bash
      env:
        VALE_VERSION: ${{ inputs.version }}
        VALE_RELEASE_FILE: ${{ github.action_path }}/release.sh
      run: |
        set -euo pipefail
        # shellcheck source=/dev/null
        source "$VALE_RELEASE_FILE"
        ver="${VALE_VERSION:-$VALE_RELEASE_VERSION}"
        expected_sha256="$(vale_release_checksum "$ver" Linux_64-bit)" || {
          echo "::error::setup-vale: no reviewed checksum for version $ver -- update release.sh before bumping." >&2
          exit 1
        }
        base="https://github.com/errata-ai/vale/releases/download/v${ver}"
        tmp="$(mktemp -d)"
        cd "$tmp"
        # Keep the release's own filename so `sha256sum -c`-style verification
        # reads the same path it hashes (matches setup-gitleaks' rationale).
        tarball="vale_${ver}_Linux_64-bit.tar.gz"
        curl -sSfL -o "$tarball" "${base}/${tarball}"

        actual_sha256="$(sha256sum "$tarball" | awk '{print $1}')"
        if [[ "$actual_sha256" != "$expected_sha256" ]]; then
          echo "::error::setup-vale: checksum mismatch for $tarball -- expected $expected_sha256, got $actual_sha256. Refusing to install." >&2
          exit 1
        fi

        tar -xzf "$tarball" vale
        sudo install -m 0755 vale /usr/local/bin/vale
        vale --version
