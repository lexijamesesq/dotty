name: Setup gitleaks
description: >-
  Install a specific, checksum-verified gitleaks release and put it on PATH.
  Extracted from the curl+checksum block duplicated verbatim across dotty's
  and Wiki's workflows (LEX-709) — one place to bump the version, same
  verification logic. Not a substitute for `gitleaks/gitleaks-action`: that
  action runs its own self-contained scan with no documented way to leave
  the binary on PATH for a later step, which dotty's eval suite requires
  (its pre-commit gitleaks-hooks tests shell out to a real `gitleaks`
  binary), and its default PR-scan-range and `gitleaks:allow` handling are
  undocumented — adopting it would silently change security behavior this
  repo currently controls explicitly via `--log-opts`/`--ignore-gitleaks-allow`.
  See dotty's `.github/CI.md` for the full rejection record.
inputs:
  version:
    description: gitleaks version to install, without a leading "v" (e.g. "8.30.1").
    required: true
    default: "8.30.1"
runs:
  using: composite
  steps:
    - name: Install gitleaks ${{ inputs.version }}
      shell: bash
      run: |
        set -euo pipefail
        ver="${{ inputs.version }}"
        base="https://github.com/gitleaks/gitleaks/releases/download/v${ver}"
        tmp="$(mktemp -d)"
        cd "$tmp"
        # Keep the release's own filename. `sha256sum -c` reads the FILENAME
        # from the checksums line and opens that path — downloading to a
        # different name makes it fail to open the very file it is verifying.
        tarball="gitleaks_${ver}_linux_x64.tar.gz"
        curl -sSfL -o "$tarball" "${base}/${tarball}"
        curl -sSfL -o checksums.txt "${base}/gitleaks_${ver}_checksums.txt"
        line="$(grep -E "[[:space:]]${tarball}\$" checksums.txt)"
        [ "$(printf '%s\n' "$line" | wc -l)" -eq 1 ]   # exactly one match, or fail
        printf '%s\n' "$line" | sha256sum -c -
        tar -xzf "$tarball" gitleaks
        sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
        gitleaks version
