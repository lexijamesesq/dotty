# gitleaks config for dotty (public Claude Code infrastructure repo).
# Operator-specific PII rules loaded from .gitleaks-operator-rules.toml
# (gitignored symlink -> ~/bin/dotty-private/gitleaks-operator-rules.toml).

title = "dotty gitleaks config"

[extend]
path = ".gitleaks-operator-rules.toml"

[allowlist]
paths = [
  '''\.gitleaks\.toml$''',
  '''eval/golden-fixtures/''',
  '''.claude/rules/''',
  '''LICENSE$''',
  '''\.claude/agents/''',
  '''README\.md$''',
  '''CLAUDE\.sample\.md$''',
  '''settings\.sample\.json$''',
]
