# gitleaks config for dotty (public Claude Code infrastructure repo).
# Operator-specific PII rules load from the FIXED install path
# (${XDG_CONFIG_HOME:-$HOME/.config}/gitleaks/operator-rules.toml), installed by
# the operator's blueprint (gitleaks-rules slice -- apply). The [extend] path
# below is a repo-relative TOKEN, not a real on-disk path, and it is never
# rewritten: gitleaks resolves a relative [extend] path against the PROCESS
# cwd, so git-hooks/gitleaks-common.sh's gl_resolve builds a small resolution
# directory holding one entry under that name -- a symlink to the installed
# ruleset, or a base-rules-only stub in the CI lane that asks for one -- and
# runs gitleaks from there. That installed path cannot live in this file: $HOME
# differs per machine and TOML cannot interpolate. There is no
# checkout-relative symlink and no fallback -- see gl_resolve for the contract.
#
# There is deliberately no [allowlist] paths block. A path allowlist suppresses
# EVERY rule for matching paths -- gitleaks' own default secret rules as well as
# the operator rules -- so each entry is a total scanner blind spot, not a
# PII-only exemption. The eight entries removed on 2026-07-09 suppressed zero
# false positives and hid nine true-positive operator-path findings in public
# history from every hook that reads this config.
#
# To suppress a verified false positive, add a per-rule allowlist in the
# generated operator-rules file (see gitleaks-registry/RULE-SHAPES.md), which is
# breadth-validated at generation time. Never re-add a path entry here.

title = "dotty gitleaks config"

[extend]
path = ".gitleaks-operator-rules.toml"
