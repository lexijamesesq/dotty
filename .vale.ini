# Vale config for the estate's shared prose gate.
#
# ONE rule ships here: Estate.SelfNarration (self-narration ban) — the enforced
# subset of the retired qa.py's self-narration scan (slice 2b). It bans
# an artifact body narrating its own provenance/authorship ("Generated by
# Claude", "🤖 Generated", "Co-Authored-By: Claude", "(generated by Claude)"):
# authorship belongs in git history / Linear / PR metadata, not the doc body,
# because the body is context input to the next session.
#
# StylesPath is resolved by Vale relative to THIS file's own directory (verified),
# so the wrapper hook (git-hooks/vale-self-narration.sh) points --config here and
# the Estate style resolves from any working directory / pre-commit cache clone.
#
# MinAlertLevel = error: only error-level rules surface and set a non-zero exit —
# Estate.SelfNarration is level:error, so a hit blocks; nothing else does.
# Vale skips fenced-code blocks and inline code natively — a banned phrase quoted
# as a code example is not narration and does not trip (this is the FP mitigation;
# doc prose that discusses a banned phrase must backtick it).
StylesPath = styles
MinAlertLevel = error

[*.md]
BasedOnStyles = Estate
