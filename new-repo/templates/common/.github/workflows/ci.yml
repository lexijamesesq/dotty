name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A PR's runs group on its ref (refs/pull/<N>/merge), so a new push cancels the
# superseded run. A push to the default branch groups on its own sha and is
# never cancelled: GitHub keeps only one pending run per group, so a shared
# group would silently drop a pending push run -- and with it any job a repo
# adds that must run on every merge, such as a release job.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  floor:
    # The required check is `ci / checks`: this job's name, then the called
    # job's (estate-ci.yml's check_name). Convention `<lane> / <what it checks>`.
    name: ci
    # Read scopes the floor uses with github.token (Jev's triage answer on the
    # head's check-runs). A called workflow gets no more than this; on a
    # private repo the triage read 403s without it and the PR runs the full
    # suite. No write scope, no secret: this is the lane a PR controls.
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: lexijamesesq/dotty/.github/workflows/estate-ci.yml@v1
    with:
      dotty_ref: v1
      check_name: checks
