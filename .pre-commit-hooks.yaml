# .pre-commit-hooks.yaml — makes dotty's fail-closed gitleaks hooks, and the
# house-code + scaffold hooks, consumable by other repos that do NOT vendor
# dotty. A consumer repo adds to its own .pre-commit-config.yaml:
#
#     default_install_hook_types: [pre-commit, pre-push, commit-msg]
#     default_stages: [pre-commit]   # REQUIRED — see note below
#     repos:
#       - repo: https://github.com/<owner>/dotty
#         rev: <tag-or-sha>          # pin; bump with `pre-commit autoupdate`
#         hooks:
#           - id: gitleaks-staged
#           - id: gitleaks-pre-push
#           - id: gitleaks-commit-msg
#           - id: house-code
#             # exclude: '^(tests?/|fixtures?/)'
#             # ^ per-consumer exemption for this repo's own detector
#             # definitions / test suites (pre-commit's native `exclude`,
#             # never a bespoke allowlist file) — house-code takes files as
#             # args, so `exclude:` works directly.
#           - id: house-scaffold-no-tracked-scratch
#           - id: house-scaffold-sample-shape
#             # args: ['--exclude', 'tests?/|fixtures?/']
#             # ^ the scaffold hooks read the whole tracked tree themselves
#             # (pass_filenames: false), so pre-commit's own `exclude:` has
#             # no file list to filter — pass exemptions as this hook's OWN
#             # --exclude flag (repeatable) instead.
#           - id: house-scaffold-sample-placeholder
#
# `default_stages: [pre-commit]` is not optional. A hook that declares no
# `stages` key runs at every INSTALLED stage, so adding the pre-push and
# commit-msg hook types would otherwise promote the consumer's own unpinned
# hooks (linters, syntax checks) to those stages — where, at commit-msg, the
# file they are handed is the commit message itself, not the tracked tree.
# A hook whose own manifest declares `stages` overrides this default; every
# hook below pins its stages explicitly and is unaffected either way.
#
# pre-commit clones dotty into its cache and runs the scripts from there, so
# the hook LOGIC lives in exactly one place (this repo). No copy is synced into
# the consumer. Each consumer still supplies its own .gitleaks.toml — the
# scripts derive the repo root and config at runtime, so the same hooks serve
# every repo. See git-hooks/gitleaks-common.sh for the fail-closed contract and
# how the operator ruleset a config extends is resolved.
#
# dotty-private consumes house-code too, in its own .pre-commit-config.yaml —
# using this hook's own declaration mechanism, not a blanket exception. A root
# .house-code.json sets private_repo: true (verified live against the repo's
# GitHub visibility; this disables vault-path-leak ONLY, since a private infra
# repo carries real paths by design) and declares narrow roster-name-leak
# exemptions for the few files that legitimately hold the operator rules and the
# roster — the same files its own .gitleaks.toml allowlists. ticket-id-leak and
# internal-section-reference-leak run there unexempted, like everywhere else.

- id: gitleaks-staged
  name: gitleaks (staged secret + operator-pattern scan)
  description: Fail-closed scan of the staged diff before a commit is created.
  entry: git-hooks/gitleaks-staged.sh
  language: script
  pass_filenames: false
  stages: [pre-commit]

- id: gitleaks-pre-push
  name: gitleaks (outgoing commit-range scan)
  description: >-
    Fail-closed scan of the outgoing commit range before push. The range comes
    from pre-commit's own PRE_COMMIT_FROM_REF/PRE_COMMIT_TO_REF, or a
    merge-base against the default branch for a branch with no remote
    counterpart yet. A finding blocks the push; so does a range this hook
    cannot resolve, which reports why rather than passing unscanned.
  entry: git-hooks/gitleaks-pre-push.sh
  language: script
  pass_filenames: false
  always_run: true
  stages: [pre-push]

- id: gitleaks-commit-msg
  name: gitleaks (commit message scan)
  description: Fail-closed scan of the commit message text.
  entry: git-hooks/gitleaks-commit-msg.sh
  language: script
  stages: [commit-msg]

- id: house-code
  name: house-code (ticket id / vault path / roster name / section-ref scan)
  description: >-
    Fail-closed scan of every tracked non-binary file for the four
    house-code patterns. Findings report a rule id, file, and count only —
    never the matched text.
  entry: git-hooks/house-code.py
  args: ['--']
  # The trailing -- means pre-commit's own appended filenames always land
  # after it, so argparse treats every one of them as literal positional
  # text regardless of a leading dash -- a pressure-test finding: a tracked
  # file literally named -h (or --rosters-path=<decoy>) reaching this
  # parser without one silenced the whole scan (or silently redirected the
  # roster source). Belt and braces alongside the parser's own dash-guard
  # (house-code.py: any positional entry that still looks like an option is
  # refused outright) -- this closes the gap at the actual call site, not
  # only in the parser.
  language: script
  types: [text]
  stages: [pre-commit]

- id: vale-self-narration
  name: vale-self-narration (no provenance/authorship narration in artifact bodies)
  description: >-
    Runs Vale's Estate.SelfNarration rule over markdown: bans an artifact body
    narrating its own provenance/authorship ("Generated by Claude", "🤖
    Generated", "Co-Authored-By: Claude", "(generated by Claude)"). Authorship
    belongs in git history / Linear / PR metadata, not the doc body. Fails open
    locally if the vale binary is absent (the required CI check enforces it, where
    setup-vale installs the pinned binary); Vale skips code blocks/inline code
    natively, so a phrase quoted as a code example does not trip. Re-homed from the
    retired qa.py's self-narration scan.
  entry: git-hooks/vale-self-narration.sh
  language: script
  types: [markdown]
  stages: [pre-commit]

- id: house-scaffold-no-tracked-scratch
  name: house-scaffold (no evals/ or scratch/ tracked)
  description: Fails if a non-shipping evals/ or scratch/ directory is tracked.
  entry: git-hooks/house-scaffold-no-tracked-scratch.sh
  language: script
  pass_filenames: false
  always_run: true
  stages: [pre-commit]

- id: house-scaffold-sample-shape
  name: house-scaffold (operator-config sample shape)
  description: >-
    Every operator-config reference in a tracked file must have a tracked
    counterpart or a *.sample.*/*.example.* shape.
  entry: git-hooks/house-scaffold-sample-shape.sh
  language: script
  pass_filenames: false
  always_run: true
  stages: [pre-commit]

- id: house-scaffold-sample-placeholder
  name: house-scaffold (sample placeholder integrity)
  description: Every tracked *.sample.* file must carry a placeholder marker.
  entry: git-hooks/house-scaffold-sample-placeholder.sh
  language: script
  pass_filenames: false
  always_run: true
  stages: [pre-commit]
