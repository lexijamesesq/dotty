# Estate.SelfNarrationProvenance — provenance parenthetical (group 2 of the
# self-narration ban). Sibling of Estate.SelfNarration; same intent, separate
# rule because it needs nonword.
#
# Bans an inline authorship note in parentheses: "(generated by Claude)",
# "(written by AI)", "(authored by this skill)", "(created by an LLM)". The verb
# set and the by-agent set are the precise ones from the retired qa.py; the
# "(reviewed by the team)" / "(edited by Lexi)" shapes do NOT match (the agent
# must be Claude / AI / an LLM / a language model / this skill|script|agent).
#
# nonword: true is REQUIRED and is the whole reason this is a separate rule: an
# existence token is wrapped in \b…\b by default, and a leading "\(" can never
# match at the "(" boundary — a straight regex port ships INERT (a vacuous gate,
# confirmed empirically). nonword disables that wrapping so the escaped parens
# match; it is safe here because the token is a long, paren-anchored pattern, not
# a short bare word (unlike group 1, which needs the boundaries).
extends: existence
message: "Self-narration provenance parenthetical (%s): drop the authorship note — provenance belongs in git history / Linear / PR metadata, not the artifact body."
level: error
ignorecase: true
nonword: true
tokens:
  - '\((?:[^)]{0,80}(?:generated|written|authored|drafted|produced|created) by (?:Claude|AI|an? (?:LLM|language model)|this (?:skill|script|agent))[^)]{0,40})\)'
