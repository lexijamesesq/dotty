# Estate.SelfNarration — generator self-naming (group 1 of the self-narration ban).
#
# Bans the distinctive provenance/authorship phrases an AI-authored artifact leaks
# into its own body. Default word-boundary wrapping (nonword unset) is deliberate:
# it protects the short tokens from substring false positives — "I am Claude" does
# NOT fire on "I am Claudia", "As an AI, I" does NOT fire on "was an AI, I think".
# The parenthetical form needs nonword and lives in the sibling rule
# SelfNarrationProvenance.yml (a leading "\(" cannot match under \b wrapping —
# an empirically-confirmed Vale footgun, which is why the two shapes are two rules).
#
# ignorecase: true catches lowercased leaks ("generated by claude") with no added
# false positives (word boundaries still guard the short tokens). Tokens are the
# PRECISE subset — tightened from the retired advisory qa.py for a zero-FP enforced
# gate: the bare "As an AI" / "I am an AI" of qa.py would false-positive on legit
# prose ("As an AI researcher", "I am an AI enthusiast"), so this targets the
# actual disclaimer voice ("As an AI, I", "As an AI language model") instead.
extends: existence
message: "Self-narration (%s): authorship/provenance belongs in git history, Linear, or PR metadata — not the artifact body. Remove it, or backtick it if you are quoting it as an example."
level: error
ignorecase: true
tokens:
  - 'Generated by Claude'
  - 'Generated with Claude Code'
  - '🤖 Generated'
  - 'Co-Authored-By:\s*Claude'
  - "I am Claude"
  - "I'm Claude"
  - 'As an AI language model'
  - 'As a large language model'
  - 'As an AI, I'
