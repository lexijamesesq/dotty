# Shared local checks. Remote consumers use the same script exports at a release.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (python lint — no estate python ships unlinted)
        entry: uvx ruff@0.16.10 check --fix --force-exclude
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-format
        name: ruff-format (python formatter — no estate python ships unformatted)
        entry: uvx ruff@0.16.10 format --force-exclude
        language: system
        types: [python]
        stages: [pre-commit]

      - id: gitleaks-staged
        name: gitleaks (staged secret + operator-pattern scan)
        entry: git-hooks/gitleaks-staged.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]

      - id: gitleaks-pre-push
        name: gitleaks (full outgoing commit-range scan)
        entry: git-hooks/gitleaks-pre-push.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: gitleaks-commit-msg
        name: gitleaks (commit message scan)
        entry: git-hooks/gitleaks-commit-msg.sh
        language: script
        stages: [commit-msg]

      - id: check-file-presence
        name: check required files exist (README, LICENSE)
        entry: git-hooks/check-file-presence.sh --staged
        args: [README.md, LICENSE]
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: house-code
        name: house-code (ticket id / vault path / roster name / section-ref scan)
        entry: git-hooks/house-code.py
        language: script
        types: [text]
        stages: [pre-commit]
        # No pre-commit `exclude:` here on principle, not oversight: this
        # hook's own fixtures (this file, its eval tests) are exempted
        # INSIDE house-code.py itself (_OWN_FIXTURES), narrowly, so they
        # still get scanned and any suppression is visible to --report —
        # an `exclude:` here would make them invisible instead of counted.

      - id: vale-self-narration
        name: vale-self-narration (no provenance/authorship narration in artifact bodies)
        entry: git-hooks/vale-self-narration.sh
        language: script
        types: [markdown]
        stages: [pre-commit]

  # Workflow-tool hook activation is staged with the hosted-floor transition.
  # Existing hosted Actionlint/Zizmor audits remain active.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: end-of-file-fixer
        # Native type owners: Ruff, shfmt and HTML-only Prettier; regex: Biome.
        exclude_types: [python, shell, html]
        exclude: '\.(jsx?|tsx?|c(js|ts)|m(js|ts)|css|graphql|gql)$'
        stages: [pre-commit]
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md,markdown']
        exclude_types: [python, shell, html]
        exclude: '\.(jsx?|tsx?|c(js|ts)|m(js|ts)|css|graphql|gql)$'
        stages: [pre-commit]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        stages: [pre-commit]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        stages: [pre-commit]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        stages: [pre-commit]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        stages: [pre-commit]

  # The two web-language tools, dogfooded here as everywhere else in the suite.
  # dotty's one JS file (renovate-config.js) is biome-check's whole surface
  # here and there is no HTML, so prettier reports "no files to check" — the
  # env is still provisioned once per hook version, the cost every machine pays.
  # The tool pin rides in additional_dependencies (the hook repo's rev is a
  # manifest version, not the tool's); default.json's regex manager bumps it
  # with the rev. JSON is excluded from biome-check on purpose: Biome
  # collapses short arrays, and renovate.json / rulesets JSON are written by
  # the provisioner and jq in expanded form — two writers would revert each
  # other forever. .vue/.svelte/.astro are excluded until the estate decides
  # on them (Biome's support is experimental). See pre-commit-suite-merge.py's
  # suite comment for both.
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.14
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.5.14"]
        exclude: '\.(jsonc?|vue|svelte|astro)$'
        stages: [pre-commit]

  # mirrors-prettier is ARCHIVED upstream: this rev (the last stable tag) never
  # moves; only the prettier pin below does, capped below 4 in default.json so
  # a stable v4 cannot auto-merge past the frozen wrapper.
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [html]
        additional_dependencies: ["prettier@3.9.9"]
        stages: [pre-commit]

  - repo: local
    hooks:
      # Entry points inspect native outgoing names so deletions also select work.
      - id: dotty-hook-tests
        name: dotty hook behavior
        entry: bash .claude/eval/run-all.sh --push hooks
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: dotty-workflow-tests
        name: dotty workflow behavior
        entry: bash .claude/eval/run-all.sh --push workflows
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: dotty-release-tests
        name: dotty release behavior
        entry: bash .claude/eval/run-all.sh --push release
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: dotty-settings-tests
        name: dotty settings and provisioner behavior
        entry: bash .claude/eval/run-all.sh --push settings
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
