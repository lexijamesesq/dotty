# dotty's own pre-commit config. dotty DEVELOPS these hooks, so it consumes
# them via `repo: local` pointing at the working-tree scripts in git-hooks/
# (dogfooding the un-pinned version under development). Other repos consume the
# SAME scripts remotely via dotty's .pre-commit-hooks.yaml — the hook LOGIC
# lives once, in git-hooks/. See .pre-commit-hooks.yaml for the consumer recipe.
#
# default_install_hook_types installs all three git hook types on a bare
# `pre-commit install`, so a fresh clone cannot silently run with only the
# commit-time scan (a declared-but-uninstalled hook is a fail-OPEN gap).
default_install_hook_types: [pre-commit, pre-push, commit-msg]
#
# default_stages is REQUIRED alongside the line above. A hook that declares no
# `stages` key runs at EVERY installed stage (verified: pre-commit 4.6.0). So
# installing the pre-push and commit-msg hook types silently promotes every such
# hook to those stages — here: check-yaml, check-json, shellcheck, and the local
# check-file-presence. That matters most at commit-msg, where the file a hook is
# handed is the COMMIT MESSAGE, not the tracked tree.
#
# Note what this does NOT control: upstream end-of-file-fixer and
# trailing-whitespace declare `stages: [pre-commit, pre-push, manual]` in their
# own manifest, which overrides this default. They therefore run at pre-push
# regardless, and never at commit-msg. An explicit `stages` in a hook's manifest
# always wins over default_stages.
#
# The three gitleaks hooks below pin their own stages and are unaffected either way.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (python lint — no estate python ships unlinted)
        entry: uvx ruff check --force-exclude
        language: system
        types: [python]
        stages: [pre-commit]

      - id: gitleaks-staged
        name: gitleaks (staged secret + operator-pattern scan)
        entry: git-hooks/gitleaks-staged.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]

      - id: gitleaks-pre-push
        name: gitleaks (full outgoing commit-range scan)
        entry: git-hooks/gitleaks-pre-push.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: gitleaks-commit-msg
        name: gitleaks (commit message scan)
        entry: git-hooks/gitleaks-commit-msg.sh
        language: script
        stages: [commit-msg]

      - id: check-file-presence
        name: check required files exist (README, LICENSE)
        entry: bash -c 'missing=""; [ ! -f README.md ] && missing="$missing README.md"; [ ! -f LICENSE ] && missing="$missing LICENSE"; [ -n "$missing" ] && echo "Missing required files:$missing" && exit 1; exit 0'
        language: system
        pass_filenames: false
        always_run: true

      - id: house-code
        name: house-code (ticket id / vault path / roster name / section-ref scan)
        entry: git-hooks/house-code.py
        language: script
        types: [text]
        stages: [pre-commit]
        # house-code.py's own regex source necessarily contains the literal
        # shapes it detects (it can never pass its own check); the eval
        # fixtures deliberately embed literal ticket-id / vault-path strings
        # to prove detection works. Legitimate exemption class per this
        # ticket's own correction ("a detector's definitions and test
        # suites contain the literals they detect"), not a hidden leak —
        # native pre-commit `exclude`, no bespoke allowlist file.
        exclude: '^(git-hooks/house-code\.py|\.claude/eval/house-code\.test\.sh)$'

      - id: house-scaffold-no-tracked-scratch
        name: house-scaffold (no evals/ or scratch/ tracked)
        entry: git-hooks/house-scaffold-no-tracked-scratch.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: house-scaffold-sample-shape
        name: house-scaffold (operator-config sample shape)
        entry: git-hooks/house-scaffold-sample-shape.sh
        # pass_filenames: false — this hook reads the whole tracked tree
        # itself, so pre-commit's own `exclude:` has nothing to filter here;
        # its OWN --exclude flag (see the script) is the exemption path:
        # the eval suite's fixture file deliberately embeds config-name-like
        # strings that are not real references, and this script's own prose
        # necessarily names the exact filename shapes it detects.
        args: ['--exclude', '^(\.claude/eval/house-scaffold\.test\.sh|git-hooks/house-scaffold-sample-shape\.sh)$']
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: house-scaffold-sample-placeholder
        name: house-scaffold (sample placeholder integrity)
        entry: git-hooks/house-scaffold-sample-placeholder.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # A fast-suite pre-push hook where the repo already
      # has one. dotty's own eval suites (run-all.sh) — no new test code, the
      # existing command.
      - id: eval-suite-pre-push
        name: dotty eval suites (fast pre-push gate)
        entry: bash .claude/eval/run-all.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
