# dotty's own pre-commit config. dotty DEVELOPS these hooks, so it consumes
# them via `repo: local` pointing at the working-tree scripts in git-hooks/
# (dogfooding the un-pinned version under development). Other repos consume the
# SAME scripts remotely via dotty's .pre-commit-hooks.yaml — the hook LOGIC
# lives once, in git-hooks/. See .pre-commit-hooks.yaml for the consumer recipe.
#
# default_install_hook_types installs all three git hook types on a bare
# `pre-commit install`, so a fresh clone cannot silently run with only the
# commit-time scan (a declared-but-uninstalled hook is a fail-OPEN gap).
default_install_hook_types: [pre-commit, pre-push, commit-msg]
#
# default_stages is REQUIRED alongside the line above. A hook that declares no
# `stages` key runs at EVERY installed stage (verified: pre-commit 4.6.0). So
# installing the pre-push and commit-msg hook types silently promotes every such
# hook to those stages — here: check-yaml, check-json, shellcheck, and the local
# check-file-presence. That matters most at commit-msg, where the file a hook is
# handed is the COMMIT MESSAGE, not the tracked tree.
#
# Note what this does NOT control: upstream end-of-file-fixer and
# trailing-whitespace declare `stages: [pre-commit, pre-push, manual]` in their
# own manifest, which overrides this default. They therefore run at pre-push
# regardless, and never at commit-msg. An explicit `stages` in a hook's manifest
# always wins over default_stages.
#
# The three gitleaks hooks below pin their own stages and are unaffected either way.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (python lint — no estate python ships unlinted)
        entry: uvx ruff check --force-exclude
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-format
        name: ruff-format (python formatter — no estate python ships unformatted)
        entry: uvx ruff format --check --force-exclude
        language: system
        types: [python]
        stages: [pre-commit]

      - id: gitleaks-staged
        name: gitleaks (staged secret + operator-pattern scan)
        entry: git-hooks/gitleaks-staged.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]

      - id: gitleaks-pre-push
        name: gitleaks (full outgoing commit-range scan)
        entry: git-hooks/gitleaks-pre-push.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: gitleaks-commit-msg
        name: gitleaks (commit message scan)
        entry: git-hooks/gitleaks-commit-msg.sh
        language: script
        stages: [commit-msg]

      - id: check-file-presence
        name: check required files exist (README, LICENSE)
        entry: bash -c 'missing=""; [ ! -f README.md ] && missing="$missing README.md"; [ ! -f LICENSE ] && missing="$missing LICENSE"; [ -n "$missing" ] && echo "Missing required files:$missing" && exit 1; exit 0'
        language: system
        pass_filenames: false
        always_run: true

      - id: house-code
        name: house-code (ticket id / vault path / roster name / section-ref scan)
        entry: git-hooks/house-code.py
        language: script
        types: [text]
        stages: [pre-commit]
        # No pre-commit `exclude:` here on principle, not oversight: this
        # hook's own fixtures (this file, its eval tests) are exempted
        # INSIDE house-code.py itself (_OWN_FIXTURES), narrowly, so they
        # still get scanned and any suppression is visible to --report —
        # an `exclude:` here would make them invisible instead of counted.

      - id: vale-self-narration
        name: vale-self-narration (no provenance/authorship narration in artifact bodies)
        entry: git-hooks/vale-self-narration.sh
        language: script
        types: [markdown]
        stages: [pre-commit]

      - id: house-scaffold-no-tracked-scratch
        name: house-scaffold (no evals/ or scratch/ tracked)
        entry: git-hooks/house-scaffold-no-tracked-scratch.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: house-scaffold-sample-shape
        name: house-scaffold (operator-config sample shape)
        entry: git-hooks/house-scaffold-sample-shape.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: house-scaffold-sample-placeholder
        name: house-scaffold (sample placeholder integrity)
        entry: git-hooks/house-scaffold-sample-placeholder.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # NOT wired to pre-push, on principle, not oversight: every one of
      # dotty's eval suites creates and mutates real git repositories as
      # fixtures (nested `git init`/`checkout`/`commit`), and a pre-push
      # hook's process can reach the real object store its own push is
      # writing to. A real incident (2026-09-05, recorded on this ticket's history)
      # showed exactly this: running the suite as a pre-push hook let a
      # fixture repo's git commands write into the shared dotty bare repo
      # instead of their own isolated temp directory, corrupting the
      # shared origin/main tracking ref used by every worktree. The fix is
      # structural, not a patched fixture: a hook can never reach the real
      # object store if nothing that mutates git repos ever runs there.
      # dotty's suites stay in CI (.github/workflows/test.yml) and the
      # publish verb's dry run; a `repo: local` pre-push entry here is
      # only for a genuinely fast, non-git-mutating suite, which dotty
      # does not have today.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        stages: [pre-commit]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        stages: [pre-commit]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        stages: [pre-commit]

  # The two web-language tools, dogfooded here as everywhere else in the suite.
  # dotty's one JS file (renovate-config.js) is biome-check's whole surface
  # here and there is no HTML, so prettier reports "no files to check" — the
  # env is still provisioned once per hook version, the cost every machine pays.
  # The tool pin rides in additional_dependencies (the hook repo's rev is a
  # manifest version, not the tool's); default.json's regex manager bumps it
  # with the rev. JSON is excluded from biome-check on purpose: Biome
  # collapses short arrays, and renovate.json / rulesets JSON are written by
  # the provisioner and jq in expanded form — two writers would revert each
  # other forever (see pre-commit-suite-merge.py's suite comment).
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.14
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.5.14"]
        exclude: '\.jsonc?$'
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [html]
        additional_dependencies: ["prettier@3.9.9"]
        stages: [pre-commit]
